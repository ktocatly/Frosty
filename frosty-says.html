    who: "Peter Fonagy", src: "Epistemic trust — “The Role of Mentalizing and Epistemic Trust in the Therapeutic Relationship” (2014, with Elizabeth Allison)" },
  { t: "We seek a background feeling of safety even more than pleasure, which is why we cling to the familiar even when it isn’t good for us.",
    who: "Joseph Sandler", src: "“The Background of Safety” (1960)" },
  { t: "Say ‘I am anxious about it’ rather than ‘anxiety overwhelms me.’ Speaking as the one who feels gives you back some agency.",
    who: "Roy Schafer", src: "Action language — A New Language for Psychoanalysis (1976)" },
  { t: "Healing can mean retelling your life with a narrative of increasing agency.",
    who: "Roy Schafer", src: "Retelling a Life (1992)" },
  { t: "A coherent, convincing story about your past can heal even if you can’t know exactly what happened. Your memories don’t have to be perfect to be useful.",
    who: "Donald Spence", src: "Narrative Truth and Historical Truth (1982)" },
  { t: "Hope can survive the collapse of a whole way of life — hope for a good you can’t yet imagine.",
    who: "Jonathan Lear", src: "Radical Hope (2006)" },
  { t: "Every idea of a happy life leaves a remainder that doesn’t fit.",
    who: "Jonathan Lear", src: "Happiness, Death, and the Remainder of Life (2000)" },
  { t: "The mind isn’t transparent to itself. Self-knowledge is always partial, so stay open to being surprised by your own reasons.",
    who: "Jonathan Lear", src: "Open Minded (1998)" },
  { t: "The same people and situations that nourish us can also poison us. It’s hard to separate the two.",
    who: "Michael Eigen", src: "Toxic Nourishment (1999)" },
  { t: "Life’s first shock is beauty, along with not knowing what lies inside it. Aesthetic awe and uncertainty arrive together.",
    who: "Donald Meltzer", src: "Aesthetic conflict — The Apprehension of Beauty (1988)" },
  { t: "We each have an inner theater where old scenes are restaged with new actors.",
    who: "Joyce McDougall", src: "Theaters of the Mind (1985)" },
  { t: "When feelings can’t find words, the body may speak them instead.",
    who: "Joyce McDougall", src: "Theaters of the Body (1989)" },
  { t: "The self begins as a skin: a surface that holds, protects and communicates.",
    who: "Didier Anzieu", src: "The Skin-Ego (1985)" },
  { t: "Every creation involves some destruction.",
    who: "Sabina Spielrein", src: "“Destruction as the Cause of Coming into Being” (1912)" },
  { t: "Submission gives yourself up to another’s power. Surrender lets go of a defense so you can be known.",
    who: "Emmanuel Ghent", src: "“Masochism, Submission, Surrender” (1990)" },
  { t: "Relationships need both ritual and spontaneity: a stable frame and genuine response.",
    who: "Irwin Z. Hoffman", src: "Ritual and Spontaneity in the Psychoanalytic Process (1998)" },
  { t: "Fantasy doesn’t just fulfill desire. It teaches us how to desire, and what.",
    who: "Slavoj Žižek", src: "Fantasy — The Plague of Fantasies (1997)" },
  { t: "People know very well what they’re doing, and they do it anyway. Knowing something isn’t the same as being free of it.",
    who: "Slavoj Žižek", src: "Cynical reason — The Sublime Object of Ideology (1989)" },
  { t: "Ending on a striking word leaves it echoing. Where you stop shapes what’s heard.",
    who: "Bruce Fink", src: "A Clinical Introduction to Lacanian Psychoanalysis (1997)" },
  { t: "Images of ourselves and others develop together. Change how you see one and the other shifts.",
    who: "Edith Jacobson", src: "The Self and the Object World (1964)" },
  { t: "In mourning we internalize the lost person, sometimes adopting their phrases and habits, in order to keep them.",
    who: "Karl Abraham", src: "“A Short Study of the Development of the Libido” (1924)" },
  { t: "Painful feelings become trauma when there’s no one to share them with.",
    who: "Robert Stolorow", src: "Trauma and Human Existence (2007)" },
  { t: "A society built on competition and performance shapes who we become, and teaches us to understand failure and struggle as purely personal.",
    who: "Paul Verhaeghe", src: "What About Me? (2012)" },
];

const bubble = document.getElementById('bubble');
const byline = document.getElementById('byline');
const snowman = document.getElementById('snowman');
const countEl = document.getElementById('count');
let deck = [], n = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function next() {
  if (!deck.length) deck = shuffle(ADVICE.slice());
  return deck.pop();
}
function speak() {
  const a = next();
  n++;
  bubble.classList.remove('fresh'); void bubble.offsetWidth; bubble.classList.add('fresh');
  bubble.innerHTML = '';
  const p = document.createElement('p');
  // *word* in a line renders as italics; everything else stays plain text
  const q = document.createElement('span'); q.className = 'hang'; q.textContent = '“'; p.appendChild(q);
  // keep the last two words together so no word sits alone on the final line
  (a.t + '”').replace(/ (\S+)$/, '\u00A0$1').split(/\*([^*]+)\*/).forEach((part, i) => {
    if (i % 2) { const em = document.createElement('em'); em.textContent = part; p.appendChild(em); }
    else p.appendChild(document.createTextNode(part));
  });
  bubble.appendChild(p);
  byline.querySelector('.who').textContent = a.who;
  byline.querySelector('.src').textContent = a.src;
  countEl.textContent = 'Session ' + n;
  snowman.classList.remove('wobble'); void snowman.offsetWidth; snowman.classList.add('wobble');
}
snowman.addEventListener('click', speak);
document.getElementById('again').addEventListener('click', speak);

document.getElementById('issue').textContent =
  new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });

// Gentle snowfall
const c = document.getElementById('snowfall'), ctx = c.getContext('2d');
let flakes = [];
function size() {
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  const count = Math.min(140, Math.floor(innerWidth / 8));
  flakes = Array.from({ length: count }, () => ({
    x: Math.random() * c.width, y: Math.random() * c.height,
    r: (Math.random() * 2 + 0.8) * devicePixelRatio, s: Math.random() * 0.6 + 0.3, d: Math.random() * Math.PI * 2
  }));
}
function tick() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const f of flakes) {
    f.y += f.s * devicePixelRatio; f.d += 0.01; f.x += Math.sin(f.d) * 0.4 * devicePixelRatio;
    if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(tick);
}
addEventListener('resize', size);
size();
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
</script>
