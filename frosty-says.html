<meta name="apple-mobile-web-app-title" content="Frosty Says">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Libre+Baskerville:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe3;
    --paper-edge: #e6dcc6;
    --ink: #2a2622;
    --ink-soft: #6b6157;
    --rule: #2a2622;
    --night: #1d2a44;
    --night-2: #34476b;
    --snow: #fbfaf6;
    --scarf: #3f6b4e;
    --scarf-2: #2c4f39;
    --hat: #2f3a34;
    --nose: #e07a2e;
    --bubble: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    background-image: radial-gradient(ellipse at top, var(--night-2), var(--night) 70%);
    min-height: 100vh;
    font-family: "Libre Baskerville", Georgia, serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
  }
  #snowfall { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .column {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(180,160,120,.12), transparent 50%);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    padding: 28px 28px 22px;
    transform: rotate(-0.4deg);
  }

  /* Masthead */
  .meta {
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
    border-top: 3px double var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 6px 0;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900;
    font-size: clamp(44px, 12vw, 72px);
    line-height: .95;
    text-align: center;
    margin: 14px 0 4px;
    letter-spacing: -.01em;
  }
  .dek {
    text-align: center;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  /* Stage */
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; }

  .bubble {
    position: relative;
    width: 100%;
    min-height: 132px;
    background: var(--bubble);
    border: 2px solid var(--ink);
    border-radius: 22px;
    padding: 20px 24px;
    margin: 6px 0 18px;
    font-family: "Newsreader", Georgia, serif;
    font-size: 19px;
    line-height: 1.5;
    box-shadow: 4px 4px 0 rgba(42,38,34,.15);
    display: flex; align-items: center;
  }
  .bubble::after, .bubble::before {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    border-style: solid;
  }
  .bubble::before { bottom: -18px; border-width: 18px 14px 0 14px; border-color: var(--ink) transparent transparent; }
  .bubble::after  { bottom: -14px; border-width: 15px 11px 0 11px; border-color: var(--bubble) transparent transparent; }
  .bubble p { margin: 0; flex: 1 1 auto; width: 100%; min-width: 0; }
  .bubble .hang { margin-left: 0; }
  .bubble.fresh p { animation: inkIn .5s ease both; }
  @keyframes inkIn { from { opacity: 0; filter: blur(3px); transform: translateY(4px); } to { opacity: 1; filter: none; transform: none; } }

  .snowman-btn {
    appearance: none; border: 0; background: none; padding: 0; margin: 0;
    cursor: pointer; width: min(320px, 80vw);
    -webkit-tap-highlight-color: transparent;
  }
  .snowman-btn:focus-visible { outline: 3px dashed var(--scarf); outline-offset: 6px; border-radius: 12px; }
  .snowman-btn img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(0 10px 10px rgba(42,38,34,.22));
    transform-origin: 50% 90%;
    user-select: none; -webkit-user-drag: none;
  }
  .snowman-btn.wobble img { animation: wobble .6s ease; }
  @keyframes wobble {
    0% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-4deg) scale(1.03, .97); }
    45% { transform: rotate(3deg) scale(.98, 1.03); }
    70% { transform: rotate(-1.5deg); }
    100% { transform: rotate(0) scale(1); }
  }

  /* Byline / citation */
  .byline {
    margin-top: 14px;
    border-top: 1px solid var(--rule);
    padding-top: 10px;
    min-height: 66px;
    font-size: 13px;
    line-height: 1.5;
  }
  .byline .label {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .byline .who {
    font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 18px;
  }
  .byline .src { color: var(--ink-soft); font-style: italic; }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 3px double var(--rule);
    margin-top: 12px; padding-top: 8px;
    font-size: 11px; color: var(--ink-soft);
  }
  .footer button {
    font: inherit; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    background: none; border: 1px solid var(--ink-soft); color: var(--ink);
    padding: 5px 10px; cursor: pointer; border-radius: 3px;
  }
  .footer button:hover { background: var(--ink); color: var(--paper); }

  @media (max-width: 420px) {
    .column { padding: 20px 16px 16px; transform: none; }
    .bubble { font-size: 18px; padding: 16px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .snowman-btn.wobble img, .bubble.fresh p { animation: none; }
  }
</style>
</head>
<body>
<canvas id="snowfall" aria-hidden="true"></canvas>

<main class="column">
  <div class="meta"><span>The Winter Gazette</span><span id="issue">Advice Column</span></div>
  <h1>Frosty Says</h1>
  <p class="dek">Your snowman is with(in) you &mdash; tap him anywhere for psychoanalytic insight, melted down.</p>

  <section class="stage">
    <div class="bubble" id="bubble" aria-live="polite">
      <p><span class="hang">&ldquo;</span>Go on, poke me. I&rsquo;ve been listening all winter and I have notes.&rdquo;</p>

<script>
const ADVICE = [
  { t: "Slips of the tongue and forgotten names are rarely accidents.",
    who: "Sigmund Freud", src: "On parapraxes — The Psychopathology of Everyday Life (1901)" },
  { t: "What we can’t remember, we repeat, as an action rather than a memory, without knowing we’re repeating it.",
    who: "Sigmund Freud", src: "Repetition compulsion — “Remembering, Repeating and Working-Through” (1914)" },
  { t: "When someone dies, reality tells us they’re gone, but love can’t let go all at once. Each memory and hope tied to them has to be called up and released, one by one, which is why mourning takes so long and hurts so much. When the work is done, we’re free to love again.",
    who: "Sigmund Freud", src: "The work of mourning — “Mourning and Melancholia” (1917)" },
  { t: "Your inner critic is built from your parents’ voices, and their parents’ before them. Before you obey it, ask whose voice it’s using.",
    who: "Sigmund Freud", src: "The superego — The Ego and the Id (1923)" },
  { t: "A healthy person should be able to do two things: to love and to work.",
    who: "Sigmund Freud", src: "Lieben und arbeiten, as reported by Erik Erikson" },
  { t: "The person you love and the person you’re furious with are the same person. Realizing that hurts more than keeping them separate. It’s also what makes real love possible.",
    who: "Melanie Klein", src: "The depressive position — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "When someone seems all good or all bad, you may be splitting. It’s harder, but try holding both versions at once.",
    who: "Melanie Klein", src: "Splitting — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Envy attacks a good thing precisely because it’s good and isn’t yours. Gratitude lets it stay good.",
    who: "Melanie Klein", src: "Envy and Gratitude (1957)" },
  { t: "A good-enough parent fails a child in small, bearable ways, and those failures teach the child the world is real.",
    who: "D. W. Winnicott", src: "The good-enough mother — Playing and Reality (1971)" },
  { t: "A false self grows up to comply with others and protect a true self that can’t risk being seen. Only the true self feels real.",
    who: "D. W. Winnicott", src: "True and False Self — “Ego Distortion in Terms of True and False Self” (1960)" },
  { t: "The capacity to be alone starts with being alone in someone’s presence, like a child playing quietly while a parent sits nearby.",
    who: "D. W. Winnicott", src: "“The Capacity to Be Alone” (1958)" },
  { t: "It’s in playing, and only in playing, that children and adults are able to be creative.",
    who: "D. W. Winnicott", src: "Transitional space — Playing and Reality (1971)" },
  { t: "Desire is the desire of the Other: we learn what to want by wondering what others want, and what they want from us. When you want, ask whose wanting you’re doing.",
    who: "Jacques Lacan", src: "“The Subversion of the Subject and the Dialectic of Desire” (1960)" },
  { t: "The ego is built on an infant’s first look in a mirror: a unified image of a self that feels anything but unified. Hold your self-image lightly.",
    who: "Jacques Lacan", src: "“The Mirror Stage as Formative of the I Function” (1949)" },
  { t: "The unconscious is structured like a language. Slips, puns and odd word choices are where it speaks.",
    who: "Jacques Lacan", src: "Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "The parts of yourself you’d rather not know tend to show up in other people.",
    who: "Carl Jung", src: "The Shadow — Aion (1951)" },
  { t: "Some feelings can’t be thought until a sturdy someone takes them in, holds them, and gives them back in a form you can manage.",
    who: "Wilfred Bion", src: "Container and contained — Learning from Experience (1962)" },
  { t: "Meet each conversation ‘without memory and without desire,’ so you see what’s actually there.",
    who: "Wilfred Bion", src: "“Notes on Memory and Desire” (1967)" },
  { t: "A young self learns it’s worth something from the gleam in a parent’s eye.",
    who: "Heinz Kohut", src: "Mirroring selfobjects — The Analysis of the Self (1971)" },
  { t: "Should be better, should be further along, should never need help: the tyranny of the should serves an idealized self that will never be satisfied. Swap a should for an honest want.",
    who: "Karen Horney", src: "Neurosis and Human Growth (1950)" },
  { t: "Immature love says, ‘I love you because I need you.’ Mature love says, ‘I need you because I love you.’",
    who: "Erich Fromm", src: "The Art of Loving (1956)" },
  { t: "Freedom frightens people, so they escape it into authority, conformity and crowds. Notice which of your choices you’ve quietly handed to someone else.",
    who: "Erich Fromm", src: "Escape from Freedom (1941)" },
  { t: "Every stage of life has its own crisis, meaning a turning point rather than a catastrophe. If you feel unsettled, you may simply be between stages.",
    who: "Erik Erikson", src: "Psychosocial stages — Childhood and Society (1950)" },
  { t: "Repression, projection, denial: each defense was a solution once.",
    who: "Anna Freud", src: "The Ego and the Mechanisms of Defence (1936)" },
  { t: "Seeking closeness when you’re frightened isn’t childish. It’s a system you’re born with, and it runs from the cradle to the grave.",
    who: "John Bowlby", src: "Attachment and Loss, Vol. 1: Attachment (1969)" },
  { t: "Children stay loyal to parents who hurt them, because a bad tie is better than none. Adults can do the same with important ties out of fear of loss.",
    who: "W. R. D. Fairbairn", src: "Psychoanalytic Studies of the Personality (1952)" },
  { t: "A child hurt by an adult may come to identify with that adult and take their side against themselves.",
    who: "Sándor Ferenczi", src: "Identification with the aggressor — “Confusion of Tongues” (1932)" },
  { t: "Some things you know deeply but have never thought, because you learned them before you had words.",
    who: "Christopher Bollas", src: "The Shadow of the Object (1987)" },
  { t: "Recognition has to be mutual. When one person only dominates and the other only submits, neither is really seen. Check that the seeing goes both ways.",
    who: "Jessica Benjamin", src: "The Bonds of Love (1988)" },
  { t: "We live as much in the lives we didn’t lead as in the one we did. Mourn the unlived ones a little. Then turn back to the one you actually have.",
    who: "Adam Phillips", src: "Missing Out: In Praise of the Unlived Life (2012)" },
  { t: "The self is made in relationships, and so it’s multiple: you’re a slightly different person with everyone you know.",
    who: "Stephen A. Mitchell", src: "Relational Concepts in Psychoanalysis (1988)" },
  { t: "We are strangers to ourselves. The foreigner already lives within. Make peace with the parts of you that feel foreign, and other strangers become less alarming.",
    who: "Julia Kristeva", src: "Strangers to Ourselves (1988)" },
  { t: "Every dream is the disguised fulfillment of a wish.",
    who: "Sigmund Freud", src: "Wish fulfillment — The Interpretation of Dreams (1900)" },
  { t: "Dreams are the royal road to the unconscious. Write one down when you wake up.",
    who: "Sigmund Freud", src: "The royal road — The Interpretation of Dreams (1900)" },
  { t: "Dreams condense several people into one figure.",
    who: "Sigmund Freud", src: "Condensation — The Interpretation of Dreams (1900)" },
  { t: "Dreams borrow trivial details from the day before to carry thoughts that aren’t trivial at all.",
    who: "Sigmund Freud", src: "Day residue — The Interpretation of Dreams (1900)" },
  { t: "Jokes let us say what we’d otherwise hold back: hostility, desire, contempt.",
    who: "Sigmund Freud", src: "Jokes and Their Relation to the Unconscious (1905)" },
  { t: "Adult desire has a long childhood history and many detours. Be curious about yourself rather than ashamed.",
    who: "Sigmund Freud", src: "Three Essays on the Theory of Sexuality (1905)" },
  { t: "Your daydreams are wishes correcting reality.",
    who: "Sigmund Freud", src: "“Creative Writers and Day-Dreaming” (1908)" },
  { t: "Accepting reality doesn’t cancel pleasure — it postpones it so you can have lasting satisfaction.",
    who: "Sigmund Freud", src: "The reality principle — “Formulations on the Two Principles of Mental Functioning” (1911)" },
  { t: "In the end we must begin to love in order not to fall ill. Love turned entirely inwards makes us sick.",
    who: "Sigmund Freud", src: "“On Narcissism: An Introduction” (1914)" },
  { t: "Falling for your therapist, teacher or boss repeats an earlier love, and is also, inconveniently, genuine. Most new loves are both new and very old.",
    who: "Sigmund Freud", src: "“Observations on Transference-Love” (1915)" },
  { t: "The uncanny is the kind of fright that leads back to something long familiar.",
    who: "Sigmund Freud", src: "“The Uncanny” (1919)" },
  { t: "A child throws a toy away and pulls it back, turning being left into a game he controls. We all rehearse our losses somehow.",
    who: "Sigmund Freud", src: "Fort–da — Beyond the Pleasure Principle (1920)" },
  { t: "Part of us is pulled toward stillness and the end of all tension. Not everything in you wants more.",
    who: "Sigmund Freud", src: "The death drive — Beyond the Pleasure Principle (1920)" },
  { t: "In a group, people put the leader in place of their own conscience, which is why crowds do what individuals wouldn’t.",
    who: "Sigmund Freud", src: "Group Psychology and the Analysis of the Ego (1921)" },
  { t: "The ego is like a rider who often has to go where the horse wants, then claims the route as his choice.",
    who: "Sigmund Freud", src: "The ego as rider — The Ego and the Id (1923)" },
  { t: "A repressed thought can surface as long as it’s denied. ‘It’s not that I’m envious’ is usually a fairly good clue. Listen to what you’re quick to deny.",
    who: "Sigmund Freud", src: "“Negation” (1925)" },
  { t: "Anxiety is a signal that danger *might* be coming. Treat it like a smoke alarm: always worth checking, not always a fire.",
    who: "Sigmund Freud", src: "Signal anxiety — Inhibitions, Symptoms and Anxiety (1926)" },
  { t: "Beliefs driven by wishes are illusions. The voice of the intellect is a soft one, but it doesn’t rest until it’s been heard.",
    who: "Sigmund Freud", src: "The Future of an Illusion (1927)" },
  { t: "Humor isn’t resigned, it’s rebellious: the conscience, for once, comforting you. Laughter in a hard moment doesn’t deny the pain, it refuses to be beaten by it.",
    who: "Sigmund Freud", src: "“Humour” (1927)" },
  { t: "The fiercest feuds are often between people who are nearly alike.",
    who: "Sigmund Freud", src: "The narcissism of minor differences — Civilization and Its Discontents (1930)" },
  { t: "Happiness was never part of the plan of Creation. That isn’t gloomy, it’s freeing.",
    who: "Sigmund Freud", src: "Civilization and Its Discontents (1930)" },
  { t: "Civilization costs us some happiness by heightening our guilt. If you feel vaguely guilty for no clear reason, it may be the price of living among other people, not proof you’ve done anything wrong.",
    who: "Sigmund Freud", src: "Guilt as the price of civilization — Civilization and Its Discontents (1930)" },
  { t: "Educating, governing and healing minds are impossible professions: the results are bound to be unsatisfying. Parenting involves all three.",
    who: "Sigmund Freud", src: "The impossible professions — “Analysis Terminable and Interminable” (1937)" },
  { t: "Some people fall ill just when a long-cherished wish comes true. Success can feel forbidden.",
    who: "Sigmund Freud", src: "“Those Wrecked by Success” (1916)" },
  { t: "Listen without deciding in advance what matters. The important part of what someone says is rarely where you expected it.",
    who: "Sigmund Freud", src: "Evenly suspended attention — “Recommendations to Physicians Practising Psycho-Analysis” (1912)" },
  { t: "Each of us carries an early pattern of loving that gets reprinted in every new relationship.",
    who: "Sigmund Freud", src: "“The Dynamics of Transference” (1912)" },
  { t: "Vivid memories of trivial childhood moments can be screens for something more significant nearby. What you remember clearly isn’t always what mattered. Look just outside the frame.",
    who: "Sigmund Freud", src: "“Screen Memories” (1899)" },
  { t: "Children fantasize that they were born to grander parents. It’s a way of coping with discovering their real parents are ordinary. Most of us eventually have to forgive them for it.",
    who: "Sigmund Freud", src: "“Family Romances” (1909)" },
  { t: "A grieving person’s harshest self-reproaches often fit someone else: the one who was lost.",
    who: "Sigmund Freud", src: "Melancholic self-reproach — “Mourning and Melancholia” (1917)" },
  { t: "Something isn’t worth less because it doesn’t last. If anything, it’s worth more. That a thing will end is a reason to enjoy it now.",
    who: "Sigmund Freud", src: "“On Transience” (1916)" },
  { t: "Repression keeps something away from consciousness, but it doesn’t stay away. It comes back, usually in disguise. What you refuse to think about will find another way in.",
    who: "Sigmund Freud", src: "The return of the repressed — “Repression” (1915)" },
  { t: "Deep down, nobody believes in their own death. That’s why so much gets left for ‘one day.’",
    who: "Sigmund Freud", src: "“Thoughts for the Times on War and Death” (1915)" },
  { t: "Private rituals and religious ones work the same way: repetition soothes anxiety.",
    who: "Sigmund Freud", src: "“Obsessive Actions and Religious Practices” (1907)" },
  { t: "Talking is a cure. Saying something out loud, in detail, to someone who listens changes it.",
    who: "Sigmund Freud", src: "The talking cure — Studies on Hysteria (1895, with Josef Breuer)" },
  { t: "The realistic aim is to turn misery into common unhappiness. Ordinary unhappiness is something you can live with.",
    who: "Sigmund Freud", src: "Common unhappiness — Studies on Hysteria (1895, with Josef Breuer)" },
  { t: "The mind can know something and refuse to know it at the same time. If a thought keeps slipping away from you, it may be one you’re not ready to know yet.",
    who: "Sigmund Freud", src: "“Splitting of the Ego in the Process of Defence” (1940)" },
  { t: "We forbid most strictly what we’re most tempted by.",
    who: "Sigmund Freud", src: "Totem and Taboo (1913)" },
  { t: "A single shameful fantasy can disguise several different wishes. Don’t just try to get rid of it, be curious about what job it’s doing for you.",
    who: "Sigmund Freud", src: "“A Child Is Being Beaten” (1919)" },
  { t: "The unconscious doesn’t keep time. Old experiences aren’t worn down by the years, which is why an old hurt can feel brand new.",
    who: "Sigmund Freud", src: "Timelessness — “The Unconscious” (1915)" },
  { t: "Even a loving mother has reasons to hate her baby, and admitting the hate makes the love more honest. Any close relationship holds both.",
    who: "D. W. Winnicott", src: "“Hate in the Counter-Transference” (1949)" },
  { t: "Love that purports only sweetness is no use to children. Love that can admit negative emotions is more trustworthy.",
    who: "D. W. Winnicott", src: "Sentimentality — “Hate in the Counter-Transference” (1949)" },
  { t: "A child’s transitional object is a remarkable thing: not fully part of the child, not fully part of the world, but a bridge between the two.",
    who: "D. W. Winnicott", src: "“Transitional Objects and Transitional Phenomena” (1953)" },
  { t: "Never ask a child whether they invented their blanket’s magic or discovered it out in the world. Some things are allowed to be both.",
    who: "D. W. Winnicott", src: "The paradox of the transitional object — Playing and Reality (1971)" },
  { t: "People become fully real to us only after we’ve destroyed them in our minds and they’ve survived without retaliating. We then learn that they exist outside of us, and can begin to truly relate to them.",
    who: "D. W. Winnicott", src: "“The Use of an Object” (1969)" },
  { t: "‘Hullo object! I destroyed you. I love you.’ Love needs the other person to survive our worst feelings.",
    who: "D. W. Winnicott", src: "“The Use of an Object” (1969)" },
  { t: "The breakdown you dread may already have happened, early, before you could take it in. Ask whether your fear is pointing backward rather than forward.",
    who: "D. W. Winnicott", src: "“Fear of Breakdown” (1974)" },
  { t: "When a child looks into her mother’s face, she sees herself. Long before any mirror, we find ourselves in the faces that really see us.",
    who: "D. W. Winnicott", src: "“Mirror-role of Mother and Family in Child Development” (1967)" },
  { t: "Concern is guilt that can do something, through repair, instead of mere suffering. When you feel guilty, ask what repair would look like.",
    who: "D. W. Winnicott", src: "“The Development of the Capacity for Concern” (1963)" },
  { t: "There is a delicate tension between the wish to be known and the need to maintain privacy and autonomy. As Winnicott says: ‘It is a joy to be hidden but disaster not to be found.’",
    who: "D. W. Winnicott", src: "“Communicating and Not Communicating” (1963)" },
  { t: "A child who steals or destroys may be trying to reclaim something good that was lost. It’s an act of hope.",
    who: "D. W. Winnicott", src: "“The Antisocial Tendency” (1956)" },
  { t: "New parents go into a state of extreme absorption in their baby, and it’s healthy.",
    who: "D. W. Winnicott", src: "“Primary Maternal Preoccupation” (1956)" },
  { t: "Holding means a setting reliable enough that someone can fall apart and come back together.",
    who: "D. W. Winnicott", src: "Holding — “The Theory of the Parent–Infant Relationship” (1960)" },
  { t: "There’s no such thing as a baby, only a baby and someone caring for it.",
    who: "D. W. Winnicott", src: "“There is no such thing as a baby” — “Anxiety Associated with Insecurity” (1952)" },
  { t: "Aggression starts as plain aliveness: how a baby discovers that the world is out there and pushes back. It’s how you learn where you end and others begin.",
    who: "D. W. Winnicott", src: "“Aggression in Relation to Emotional Development” (1950)" },
  { t: "Art, music, and play live in the same in-between space as a child’s teddy bear (or Frosty!), neither purely inside nor out.",
    who: "D. W. Winnicott", src: "“The Location of Cultural Experience” (1967)" },
  { t: "Living creatively means feeling that life is yours rather than something you comply with. It needs no talent.",
    who: "D. W. Winnicott", src: "“Living Creatively” (1970)" },
  { t: "Health is harder to deal with than illness. Illness comes with explanations. Health just leaves you with your life. If you’re doing better, expect it to feel strange for a while.",
    who: "D. W. Winnicott", src: "“The Concept of a Healthy Individual” (1967)" },
  { t: "One person draws a squiggle, the other turns it into something, then they swap. Understanding and relating is often a matter of finishing each other’s lines.",
    who: "D. W. Winnicott", src: "The squiggle game — Therapeutic Consultations in Child Psychiatry (1971)" },
  { t: "With someone reliably there, we can become unintegrated: flounder, lose our bearings, and simply exist for a while, neither reacting to the world nor heading anywhere. It isn’t falling apart, it’s where personal life begins.",
    who: "D. W. Winnicott", src: "Unintegration — “The Capacity to Be Alone” (1958)" },
  { t: "A good environment doesn’t make anyone grow. It allows the growth that’s already trying to happen.",
    who: "D. W. Winnicott", src: "The holding environment — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "When the world intrudes before a child is ready, the child learns to react instead of simply be.",
    who: "D. W. Winnicott", src: "Impingement — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "Beneath everything a baby needs is the simple, unbroken feeling of existing from one moment to the next: going on being. Interrupt it too often and a person learns to survive rather than live.",
    who: "D. W. Winnicott", src: "Going-on-being — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "The urge to repair what we feel we’ve damaged is one of the deepest sources of love.",
    who: "Melanie Klein", src: "Love, Guilt and Reparation (1937)" },
  { t: "When we feel threatened, the mind splits the world in two: whatever frightens us becomes a persecutor, whatever comforts us becomes ideal. Everyone goes there sometimes. Recognizing you’re there is the first step out.",
    who: "Melanie Klein", src: "The paranoid-schizoid position — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "When a feeling is too painful to own, we can lodge it in someone else and then treat it as theirs. Often they even start to feel it.",
    who: "Melanie Klein", src: "Projective identification — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Triumph, contempt, frantic busyness — anything but grief. It looks like coping, but it only postpones the mourning.",
    who: "Melanie Klein", src: "The manic defense — “A Contribution to the Psychogenesis of Manic-Depressive States” (1935)" },
  { t: "Greed wants more than the giver can provide, so it is never satisfied. Gratitude can enjoy what is actually given.",
    who: "Melanie Klein", src: "Greed — Envy and Gratitude (1957)" },
  { t: "A certain loneliness persists however loved you are: a longing to be understood completely, which words can’t fully satisfy.",
    who: "Melanie Klein", src: "“On the Sense of Loneliness” (1963)" },
  { t: "Adult relationships, institutions, and quarrels carry the marks of infancy’s earliest fears.",
    who: "Melanie Klein", src: "“Our Adult World and Its Roots in Infancy” (1959)" },
  { t: "Children say with toys what they can’t yet put into words; adults do so with hobbies and habits.",
    who: "Melanie Klein", src: "“The Psycho-Analytic Play Technique” (1955)" },
  { t: "You can identify with someone so completely that you lose track of where you end and they begin. Closeness and confusion feel similar.",
    who: "Melanie Klein", src: "“On Identification” (1955)" },
  { t: "Guilt arises when you realize you’ve attacked, in your mind, someone you love. It’s uncomfortable, but it’s the beginning of concern.",
    who: "Melanie Klein", src: "Depressive guilt — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "We carry internal objects: inner versions of the people who mattered, shaped as much by our feelings about them as by who they were. They go on shaping how we feel long after the real people have gone.",
    who: "Melanie Klein", src: "Internal objects — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "Idealizing someone keeps them wholly good, safe from your own hostility. But the hostility hasn’t gone anywhere, so when they disappoint you, the fall is as steep as the pedestal was high.",
    who: "Melanie Klein", src: "Idealization — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "The wish to create often grows from the wish to restore what we fear we’ve damaged.",
    who: "Melanie Klein", src: "Reparation and creativity — “Infantile Anxiety Situations Reflected in a Work of Art” (1929)" },
  { t: "Every new grief reawakens the oldest ones. A small loss can bring a surprisingly large sorrow.",
    who: "Melanie Klein", src: "Revived losses — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "Curiosity and fear grow up together. The urge to know is entangled with anxiety about what you’ll find.",
    who: "Melanie Klein", src: "The epistemophilic impulse — “Early Stages of the Oedipus Conflict” (1928)" },
  { t: "Unconscious phantasy runs beneath all experience: an inner story about what we’re doing to others and what they’re doing to us. You never stop having it, you just stop hearing it. Your strongest reactions are the best way to tune in.",
    who: "Melanie Klein", src: "Unconscious phantasy — “The Psycho-Analytic Play Technique” (1955)" },
  { t: "The only thing you can really be guilty of is giving ground on your desire. That doesn’t mean do whatever you like. It means don’t betray what you actually want.",
    who: "Jacques Lacan", src: "Not giving ground on desire — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "There’s no perfect fit between two people. Love is what makes up for it.",
    who: "Jacques Lacan", src: "“There is no sexual relationship” — Seminar XX: Encore (1972–73)" },
  { t: "Anxiety is the one feeling that doesn’t deceive. Other feelings can be displaced or disguised; anxiety points straight at something real, often an unspoken sense of what others want from you.",
    who: "Jacques Lacan", src: "Seminar X: Anxiety (1962–63)" },
  { t: "Anxiety comes not when something’s missing but when nothing is. Desire needs a gap; when the other is too close and wants too much, the gap closes and anxiety rushes in.",
    who: "Jacques Lacan", src: "Seminar X: Anxiety (1962–63)" },
  { t: "Love is giving what you don’t have: offering your own lack, not your possessions. Presents are easier.",
    who: "Jacques Lacan", src: "Love as giving what you don’t have — Seminar VIII: Transference (1960–61)" },
  { t: "A letter always arrives at its destination. What’s been sent will be received, even if it takes the long way round. What you’re avoiding will reach you eventually. So better to open it.",
    who: "Jacques Lacan", src: "“Seminar on ‘The Purloined Letter’” (1956)" },
  { t: "What makes something desirable is never quite in the thing itself. That’s why getting what you wanted can feel strangely empty. Sometimes the wanting was the point.",
    who: "Jacques Lacan", src: "Objet petit a — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "The unconscious is the discourse of the Other: we speak with words and wishes we inherited.",
    who: "Jacques Lacan", src: "“The Function and Field of Speech and Language in Psychoanalysis” (1953)" },
  { t: "I think where I am not, and I am where I do not think. The truth about you isn’t in your self-description, it shows up in what you didn’t mean to say.",
    who: "Jacques Lacan", src: "“The Instance of the Letter in the Unconscious” (1957)" },
  { t: "We compete with others as images of ourselves. The rival is often a mirror.",
    who: "Jacques Lacan", src: "Imaginary rivalry — Seminar II: The Ego in Freud’s Theory (1954–55)" },
  { t: "There’s no final authority guaranteeing the rules. Everyone is improvising more than they let on.",
    who: "Jacques Lacan", src: "The Other has no Other — “The Subversion of the Subject and the Dialectic of Desire” (1960)" },
  { t: "A symptom is a message addressed to someone, in a language you don’t yet understand. It keeps coming back until it’s read.",
    who: "Jacques Lacan", src: "The symptom as message — “The Function and Field of Speech and Language in Psychoanalysis” (1953)" },
  { t: "Some enjoyment goes past pleasure into pain, and still we keep going back to it. We repeat some painful things because they carry a kind of satisfaction we don’t consciously choose.",
    who: "Jacques Lacan", src: "Jouissance — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "The gaze isn’t your looking. It’s the feeling of being looked at from somewhere you can’t see, as if the world were looking back.",
    who: "Jacques Lacan", src: "The gaze — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "Every life needs some law and limit to hold its meanings in place. Limits aren’t only restrictions. Without some, nothing stays meaningful for long.",
    who: "Jacques Lacan", src: "The Name-of-the-Father — Seminar III: The Psychoses (1955–56)" },
  { t: "Repetition is a missed appointment with something real: We keep returning to the place where something happened that we couldn’t take in.",
    who: "Jacques Lacan", src: "Repetition and the missed encounter — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "We trust experts because we suppose they know. Often that supposition is what does the work. Some of the knowledge you’re waiting for may already be yours.",
    who: "Jacques Lacan", src: "The subject supposed to know — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "At the center of desire is a lost Thing we circle and never quite reach. Desire keeps its distance from what it wants.",
    who: "Jacques Lacan", src: "Das Ding — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "Everyone has a particular knot that holds them together, a symptom that has become a way of living. The aim isn’t always to undo it. It’s to learn how to use it well.",
    who: "Jacques Lacan", src: "The sinthome — Seminar XXIII: The Sinthome (1975–76)" },
  { t: "The persona is a compromise between you and society about how you should appear. It’s useful, it isn’t you.",
    who: "Carl Jung", src: "The persona — “The Relations between the Ego and the Unconscious” (1928)" },
  { t: "Introverts draw energy from inner experience, extraverts from the outer world. Neither is a flaw, and each tends to undervalue the other.",
    who: "Carl Jung", src: "Psychological Types (1921)" },
  { t: "You can’t live the afternoon of life by the program of the morning. What was true in the morning may be a lie by evening.",
    who: "Carl Jung", src: "“The Stages of Life” (1930)" },
  { t: "In a crisis, playing like a child can bring you back to yourself.",
    who: "Carl Jung", src: "Memories, Dreams, Reflections (1962)" },
  { t: "Meaningful coincidences happen, whatever they mean about the world. Take them as psychological events: That’s where their meaning is.",
    who: "Carl Jung", src: "“Synchronicity: An Acausal Connecting Principle” (1952)" },
  { t: "When two parts of you disagree, don’t force a winner. Hold the tension long enough and a third option tends to appear.",
    who: "Carl Jung", src: "“The Transcendent Function” (1916)" },
  { t: "Archetypes are inherited forms in the psyche (the hero, the mother, the trickster, the wise old man). They aren’t roles we choose but patterns that shape how we experience people and moments.",
    who: "Carl Jung", src: "Archetypes — The Archetypes and the Collective Unconscious (1959)" },
  { t: "The child within stands for possibility, what isn’t yet formed in you. It’s also vulnerable and easily abandoned.",
    who: "Carl Jung", src: "“The Psychology of the Child Archetype” (1940)" },
  { t: "The person you fall for often carries a part of yourself you haven’t yet lived. Projection is how we first meet what we haven’t integrated.",
    who: "Carl Jung", src: "Anima and animus — Aion (1951)" },
  { t: "Becoming who you are doesn’t mean becoming perfect. It means becoming whole, which includes the parts you’d rather leave out.",
    who: "Carl Jung", src: "Individuation — Two Essays on Analytical Psychology (1928)" },
  { t: "After midlife, many problems are at root questions of meaning. Not every suffering is a symptom, some is a question. Ask what your life is for.",
    who: "Carl Jung", src: "Modern Man in Search of a Soul (1933)" },
  { t: "People dissolve into mass movements to avoid knowing themselves. The only real resistance is self-knowledge. Before you take a side, take a look inward.",
    who: "Carl Jung", src: "The Undiscovered Self (1957)" },
  { t: "You don’t become enlightened by imagining figures of light, but by making the darkness conscious. It’s less pleasant, which is why it’s less popular. Do it anyway.",
    who: "Carl Jung", src: "Making the darkness conscious — “The Philosophical Tree” (1945)" },
  { t: "Everyone knows people have complexes. Less well known is that complexes can have us. When you react far too strongly, it may be a complex doing the talking.",
    who: "Carl Jung", src: "“A Review of the Complex Theory” (1934)" },
  { t: "A dream is a self-portrait of where you actually are, not where you’d like to be.",
    who: "Carl Jung", src: "“On the Nature of Dreams” (1945)" },
  { t: "Only the wounded physician heals. Your own wounds are part of what lets you understand other people’s.",
    who: "Carl Jung", src: "The wounded healer — “Fundamental Questions of Psychotherapy” (1951)" },
  { t: "The mind can attack its own connections so as not to know something painful.",
    who: "Wilfred Bion", src: "“Attacks on Linking” (1959)" },
  { t: "Groups often behave as if they’ve met to depend on a leader, to fight an enemy, or to pair off in hope of a savior.",
    who: "Wilfred Bion", src: "Basic assumptions — Experiences in Groups (1961)" },
  { t: "Groups expect their leader to meet every need, then turn on the leader for failing.",
    who: "Wilfred Bion", src: "Dependency groups — Experiences in Groups (1961)" },
  { t: "Thoughts come first, and thinking develops to cope with them. Some thoughts are waiting for a mind ready to hold them. If something can’t be thought yet, it may need time, not force.",
    who: "Wilfred Bion", src: "“A Theory of Thinking” (1962)" },
  { t: "Be capable of uncertainty and doubt without irritably reaching for facts and reasons. Not knowing is part of finding out.",
    who: "Wilfred Bion", src: "Negative capability — Attention and Interpretation (1970)" },
  { t: "There’s a wish to know and an equally strong wish not to know. Both are at work in most of us, especially about ourselves.",
    who: "Wilfred Bion", src: "K and minus K — Learning from Experience (1962)" },
  { t: "The deepest reality can’t be known, only lived.",
    who: "Wilfred Bion", src: "O — Transformations (1965)" },
  { t: "Raw feelings that can’t be thought get pushed out, usually into whoever is nearby.",
    who: "Wilfred Bion", src: "Beta elements — Learning from Experience (1962)" },
  { t: "Dreaming is how the mind digests experience into something it can think and remember.",
    who: "Wilfred Bion", src: "Alpha function — Learning from Experience (1962)" },
  { t: "Not every thought in your head is at the same stage. Some are raw, some are half-formed, some are ready to use.",
    who: "Wilfred Bion", src: "The Grid — Elements of Psycho-Analysis (1963)" },
  { t: "Much suffering comes from a self that never got what it needed to feel whole. That’s why a small slight can feel like structural damage.",
    who: "Heinz Kohut", src: "The Restoration of the Self (1977)" },
  { t: "Rage out of proportion to the insult means a deeper wound has been touched.",
    who: "Heinz Kohut", src: "“Thoughts on Narcissism and Narcissistic Rage” (1972)" },
  { t: "A child needs someone calm and strong to look up to and feel merged with, borrowing their steadiness until they can steady themselves. Admiring someone is how strength is first taken in.",
    who: "Heinz Kohut", src: "The idealizing transference — The Analysis of the Self (1971)" },
  { t: "We need to feel essentially alike with someone, to sense another being like us. That kinship is part of what makes a self feel at home in the world.",
    who: "Heinz Kohut", src: "Twinship — How Does Analysis Cure? (1984)" },
  { t: "Empathy is vicarious introspection — thinking and feeling your way into someone else’s experience. It’s a way of understanding, not agreeing.",
    who: "Heinz Kohut", src: "“Introspection, Empathy, and Psychoanalysis” (1959)" },
  { t: "Small, bearable disappointments help a self build strength of its own. Too little frustration and we never learn. Too much and we break. Aim for the middle, with children and with yourself.",
    who: "Heinz Kohut", src: "Optimal frustration — The Analysis of the Self (1971)" },
  { t: "Childhood grandiosity is healthy if it grows up into ambition and self-respect. It becomes a problem only when it was never met, and so never outgrown.",
    who: "Heinz Kohut", src: "The grandiose self — The Analysis of the Self (1971)" },
  { t: "Some people suffer from guilt over forbidden wishes. More, these days, suffer from a self that can’t fulfill its aims.",
    who: "Heinz Kohut", src: "Tragic Man — The Restoration of the Self (1977)" },
  { t: "Under anxiety we move toward people, against them, or away from them. Each has its place. Trouble starts when only one move is available.",
    who: "Karen Horney", src: "Moving toward, against and away — Our Inner Conflicts (1945)" },
  { t: "We build an idealized image of ourselves and then hate the real self for not matching it. Side with your real self.",
    who: "Karen Horney", src: "The idealized self — Neurosis and Human Growth (1950)" },
  { t: "The search for glory never arrives, because the ideal is always just out of reach.",
    who: "Karen Horney", src: "The search for glory — Neurosis and Human Growth (1950)" },
  { t: "We make unspoken claims on the world: to be treated as special, spared difficulty, given to without asking. The world doesn’t know about the claims.",
    who: "Karen Horney", src: "Neurotic claims — Neurosis and Human Growth (1950)" },
  { t: "Basic anxiety is feeling isolated and helpless in a potentially hostile world. It starts in childhood and colors how adult life looks.",
    who: "Karen Horney", src: "Basic anxiety — The Neurotic Personality of Our Time (1937)" },
  { t: "You can analyze yourself, with honesty and persistence. It’s hard, and it requires being willing to be surprised by what you find. Start by noticing what you avoid.",
    who: "Karen Horney", src: "Self-Analysis (1942)" },
  { t: "Envy runs in more than one direction. Men may envy women’s capacity to bear life, and compensate in other ways. When someone belittles a thing, ask whether they envy it.",
    who: "Karen Horney", src: "Womb envy — “The Flight from Womanhood” (1926)" },
  { t: "The real self is a force for growth that emerges when anxiety stops getting in the way. It doesn’t need to be invented, it needs room.",
    who: "Karen Horney", src: "The real self — Neurosis and Human Growth (1950)" },
  { t: "We experience inner conflicts as if they were happening outside us, which makes other people look like the problem.",
    who: "Karen Horney", src: "Externalization — Our Inner Conflicts (1945)" },
  { t: "A need to be loved by everyone can never be satisfied, because it’s driven by anxiety rather than desire. More affection won’t fix it.",
    who: "Karen Horney", src: "The neurotic need for affection — The Neurotic Personality of Our Time (1937)" },
  { t: "There’s a having mode (relating to the world by owning) and a being mode (relating by experiencing). Try spending some time in the second.",
    who: "Erich Fromm", src: "To Have or to Be? (1976)" },
  { t: "If I am what I have, and I lose what I have, who am I? A sense of self should be built on what can’t be repossessed.",
    who: "Erich Fromm", src: "To Have or to Be? (1976)" },
  { t: "Treating yourself as a product means your worth rises and falls with demand.",
    who: "Erich Fromm", src: "The marketing orientation — Man for Himself (1947)" },
  { t: "A whole society can be unwell while everyone in it seems normal. Adjusting to an unhealthy way of life isn’t health.",
    who: "Erich Fromm", src: "The Sane Society (1955)" },
  { t: "Giving is the highest expression of strength. In giving, we feel our own aliveness.",
    who: "Erich Fromm", src: "Giving — The Art of Loving (1956)" },
  { t: "Selfish people don’t love themselves too much. They love themselves too little. Real self-love and love of others go together.",
    who: "Erich Fromm", src: "Self-love — The Art of Loving (1956)" },
  { t: "Love is a standing in, not a falling for.",
    who: "Erich Fromm", src: "Falling in love versus standing in love — The Art of Loving (1956)" },
  { t: "Love, like any art, needs discipline, concentration, patience, and real concern. Protect your attention for who you love.",
    who: "Erich Fromm", src: "Discipline, concentration, patience — The Art of Loving (1956)" },
  { t: "Some destructiveness comes from chronic boredom, an inner deadness looking for stimulation. The cure isn’t excitement, it’s finding aliveness.",
    who: "Erich Fromm", src: "Boredom and destructiveness — The Anatomy of Human Destructiveness (1973)" },
  { t: "Some people are drawn to what is alive and growing; others to what is mechanical, fixed and controllable. Love of life is an orientation you can strengthen.",
    who: "Erich Fromm", src: "Biophilia — The Heart of Man (1964)" },
  { t: "We can think, feel, and want what we’re expected to, and experience it all as our own.",
    who: "Erich Fromm", src: "Automaton conformity — Escape from Freedom (1941)" },
  { t: "Some people want both to submit to authority and to be the authority others submit to. It’s an anxious arrangement.",
    who: "Erich Fromm", src: "The authoritarian character — Escape from Freedom (1941)" },
  { t: "The first question of life is whether the world can be trusted. It’s settled in infancy and tested again and again. Where trust has been earned, let yourself rely on it.",
    who: "Erik Erikson", src: "Trust vs. mistrust — Childhood and Society (1950)" },
  { t: "Being shamed for trying to do things yourself leaves doubt behind for a long time. Let children, and yourself, try things clumsily.",
    who: "Erik Erikson", src: "Autonomy vs. shame — Childhood and Society (1950)" },
  { t: "Guilt can make starting things feel like trespassing. If you never begin anything, ask whether you were once made to feel wrong for trying.",
    who: "Erik Erikson", src: "Initiative vs. guilt — Childhood and Society (1950)" },
  { t: "Childhood teaches us whether our efforts can produce something worthwhile. Many adults are still waiting for the verdict.",
    who: "Erik Erikson", src: "Industry vs. inferiority — Childhood and Society (1950)" },
  { t: "Working out who you are is supposed to involve a crisis. It’s normal, even necessary.",
    who: "Erik Erikson", src: "The identity crisis — Identity: Youth and Crisis (1968)" },
  { t: "Young people need time to experiment before committing to roles. Adults need some of this too.",
    who: "Erik Erikson", src: "The psychosocial moratorium — Identity: Youth and Crisis (1968)" },
  { t: "Real intimacy needs a self secure enough not to fear being lost in someone else.",
    who: "Erik Erikson", src: "Intimacy vs. isolation — Childhood and Society (1950)" },
  { t: "In middle life the question is whether you’re caring for something that will outlast you: children, work, a community. The alternative is stagnation.",
    who: "Erik Erikson", src: "Generativity vs. stagnation — The Life Cycle Completed (1982)" },
  { t: "The last task is accepting your one and only life as the one it had to be. Its virtue is wisdom.",
    who: "Erik Erikson", src: "Integrity vs. despair — The Life Cycle Completed (1982)" },
  { t: "You can admire someone deeply and still tell them honestly where they’ve failed. The best respect includes both.",
    who: "Erik Erikson", src: "Gandhi’s Truth (1969)" },
  { t: "Each stage of life is meant to leave a virtue behind: hope, will, purpose, competence, fidelity, love, care, wisdom.",
    who: "Erik Erikson", src: "The basic virtues — Insight and Responsibility (1964)" },
  { t: "Some people give up their own wishes and satisfy them through others. It looks generous. It can also be a way of not having to want.",
    who: "Anna Freud", src: "Altruistic surrender — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Turning feelings into abstract argument keeps them at a safe distance. Say what you feel, not just what you think.",
    who: "Anna Freud", src: "Intellectualization — The Ego and the Mechanisms of Defence (1936)" },
  { t: "A sudden, severe renunciation of pleasure can be a defense against urges that feel too big. Extreme discipline isn’t always strength, sometimes it’s fear.",
    who: "Anna Freud", src: "Adolescent asceticism — The Ego and the Mechanisms of Defence (1936)" },
  { t: "An unacceptable feeling can be turned into its opposite: hostility becomes excessive kindness. The exaggeration usually gives it away.",
    who: "Anna Freud", src: "Reaction formation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Feelings get redirected from their real target to a safer one, where expressing them feels less dangerous.",
    who: "Anna Freud", src: "Displacement — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Anger that can’t safely go outwards turns inwards. Self-criticism is sometimes anger with nowhere else to go.",
    who: "Anna Freud", src: "Turning against the self — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Children develop unevenly, ahead in one area and behind in another. Adults do too.",
    who: "Anna Freud", src: "Developmental lines — Normality and Pathology in Childhood (1965)" },
  { t: "The healthiest defense turns a difficult urge into something valued. Aggression becomes sport, restlessness becomes work.",
    who: "Anna Freud", src: "Sublimation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "To bear a painful reality, a child may deny it in fantasy by turning it into its opposite: The small, frightened child becomes the one who tames the lion.",
    who: "Anna Freud", src: "Denial in fantasy — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Children separated from those they love go through protest, then despair, then detachment. Detachment looks like recovery but isn’t. It’s loss of hope.",
    who: "John Bowlby", src: "Protest, despair, detachment — Attachment and Loss, Vol. 2: Separation (1973)" },
  { t: "Grief includes an urge to search for the person you’ve lost. It’s attachment doing its job.",
    who: "John Bowlby", src: "Searching — Attachment and Loss, Vol. 3: Loss (1980)" },
  { t: "We carry early models of how people will treat us, and they shape every later relationship. They can be revised, but only by new experience. Let someone surprise you.",
    who: "John Bowlby", src: "Internal working models — Attachment and Loss, Vol. 2: Separation (1973)" },
  { t: "A secure base is somewhere to explore from and come back to. Security is what makes exploration possible.",
    who: "John Bowlby", src: "A Secure Base (1988)" },
  { t: "Some children steal after early, prolonged separation from those who cared for them. Taking can be a way of searching for what they lost.",
    who: "John Bowlby", src: "“Forty-Four Juvenile Thieves” (1944)" },
  { t: "Maternal love in infancy and childhood is as important for mental health as vitamins and proteins are for physical health.",
    who: "John Bowlby", src: "Maternal Care and Mental Health (1951)" },
  { t: "Some people insist on doing everything alone because needing others once hurt too much. It’s self-sufficiency as armor.",
    who: "John Bowlby", src: "Compulsive self-reliance — Attachment and Loss, Vol. 3: Loss (1980)" },
  { t: "Securely attached young children are upset when a parent leaves and comforted when they return. Distress upon separation can be healthy, as is the capacity to be comforted upon reunion.",
    who: "Mary Ainsworth", src: "Secure attachment — Patterns of Attachment (1978)" },
  { t: "Some children seem unbothered when their parent leaves, yet their bodies are stressed all the same. Looking fine and being fine are different.",
    who: "Mary Ainsworth", src: "Avoidant attachment — Patterns of Attachment (1978)" },
  { t: "Some children cling and push away at once, hard to soothe. Inconsistent care teaches inconsistent hope. If you seek closeness and resist it, you learned that somewhere.",
    who: "Mary Ainsworth", src: "Ambivalent attachment — Patterns of Attachment (1978)" },
  { t: "A child would rather believe they’re bad than that their parents are. Better a sinner in a world ruled by God than live in one ruled by the Devil.",
    who: "W. R. D. Fairbairn", src: "The moral defense — Psychoanalytic Studies of the Personality (1952)" },
  { t: "What we’re after, at the end of the day, isn’t pleasure but people. Libido seeks relationship. If you feel empty despite having everything, look at your connections.",
    who: "W. R. D. Fairbairn", src: "Libido is object-seeking — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Someone thrilling and unavailable stirs a longing that can feel like love. Often the thrill is the unavailability.",
    who: "W. R. D. Fairbairn", src: "The exciting object — Psychoanalytic Studies of the Personality (1952)" },
  { t: "There’s a part of us that attacks our own needs and sides with whoever rejected them. It passes itself off as good sense.",
    who: "W. R. D. Fairbairn", src: "The internal saboteur — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Some people keep their love hidden because they fear it destroys. They seem cold, but they’re protecting others.",
    who: "W. R. D. Fairbairn", src: "“Schizoid Factors in the Personality” (1940)" },
  { t: "Development moves from infantile dependence to mature dependence, not to independence. Needing others never stops. How you need them can evolve.",
    who: "W. R. D. Fairbairn", src: "Mature dependence — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Tact is the capacity to *feel into* someone. It tells you not just what to say, but when to say it, and when to stay silent.",
    who: "Sándor Ferenczi", src: "Tact — “The Elasticity of Psycho-Analytic Technique” (1928)" },
  { t: "Professional calm can repeat the coldness that did harm in the first place. Detachment isn’t always neutral. Sometimes warmth is the honest response.",
    who: "Sándor Ferenczi", src: "The Clinical Diary (1932)" },
  { t: "Children, and adults, who sense they weren’t wanted can lose some of their will to live.",
    who: "Sándor Ferenczi", src: "“The Unwelcome Child and His Death-Instinct” (1929)" },
  { t: "There’s an old longing in all of us to return to somewhere warm and wordless, the womb, even the sea.",
    who: "Sándor Ferenczi", src: "Thalassa: A Theory of Genitality (1924)" },
  { t: "Children speak the language of tenderness. Harm follows when adults answer in the language of passion. With the vulnerable, make sure you’re speaking their language.",
    who: "Sándor Ferenczi", src: "Tenderness and passion — “Confusion of Tongues between Adults and the Child” (1933)" },
  { t: "Even those who listen for a living have blind spots. The listener needs listening to as well.",
    who: "Sándor Ferenczi", src: "Mutual analysis — The Clinical Diary (1932)" },
  { t: "Children forced to grow up too soon become wise babies, looking after the adults who should have looked after them.",
    who: "Sándor Ferenczi", src: "The wise baby — “Confusion of Tongues between Adults and the Child” (1933)" },
  { t: "Some problems aren’t conflicts to resolve but something missing, a basic fault. Insight alone won’t fix a lack. It needs to be met, slowly, by a reliable other.",
    who: "Michael Balint", src: "The Basic Fault (1968)" },
  { t: "Some people cling to objects and feel anxious in the open spaces between them. Know that the spaces are survivable.",
    who: "Michael Balint", src: "Ocnophils — Thrills and Regressions (1959)" },
  { t: "Some people love the open spaces and the thrill of leaving safety, sure they’ll get back. The confidence of returning is part of the thrill.",
    who: "Michael Balint", src: "Philobats — Thrills and Regressions (1959)" },
  { t: "The most frequently prescribed drug is the doctor. How someone treats you has effects, and side effects, as real as any medicine.",
    who: "Michael Balint", src: "The doctor as drug — The Doctor, His Patient and the Illness (1957)" },
  { t: "Our first carer transformed our whole world, and we go on searching for things that will transform us again: lovers, holidays, new kitchens. It’s the same search.",
    who: "Christopher Bollas", src: "The transformational object — The Shadow of the Object (1987)" },
  { t: "Some people are abnormally normal, all facts and objects, with no interest in inner life. It doesn’t look like illness.",
    who: "Christopher Bollas", src: "Normotic illness — The Shadow of the Object (1987)" },
  { t: "Fate is being determined by circumstances. Destiny is using your life to express who you are. Everyone gets fate.",
    who: "Christopher Bollas", src: "Fate and destiny — Forces of Destiny (1989)" },
  { t: "We give shape to who we are through what we choose. Taste is a way of speaking ourselves.",
    who: "Christopher Bollas", src: "Being a Character (1992)" },
  { t: "Some things evoke parts of you that you didn’t know were there: a song, a street, a smell. Pay attention to what moves you. It’s a message from yourself.",
    who: "Christopher Bollas", src: "Evocative objects — Being a Character (1992)" },
  { t: "The unconscious keeps breaking experience into fragments and recombining them in new ways. You can see it in dreams, in free association, and when you crack up laughing.",
    who: "Christopher Bollas", src: "Cracking Up (1995)" },
  { t: "Free association is the mind’s natural way of thinking. Its logic only shows itself over time. Not every thought needs to arrive in clear order. Let each thought come.",
    who: "Christopher Bollas", src: "The Mystery of Things (1999)" },
  { t: "Modern life discourages reflection, and some unhappiness may be the cost of never having time to think.",
    who: "Christopher Bollas", src: "Meaning and Melancholia (2018)" },
  { t: "Some people take over others’ feelings or experiences as if they were their own, leaving the other strangely emptied.",
    who: "Christopher Bollas", src: "Extractive introjection — The Shadow of the Object (1987)" },
  { t: "Being loved as an object isn’t the same as being known as a person. We need to be recognized by someone we in turn recognize.",
    who: "Jessica Benjamin", src: "Like Subjects, Love Objects (1995)" },
  { t: "When an argument becomes ‘who’s doing what to whom,’ look for the third: a shared position where you can both be heard.",
    who: "Jessica Benjamin", src: "The third — Beyond Doer and Done To (2018)" },
  { t: "Every relationship breaks and mends. What matters isn’t avoiding inevitable rupture, but being able to repair it.",
    who: "Jessica Benjamin", src: "Rupture and repair — Beyond Doer and Done To (2018)" },
  { t: "Repair starts with acknowledgment: saying clearly that harm was done and seeing its effect. ‘I hurt you and I see it’ does more than any apology that defends itself.",
    who: "Jessica Benjamin", src: "Acknowledgment — Beyond Doer and Done To (2018)" },
  { t: "Boredom is a state of suspended anticipation, a waiting for a desire you don’t have yet.",
    who: "Adam Phillips", src: "Boredom — On Kissing, Tickling, and Being Bored (1993)" },
  { t: "You can’t tickle yourself. Some pleasures need another person, and require you to cede control.",
    who: "Adam Phillips", src: "Tickling — On Kissing, Tickling, and Being Bored (1993)" },
  { t: "Nobody really knows what they’re doing with fidelity, desire and love. Everyone is improvising.",
    who: "Adam Phillips", src: "Monogamy (1996)" },
  { t: "We have detailed descriptions of madness and very few of sanity. We may not know what we’re aiming for.",
    who: "Adam Phillips", src: "Going Sane (2005)" },
  { t: "Kindness has become suspect, seen as weakness or naivety. It’s actually one of life’s great pleasures.",
    who: "Adam Phillips", src: "On Kindness (2009, with Barbara Taylor)" },
  { t: "Frustration is where you discover what you want. Rush to relieve it and you lose the information.",
    who: "Adam Phillips", src: "Frustration — Missing Out: In Praise of the Unlived Life (2012)" },
  { t: "Balance is overrated. Some of what matters most, love among it, involves excess.",
    who: "Adam Phillips", src: "On Balance (2010)" },
  { t: "Be wary of anyone who knows exactly what you mean, including experts. Curiosity is more useful than certainty.",
    who: "Adam Phillips", src: "Terrors and Experts (1995)" },
  { t: "Accepting that everything ends, ourselves included, is what lets life matter. Transience is the condition for meaning.",
    who: "Adam Phillips", src: "Darwin’s Worms (1999)" },
  { t: "We use promises and theories to manage what we can’t control. A promise is partly a hope dressed as a certainty.",
    who: "Adam Phillips", src: "Promises, Promises (2000)" },
  { t: "We’re so fascinated by forbidden pleasures that we neglect the ones nobody stops us having.",
    who: "Adam Phillips", src: "Unforbidden Pleasures (2015)" },
  { t: "Everyone wants attention, and what we attend to shapes who we become.",
    who: "Adam Phillips", src: "Attention Seeking (2019)" },
  { t: "Wanting to become someone else can be a way of not acknowledging who you already are.",
    who: "Adam Phillips", src: "On Wanting to Change (2021)" },
  { t: "Getting better means becoming more fully who you are, not someone new. Recovery isn’t replacement.",
    who: "Adam Phillips", src: "On Getting Better (2021)" },
  { t: "Giving things up can be a form of freedom, not just defeat. Knowing what to let go of matters as much as knowing what to pursue.",
    who: "Adam Phillips", src: "On Giving Up (2024)" },
  { t: "We bring both hope and dread into new relationships: hope of something new, dread of repeating something old.",
    who: "Stephen A. Mitchell", src: "Hope and Dread in Psychoanalysis (1993)" },
  { t: "Romance fades less from familiarity than from believing you know your partner completely. Nobody is fully known. Stay curious about the person you live with.",
    who: "Stephen A. Mitchell", src: "Can Love Last? (2002)" },
  { t: "We are always influenced by others. Autonomy isn’t freedom from influence. It’s owning the influences you’ve taken in.",
    who: "Stephen A. Mitchell", src: "Influence and Autonomy in Psychoanalysis (1997)" },
  { t: "Love is a tension between the wish for safety and the wish for adventure. The work is in keeping both alive with the same person.",
    who: "Stephen A. Mitchell", src: "Safety and adventure — Can Love Last? (2002)" },
  { t: "What disgusts us marks the border between ‘me’ and ‘not me.’ Disgust defends identity.",
    who: "Julia Kristeva", src: "Abjection — Powers of Horror (1980)" },
  { t: "Depression can feel like a black sun: an inner light that gives no warmth, tied to a loss that can’t be named. Finding words for it is part of the way out.",
    who: "Julia Kristeva", src: "Black Sun: Depression and Melancholia (1987)" },
  { t: "Love both dissolves and remakes the boundaries of the self. That’s why it’s thrilling and frightening.",
    who: "Julia Kristeva", src: "Tales of Love (1983)" },
  { t: "Question yourself as well as the world. Inner life depends on that kind of intimate revolt.",
    who: "Julia Kristeva", src: "Intimate revolt — The Sense and Non-Sense of Revolt (1996)" },
  { t: "A parent can be present but emotionally absent, often lost in their own grief. A child tries to revive them, and may later feel hollow without knowing why.",
    who: "André Green", src: "“The Dead Mother” (1980)" },
  { t: "What’s missing shapes us as much as what’s there: absences, losses, the things that never happened.",
    who: "André Green", src: "The Work of the Negative (1993)" },
  { t: "Some withdrawal sustains the self. Some seeks to reduce all desire to nothing.",
    who: "André Green", src: "Life Narcissism, Death Narcissism (1983)" },
  { t: "Parents send children messages charged with meanings the parents themselves don’t understand. We spend a lifetime translating them.",
    who: "Jean Laplanche", src: "The enigmatic signifier — New Foundations for Psychoanalysis (1987)" },
  { t: "An event can become a wound only later, when we come to understand it.",
    who: "Jean Laplanche", src: "“Notes on Afterwardsness” — Essays on Otherness (1999)" },
  { t: "Every close relationship creates a third subject that belongs to neither person alone.",
    who: "Thomas Ogden", src: "The analytic third — Subjects of Analysis (1994)" },
  { t: "Stray thoughts and daydreams during a conversation can be clues to what’s happening between you.",
    who: "Thomas Ogden", src: "“Reverie and Interpretation” (1997)" },
  { t: "Some experiences can’t be digested alone. We need someone to help us dream what we couldn’t dream by ourselves.",
    who: "Thomas Ogden", src: "Dreaming undreamt dreams — This Art of Psychoanalysis (2005)" },
  { t: "Comfort sometimes has to come through the body before it can come through words: rhythm, warmth, texture.",
    who: "Thomas Ogden", src: "The autistic-contiguous position — The Primitive Edge of Experience (1989)" },
  { t: "Every separation echoes the first one, birth. Allow yourself to find endings harder than they look.",
    who: "Otto Rank", src: "The Trauma of Birth (1924)" },
  { t: "We fear standing out and alone, and we fear dissolving into others. We spend our lives moving between the two.",
    who: "Otto Rank", src: "Life fear and death fear — Will Therapy (1936)" },
  { t: "Creativity turns inner conflict into form. You don’t have to resolve a struggle before making something from it.",
    who: "Otto Rank", src: "Art and Artist (1932)" },
  { t: "The will is a creative force, not just stubbornness.",
    who: "Otto Rank", src: "The creative will — Will Therapy (1936)" },
  { t: "We are all much more simply human than otherwise. When someone seems incomprehensible, start from that.",
    who: "Harry Stack Sullivan", src: "The one-genus postulate — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "We fail to notice whatever would make us anxious, and so we miss the very experiences we could learn from.",
    who: "Harry Stack Sullivan", src: "Selective inattention — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "We sort ourselves into good-me, bad-me and not-me. Not-me holds what’s too frightening to own.",
    who: "Harry Stack Sullivan", src: "Good-me, bad-me, not-me — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "In anxious moments we deflect: jokes, topic changes, sudden interest in the mundane. It reduces anxiety at the cost of contact.",
    who: "Harry Stack Sullivan", src: "Security operations — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "A close childhood friendship teaches you to care about someone else’s wellbeing as much as your own.",
    who: "Harry Stack Sullivan", src: "Chumship — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "When someone matches the feeling behind what you do, not just the action, you feel understood. That’s attunement.",
    who: "Daniel Stern", src: "Affect attunement — The Interpersonal World of the Infant (1985)" },
  { t: "Change often happens in brief moments of real meeting, just seconds long.",
    who: "Daniel Stern", src: "The Present Moment in Psychotherapy and Everyday Life (2004)" },
  { t: "Infants live in a sensory world of light, hunger, and faces. Adults still live partly there.",
    who: "Daniel Stern", src: "Diary of a Baby (1990)" },
  { t: "Without an integrated sense of self and other, each relationship produces a different you.",
    who: "Otto Kernberg", src: "Identity diffusion — Borderline Conditions and Pathological Narcissism (1975)" },
  { t: "Mature love integrates tenderness with desire and even some aggression. Love with no room for ambivalence tends not to last.",
    who: "Otto Kernberg", src: "Love Relations: Normality and Pathology (1995)" },
  { t: "Feelings of inferiority are universal and drive human striving. They become a problem only when they harden into a complex.",
    who: "Alfred Adler", src: "The inferiority feeling — Understanding Human Nature (1927)" },
  { t: "Psychological health shows in social interest: a feeling of community and concern for others.",
    who: "Alfred Adler", src: "Social interest — What Life Should Mean to You (1931)" },
  { t: "Life sets three tasks: work, friendship and love. Each tests your connection to others.",
    who: "Alfred Adler", src: "The three life tasks — What Life Should Mean to You (1931)" },
  { t: "Birth order shapes the roles children take on. Siblings grow up in different families under the same roof.",
    who: "Alfred Adler", src: "Birth order — Understanding Human Nature (1927)" },
  { t: "By early childhood you’ve adopted a style of life, a characteristic way of meeting problems. It can change, but needs to be noticed first.",
    who: "Alfred Adler", src: "Style of life — Understanding Human Nature (1927)" },
  { t: "Defenses live in the body: tight jaws, raised shoulders, a held breath. Your body has been bracing.",
    who: "Wilhelm Reich", src: "Character armor — Character Analysis (1933)" },
  { t: "How someone speaks reveals as much as what they say.",
    who: "Wilhelm Reich", src: "Character Analysis (1933)" },
  { t: "Femininity can be worn as a mask to ward off retaliation for success.",
    who: "Joan Riviere", src: "“Womanliness as a Masquerade” (1929)" },
  { t: "Some people get worse when helped, because getting better feels like abandoning someone they love.",
    who: "Joan Riviere", src: "“A Contribution to the Analysis of the Negative Therapeutic Reaction” (1936)" },
  { t: "What actually makes you happy is often not what you assume.",
    who: "Marion Milner", src: "A Life of One’s Own (1934, as Joanna Field)" },
  { t: "Widening your attention, rather than narrowing it on a goal, makes the ordinary vivid.",
    who: "Marion Milner", src: "Wide attention — A Life of One’s Own (1934, as Joanna Field)" },
  { t: "You can often only create freely once you stop trying to control the result. Creativity requires tolerance of not knowing.",
    who: "Marion Milner", src: "On Not Being Able to Paint (1950)" },
  { t: "Some things can be shown before they can be said.",
    who: "Marion Milner", src: "The Hands of the Living God (1969)" },
  { t: "Frames matter: the edge of a picture, the end of an hour. A boundary makes certain experience possible.",
    who: "Marion Milner", src: "The frame — “The Role of Illusion in Symbol Formation” (1952)" },
  { t: "When a symbol is felt to be the thing itself, trouble follows.",
    who: "Hanna Segal", src: "The symbolic equation — “Notes on Symbol Formation” (1957)" },
  { t: "Making something beautiful can be a way of mourning: rebuilding a lost world in a new form.",
    who: "Hanna Segal", src: "“A Psycho-Analytical Approach to Aesthetics” (1952)" },
  { t: "It’s possible to become quietly addicted to despair, finding a secret comfort in it.",
    who: "Betty Joseph", src: "“Addiction to Near-Death” (1982)" },
  { t: "We keep our inner balance by pulling others into familiar patterns, often without anyone noticing.",
    who: "Betty Joseph", src: "Psychic Equilibrium and Psychic Change (1989)" },
  { t: "Part of the self can operate like a gang, promising protection if you refuse to depend on anyone.",
    who: "Herbert Rosenfeld", src: "Destructive narcissism — “A Clinical Approach to the Psychoanalytic Theory of the Life and Death Instincts” (1971)" },
  { t: "We have inner hideouts that protect us from pain, and from growth, in equal measure.",
    who: "John Steiner", src: "Psychic Retreats (1993)" },
  { t: "Shame is about being seen at the wrong moment. The cure is usually being seen kindly at the right one.",
    who: "John Steiner", src: "Seeing and Being Seen (2011)" },
  { t: "Narcissism is turning away from what could sustain you because it comes from outside.",
    who: "Neville Symington", src: "The lifegiver — Narcissism: A New Theory (1993)" },
  { t: "Gifted children learn early to sense and meet their parents’ needs, and lose touch with their own.",
    who: "Alice Miller", src: "The Drama of the Gifted Child (1979)" },
  { t: "Much depression is grief for the self you were never allowed to be.",
    who: "Alice Miller", src: "Depression as grief — The Drama of the Gifted Child (1979)" },
  { t: "Cruelty to children has often been justified as good upbringing. Listen closely to anything done ‘for your own good,’ including what you now do to yourself.",
    who: "Alice Miller", src: "For Your Own Good (1980)" },
  { t: "A child needs an average expectable environment. Not ideal conditions, but ordinary adequate ones.",
    who: "Heinz Hartmann", src: "The average expectable environment — Ego Psychology and the Problem of Adaptation (1939)" },
  { t: "Psychological birth happens long after physical birth, through a slow process of separating, individuating, and becoming oneself.",
    who: "Margaret Mahler", src: "The Psychological Birth of the Human Infant (1975)" },
  { t: "Toddlers run off to explore, discover they’re separate, and come back anxiously for reassurance. Adults do the same with every big step.",
    who: "Margaret Mahler", src: "Rapprochement — The Psychological Birth of the Human Infant (1975)" },
  { t: "Separation and individuation are twin processes: emerging from oneness with a parent, and becoming your own person.",
    who: "Margaret Mahler", src: "Separation-individuation — The Psychological Birth of the Human Infant (1975)" },
  { t: "Some people adapt perfectly to every setting but feel nothing genuine.",
    who: "Helene Deutsch", src: "The ‘as-if’ personality — “Some Forms of Emotional Disturbance and Their Relationship to Schizophrenia” (1942)" },
  { t: "The early caregiver shapes how a child learns to relate, and the pattern reproduces itself. Change who holds the baby, and you alter how their life unfolds.",
    who: "Nancy Chodorow", src: "The Reproduction of Mothering (1978)" },
  { t: "Siblings shape us sideways in ways theories about parents miss. Your first rival and ally arrived in the same house.",
    who: "Juliet Mitchell", src: "Siblings (2003)" },
  { t: "We’ve medicalized grief as depression and lost the rituals that helped people mourn.",
    who: "Darian Leader", src: "The New Black (2008)" },
  { t: "Letters we write and never send are still a way of speaking, to ourselves as much as the other.",
    who: "Darian Leader", src: "Why Do Women Write More Letters Than They Post? (1996)" },
  { t: "Being mad is different from going mad. Madness can be quiet and stable; the crisis comes when what held it together gives way.",
    who: "Darian Leader", src: "What Is Madness? (2011)" },
  { t: "Insomnia can express what you can’t put into words. Try bringing midnight thoughts to daylight.",
    who: "Darian Leader", src: "Why Can’t We Sleep? (2019)" },
  { t: "Praising children can be a substitute for attention: a quick verdict in place of really noticing.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "People resist change because change involves loss. Staying stuck can be a way of not giving something up.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "The stories we tell about ourselves most can hide other stories we can’t yet tell.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "Inertia can be a protest against relentless demands to perform.",
    who: "Josh Cohen", src: "Not Working: Why We Have to Stop (2018)" },
  { t: "Burnout is exhausted desire: not just tiredness, but no longer being able to want.",
    who: "Josh Cohen", src: "Burnout — Not Working: Why We Have to Stop (2018)" },
  { t: "Without enough holding, babies hold themselves together with tense muscles or constant movement. Adults use busyness.",
    who: "Esther Bick", src: "The second skin — “The Experience of the Skin in Early Object-Relations” (1968)" },
  { t: "A part of the self can withdraw from a world that once felt like too much. It isn’t absent, it’s hiding.",
    who: "Harry Guntrip", src: "Schizoid Phenomena, Object-Relations and the Self (1968)" },
  { t: "We are lived by forces we don’t know and can’t fully steer. Acceptance of this fact can offer relief.",
    who: "Georg Groddeck", src: "The Book of the It (1923)" },
  { t: "Listen with a third ear: to what isn’t said, and to your own reactions. The pauses carry as much as the words.",
    who: "Theodor Reik", src: "Listening with the Third Ear (1948)" },
  { t: "Surprise is often a sign you’ve touched something true. The thought that startles you is one worth keeping.",
    who: "Theodor Reik", src: "Surprise — Listening with the Third Ear (1948)" },
  { t: "Healing turns ghosts into ancestors: The past stops haunting and starts guiding.",
    who: "Hans Loewald", src: "Ghosts into ancestors — “On the Therapeutic Action of Psycho-Analysis” (1960)" },
  { t: "Growing up means taking over your parents’ authority and becoming responsible for yourself.",
    who: "Hans Loewald", src: "“The Waning of the Oedipus Complex” (1979)" },
  { t: "A good helper holds a picture of who you could become, a future version a little further along.",
    who: "Hans Loewald", src: "“On the Therapeutic Action of Psycho-Analysis” (1960)" },
  { t: "Parents who can remember and feel their own childhood pain are less likely to repeat it.",
    who: "Selma Fraiberg", src: "“Ghosts in the Nursery” (1975)" },
  { t: "The capacity to mentalize, or understand behavior in terms of what people think and feel, helps prevent and solve conflict.",
    who: "Peter Fonagy", src: "Mentalization — Affect Regulation, Mentalization, and the Development of the Self (2002)" },
  { t: "To be helped, you need to be able to trust others as sources of knowledge.",
