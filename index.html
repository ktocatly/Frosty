    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "Grosz’s patients often tell one story to avoid a much quieter one. Notice the story you tell at every dinner party.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "Josh Cohen argues that inertia isn’t always laziness. Sometimes doing nothing is the mind’s protest against doing too much. Lie down. It’s research.",
    who: "Josh Cohen", src: "Not Working: Why We Have to Stop (2018)" },
  { t: "Cohen describes burnout as a kind of exhausted desire. You’re not out of energy. You’re out of wanting.",
    who: "Josh Cohen", src: "Burnout — Not Working: Why We Have to Stop (2018)" },
  { t: "Bick saw babies hold themselves together with tense muscles or constant movement: a second skin. Adults use busyness. You can put it down for an hour.",
    who: "Esther Bick", src: "The second skin — “The Experience of the Skin in Early Object-Relations” (1968)" },
  { t: "Guntrip described a withdrawn self that hides from a world that once felt like too much. It isn’t cold. It’s waiting for a warm enough invitation.",
    who: "Harry Guntrip", src: "Schizoid Phenomena, Object-Relations and the Self (1968)" },
  { t: "Groddeck said we are lived by the It: forces we don’t know and can’t steer. Freud borrowed the idea. Neither of them found the off switch.",
    who: "Georg Groddeck", src: "The Book of the It (1923)" },
  { t: "Reik said you need a third ear to hear what isn’t being said. Two are for the words. The third is for the pauses.",
    who: "Theodor Reik", src: "Listening with the Third Ear (1948)" },
  { t: "Reik trusted surprise as a sign of truth. If something someone says startles you, pay attention. That’s the bit that matters.",
    who: "Theodor Reik", src: "Surprise — Listening with the Third Ear (1948)" },
  { t: "Loewald said the work is turning ghosts into ancestors: letting the past rest so it guides instead of haunts. Ghosts rattle. Ancestors just sit on the mantelpiece.",
    who: "Hans Loewald", src: "Ghosts into ancestors — “On the Therapeutic Action of Psycho-Analysis” (1960)" },
  { t: "Loewald thought growing up means taking over your parents’ authority, a kind of necessary parricide. You can do it kindly. You still have to do it.",
    who: "Hans Loewald", src: "“The Waning of the Oedipus Complex” (1979)" },
  { t: "Loewald saw the analyst as someone holding a picture of who you could become. Find people who see a slightly better version of you. Then disappoint them less.",
    who: "Hans Loewald", src: "“On the Therapeutic Action of Psycho-Analysis” (1960)" },
  { t: "Fraiberg found that parents who can remember their own childhood pain are less likely to pass it on. The danger isn’t the memory. It’s the forgetting.",
    who: "Selma Fraiberg", src: "“Ghosts in the Nursery” (1975)" },
  { t: "Mentalizing means imagining what’s going on in someone else’s head, and in yours. Most arguments begin when somebody stops doing it.",
    who: "Peter Fonagy", src: "Mentalization — Affect Regulation, Mentalization, and the Development of the Self (2002)" },
  { t: "Fonagy writes about epistemic trust: being able to learn from other people at all. If no advice ever goes in, the problem may not be the advice.",
    who: "Peter Fonagy", src: "Epistemic trust — “The Role of Mentalizing and Epistemic Trust in the Therapeutic Relationship” (2014, with Elizabeth Allison)" },
  { t: "Sandler said we seek a background feeling of safety even more than pleasure. That’s why routine is soothing and holidays are exhausting.",
    who: "Joseph Sandler", src: "“The Background of Safety” (1960)" },
  { t: "Schafer suggested saying ‘I worried’ instead of ‘the worry got me’. Feelings aren’t weather. You’re doing some of them.",
    who: "Roy Schafer", src: "Action language — A New Language for Psychoanalysis (1976)" },
  { t: "Schafer thought therapy is retelling your life as a better story. Not a fake one. Just one with fewer villains and more plot.",
    who: "Roy Schafer", src: "Retelling a Life (1992)" },
  { t: "Spence argued that what helps is often narrative truth, not historical accuracy. Your memory of that holiday is wrong. It’s still yours.",
    who: "Donald Spence", src: "Narrative Truth and Historical Truth (1982)" },
  { t: "Lear wrote about hope that survives the end of a whole way of life: hoping without knowing what for. Snowmen understand this better than most.",
    who: "Jonathan Lear", src: "Radical Hope (2006)" },
  { t: "Lear argues there’s always something left over that doesn’t fit our idea of a happy life. That remainder isn’t a fault. It’s you.",
    who: "Jonathan Lear", src: "Happiness, Death, and the Remainder of Life (2000)" },
  { t: "Lear says Freud’s real insight was that the mind isn’t a tidy place. Stop trying to tidy all of it. Organise one drawer.",
    who: "Jonathan Lear", src: "Open Minded (1998)" },
  { t: "Eigen wrote that we’re often fed by the same people who poison us, which is why we can’t spit it out. Learn to taste what you’re being given.",
    who: "Michael Eigen", src: "Toxic Nourishment (1999)" },
  { t: "Meltzer thought life’s first shock is beauty: a baby overwhelmed by its mother’s face. Being moved by something isn’t soft. It’s original.",
    who: "Donald Meltzer", src: "Aesthetic conflict — The Apprehension of Beauty (1988)" },
  { t: "McDougall said we each run an inner theatre where old dramas keep playing. You can’t close it. You can recast it.",
    who: "Joyce McDougall", src: "Theaters of the Mind (1985)" },
  { t: "When feelings can’t find words, McDougall found, the body speaks them instead. Your stiff neck may have something to say.",
    who: "Joyce McDougall", src: "Theaters of the Body (1989)" },
  { t: "Anzieu thought the ego starts out as a skin: a boundary that holds and protects. Some days you need to thicken it. Some days you need to let a little weather in.",
    who: "Didier Anzieu", src: "The Skin-Ego (1985)" },
  { t: "Spielrein argued that every creation involves some destruction. To make something new, something old has to go. Spring is very rude to snowmen.",
    who: "Sabina Spielrein", src: "“Destruction as the Cause of Coming into Being” (1912)" },
  { t: "Ghent separated surrender from submission. Submission gives yourself up. Surrender lets a defence go. One shrinks you. The other doesn’t.",
    who: "Emmanuel Ghent", src: "“Masochism, Submission, Surrender” (1990)" },
  { t: "Hoffman thought therapy needs ritual and spontaneity. So do relationships. Have the usual Friday dinner. Occasionally, don’t.",
    who: "Irwin Z. Hoffman", src: "Ritual and Spontaneity in the Psychoanalytic Process (1998)" },
  { t: "Fantasy, Žižek says, doesn’t give you what you want. It teaches you how to want. Check who wrote yours.",
    who: "Slavoj Žižek", src: "Fantasy — The Plague of Fantasies (1997)" },
  { t: "People know very well what they’re doing, Žižek says, and they do it anyway. Cynicism isn’t freedom. It’s just knowing all the words to the song.",
    who: "Slavoj Žižek", src: "Cynical reason — The Sublime Object of Ideology (1989)" },
  { t: "Fink explains why Lacanian sessions can end abruptly on a striking word: it keeps you thinking. Try ending conversations a little earlier. People remember the last line.",
    who: "Bruce Fink", src: "A Clinical Introduction to Lacanian Psychoanalysis (1997)" },
  { t: "Jacobson described how our images of ourselves and others form together. Change how you see your mother and you’ll see yourself differently too.",
    who: "Edith Jacobson", src: "The Self and the Object World (1964)" },
  { t: "Abraham linked mourning to taking the lost person inside you. You may notice you’ve started using their phrases. That’s how they stay.",
    who: "Karl Abraham", src: "“A Short Study of the Development of the Libido” (1924)" },
  { t: "Stolorow says pain becomes unbearable trauma when there’s nobody to share it with. Pain needs a home. Find it one.",
    who: "Robert Stolorow", src: "Trauma and Human Existence (2007)" },
  { t: "Verhaeghe argues that a culture obsessed with performance produces anxious, lonely selves. If you feel like a product, it’s partly the shop’s fault.",
    who: "Paul Verhaeghe", src: "What About Me? (2012)" },
];

const bubble = document.getElementById('bubble');
const byline = document.getElementById('byline');
const snowman = document.getElementById('snowman');
const countEl = document.getElementById('count');
let deck = [], n = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function next() {
  if (!deck.length) deck = shuffle(ADVICE.slice());
  return deck.pop();
}
function speak() {
  const a = next();
  n++;
  bubble.classList.remove('fresh'); void bubble.offsetWidth; bubble.classList.add('fresh');
  bubble.innerHTML = '';
  const p = document.createElement('p'); p.textContent = '“' + a.t + '”'; bubble.appendChild(p);
  byline.querySelector('.who').textContent = a.who;
  byline.querySelector('.src').textContent = a.src;
  countEl.textContent = 'Session ' + n;
  snowman.classList.remove('wobble'); void snowman.offsetWidth; snowman.classList.add('wobble');
}
snowman.addEventListener('click', speak);
document.getElementById('again').addEventListener('click', speak);

document.getElementById('issue').textContent =
  new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });

// Gentle snowfall
const c = document.getElementById('snowfall'), ctx = c.getContext('2d');
let flakes = [];
function size() {
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  const count = Math.min(140, Math.floor(innerWidth / 8));
  flakes = Array.from({ length: count }, () => ({
    x: Math.random() * c.width, y: Math.random() * c.height,
    r: (Math.random() * 2 + 0.8) * devicePixelRatio, s: Math.random() * 0.6 + 0.3, d: Math.random() * Math.PI * 2
  }));
}
function tick() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const f of flakes) {
    f.y += f.s * devicePixelRatio; f.d += 0.01; f.x += Math.sin(f.d) * 0.4 * devicePixelRatio;
    if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(tick);
}
addEventListener('resize', size);
size();
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
</script>
