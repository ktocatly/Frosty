<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frosty Says</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe3;
    --paper-edge: #e6dcc6;
    --ink: #2a2622;
    --ink-soft: #6b6157;
    --rule: #2a2622;
    --night: #1d2a44;
    --night-2: #34476b;
    --snow: #fbfaf6;
    --scarf: #3f6b4e;
    --scarf-2: #2c4f39;
    --hat: #2f3a34;
    --nose: #e07a2e;
    --bubble: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    background-image: radial-gradient(ellipse at top, var(--night-2), var(--night) 70%);
    min-height: 100vh;
    font-family: "Libre Baskerville", Georgia, serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
  }
  #snowfall { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .column {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(180,160,120,.12), transparent 50%);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    padding: 28px 28px 22px;
    transform: rotate(-0.4deg);
  }

  /* Masthead */
  .meta {
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
    border-top: 3px double var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 6px 0;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900;
    font-size: clamp(44px, 12vw, 72px);
    line-height: .95;
    text-align: center;
    margin: 14px 0 4px;
    letter-spacing: -.01em;
  }
  .dek {
    text-align: center;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  /* Stage */
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; }

  .bubble {
    position: relative;
    width: 100%;
    min-height: 132px;
    background: var(--bubble);
    border: 2px solid var(--ink);
    border-radius: 22px;
    padding: 18px 20px;
    margin: 6px 0 18px;
    font-size: 16px;
    line-height: 1.6;
    box-shadow: 4px 4px 0 rgba(42,38,34,.15);
    display: flex; align-items: center;
  }
  .bubble::after, .bubble::before {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    border-style: solid;
  }
  .bubble::before { bottom: -18px; border-width: 18px 14px 0 14px; border-color: var(--ink) transparent transparent; }
  .bubble::after  { bottom: -14px; border-width: 15px 11px 0 11px; border-color: var(--bubble) transparent transparent; }
  .bubble p { margin: 0; }
  .bubble .hint { color: var(--ink-soft); font-style: italic; text-align: center; width: 100%; }
  .bubble.fresh p { animation: inkIn .5s ease both; }
  @keyframes inkIn { from { opacity: 0; filter: blur(3px); transform: translateY(4px); } to { opacity: 1; filter: none; transform: none; } }

  .snowman-btn {
    appearance: none; border: 0; background: none; padding: 0; margin: 0;
    cursor: pointer; width: min(320px, 80vw);
    -webkit-tap-highlight-color: transparent;
  }
  .snowman-btn:focus-visible { outline: 3px dashed var(--scarf); outline-offset: 6px; border-radius: 12px; }
  .snowman-btn img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(0 10px 10px rgba(42,38,34,.22));
    transform-origin: 50% 90%;
    user-select: none; -webkit-user-drag: none;
  }
  .snowman-btn.wobble img { animation: wobble .6s ease; }
  @keyframes wobble {
    0% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-4deg) scale(1.03, .97); }
    45% { transform: rotate(3deg) scale(.98, 1.03); }
    70% { transform: rotate(-1.5deg); }
    100% { transform: rotate(0) scale(1); }
  }

  /* Byline / citation */
  .byline {
    margin-top: 14px;
    border-top: 1px solid var(--rule);
    padding-top: 10px;
    min-height: 66px;
    font-size: 13px;
    line-height: 1.5;
  }
  .byline .label {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .byline .who {
    font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 18px;
  }
  .byline .src { color: var(--ink-soft); font-style: italic; }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 3px double var(--rule);
    margin-top: 12px; padding-top: 8px;
    font-size: 11px; color: var(--ink-soft);
  }
  .footer button {
    font: inherit; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    background: none; border: 1px solid var(--ink-soft); color: var(--ink);
    padding: 5px 10px; cursor: pointer; border-radius: 3px;
  }
  .footer button:hover { background: var(--ink); color: var(--paper); }

  @media (max-width: 420px) {
    .column { padding: 20px 16px 16px; transform: none; }
    .bubble { font-size: 15px; padding: 14px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .snowman-btn.wobble img, .bubble.fresh p { animation: none; }
  }
</style>
</head>
<body>
<canvas id="snowfall" aria-hidden="true"></canvas>

<main class="column">
  <div class="meta"><span>The Winter Gazette</span><span id="issue">Advice Column</span></div>
  <h1>Frosty Says</h1>
  <p class="dek">Your snowman is with you &mdash; tap him anywhere for a word from the unconscious.</p>

  <section class="stage">
    <div class="bubble" id="bubble" aria-live="polite">
      <p class="hint">&ldquo;Go on, poke me. I&rsquo;ve been listening all winter and I have notes.&rdquo;</p>
    </div>

    <button class="snowman-btn" id="snowman" aria-label="Tap the snowman for advice">
      <img src="frosty.webp" alt="Frosty, a plush snowman in a green hat and scarf" width="640" height="835">
    </button>
  </section>

  <section class="byline" id="byline" aria-live="polite">
    <div class="label">Speaking according to</div>
    <div class="who">&hellip;</div>
    <div class="src">Tap the snowman to begin your session.</div>
  </section>

  <div class="footer">
    <span id="count">Session 0</span>
    <button id="again" type="button">Another, please</button>
  </div>
</main>

<script>
const ADVICE = [
  { t: "Slips of the tongue and forgotten names are rarely accidents.",
    who: "Sigmund Freud", src: "On parapraxes — The Psychopathology of Everyday Life (1901)" },
  { t: "What we can’t remember, we repeat, as an action rather than a memory, without knowing we’re repeating it.",
    who: "Sigmund Freud", src: "Repetition compulsion — “Remembering, Repeating and Working-Through” (1914)" },
  { t: "When someone dies, reality tells us they’re gone, but love can’t let go all at once. Each memory and hope tied to them has to be called up and released, one by one, which is why mourning takes so long and hurts so much. When the work is done, we’re free to love again.",
    who: "Sigmund Freud", src: "The work of mourning — “Mourning and Melancholia” (1917)" },
  { t: "Your inner critic is built from your parents’ voices, and their parents’ before them. Before you obey it, ask whose voice it’s using.",
    who: "Sigmund Freud", src: "The superego — The Ego and the Id (1923)" },
  { t: "A healthy person should be able to do two things: to love and to work.",
    who: "Sigmund Freud", src: "Lieben und arbeiten, as reported by Erik Erikson" },
  { t: "The person you love and the person you’re furious with are the same person. Realising that hurts more than keeping them separate. It’s also what makes real love possible.",
    who: "Melanie Klein", src: "The depressive position — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "When someone seems all good or all bad, you may be splitting. It’s harder, but try holding both versions at once.",
    who: "Melanie Klein", src: "Splitting — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Envy attacks a good thing precisely because it’s good and isn’t yours. Gratitude lets it stay good.",
    who: "Melanie Klein", src: "Envy and Gratitude (1957)" },
  { t: "A good-enough parent fails a child in small, bearable ways, and those failures teach the child the world is real.",
    who: "D. W. Winnicott", src: "The good-enough mother — Playing and Reality (1971)" },
  { t: "A false self grows up to comply with others and protect a true self that can’t risk being seen. Only the true self feels real.",
    who: "D. W. Winnicott", src: "True and False Self — “Ego Distortion in Terms of True and False Self” (1960)" },
  { t: "The capacity to be alone starts with being alone in someone’s presence, like a child playing quietly while a parent sits nearby.",
    who: "D. W. Winnicott", src: "“The Capacity to Be Alone” (1958)" },
  { t: "It’s in playing, and only in playing, that children and adults are able to be creative.",
    who: "D. W. Winnicott", src: "Transitional space — Playing and Reality (1971)" },
  { t: "Desire is the desire of the Other: we learn what to want by wondering what others want, and what they want from us. When you want, ask whose wanting you’re doing.",
    who: "Jacques Lacan", src: "“The Subversion of the Subject and the Dialectic of Desire” (1960)" },
  { t: "The ego is built on an infant’s first look in a mirror: a unified image of a self that feels anything but unified. Hold your self-image lightly.",
    who: "Jacques Lacan", src: "“The Mirror Stage as Formative of the I Function” (1949)" },
  { t: "The unconscious is structured like a language. Slips, puns and odd word choices are where it speaks.",
    who: "Jacques Lacan", src: "Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "The parts of yourself you’d rather not know tend to show up in other people.",
    who: "Carl Jung", src: "The Shadow — Aion (1951)" },
  { t: "Some feelings can’t be thought until a sturdy someone takes them in, holds them, and gives them back in a form you can manage.",
    who: "Wilfred Bion", src: "Container and contained — Learning from Experience (1962)" },
  { t: "Meet each conversation ‘without memory and without desire’, so you see what’s actually there.",
    who: "Wilfred Bion", src: "“Notes on Memory and Desire” (1967)" },
  { t: "A young self learns it’s worth something from the gleam in a parent’s eye.",
    who: "Heinz Kohut", src: "Mirroring selfobjects — The Analysis of the Self (1971)" },
  { t: "Should be better, should be further along, should never need help: the tyranny of the should serves an idealised self that will never be satisfied. Swap a should for an honest want.",
    who: "Karen Horney", src: "Neurosis and Human Growth (1950)" },
  { t: "Immature love says, ‘I love you because I need you.’ Mature love says, ‘I need you because I love you.’",
    who: "Erich Fromm", src: "The Art of Loving (1956)" },
  { t: "Freedom frightens people, so they escape it into authority, conformity and crowds. Notice which of your choices you’ve quietly handed to someone else.",
    who: "Erich Fromm", src: "Escape from Freedom (1941)" },
  { t: "Every stage of life has its own crisis, meaning a turning point rather than a catastrophe. If you feel unsettled, you may simply be between stages.",
    who: "Erik Erikson", src: "Psychosocial stages — Childhood and Society (1950)" },
  { t: "Repression, projection, denial: each defence was a solution once.",
    who: "Anna Freud", src: "The Ego and the Mechanisms of Defence (1936)" },
  { t: "Seeking closeness when you’re frightened isn’t childish. It’s a system you’re born with, and it runs from the cradle to the grave.",
    who: "John Bowlby", src: "Attachment and Loss, Vol. 1: Attachment (1969)" },
  { t: "Children stay loyal to parents who hurt them, because a bad tie is better than none. Adults can do the same with important ties out of fear of loss.",
    who: "W. R. D. Fairbairn", src: "Psychoanalytic Studies of the Personality (1952)" },
  { t: "A child hurt by an adult may come to identify with that adult and take their side against themselves.",
    who: "Sándor Ferenczi", src: "Identification with the aggressor — “Confusion of Tongues” (1932)" },
  { t: "Some things you know deeply but have never thought, because you learned them before you had words.",
    who: "Christopher Bollas", src: "The Shadow of the Object (1987)" },
  { t: "Recognition has to be mutual. When one person only dominates and the other only submits, neither is really seen. Check that the seeing goes both ways.",
    who: "Jessica Benjamin", src: "The Bonds of Love (1988)" },
  { t: "We live as much in the lives we didn’t lead as in the one we did. Mourn the unlived ones a little. Then turn back to the one you actually have.",
    who: "Adam Phillips", src: "Missing Out: In Praise of the Unlived Life (2012)" },
  { t: "The self is made in relationships, and so it’s multiple: you’re a slightly different person with everyone you know.",
    who: "Stephen A. Mitchell", src: "Relational Concepts in Psychoanalysis (1988)" },
  { t: "We are strangers to ourselves. The foreigner already lives within. Make peace with the parts of you that feel foreign, and other strangers become less alarming.",
    who: "Julia Kristeva", src: "Strangers to Ourselves (1988)" },
  { t: "Every dream is the disguised fulfilment of a wish.",
    who: "Sigmund Freud", src: "Wish fulfilment — The Interpretation of Dreams (1900)" },
  { t: "Dreams are the royal road to the unconscious. Write one down when you wake up.",
    who: "Sigmund Freud", src: "The royal road — The Interpretation of Dreams (1900)" },
  { t: "Dreams condense several people into one figure.",
    who: "Sigmund Freud", src: "Condensation — The Interpretation of Dreams (1900)" },
  { t: "Dreams borrow trivial details from the day before to carry thoughts that aren’t trivial at all.",
    who: "Sigmund Freud", src: "Day residue — The Interpretation of Dreams (1900)" },
  { t: "Jokes let us say what we’d otherwise hold back: hostility, desire, contempt.",
    who: "Sigmund Freud", src: "Jokes and Their Relation to the Unconscious (1905)" },
  { t: "Adult desire has a long childhood history and many detours. Be curious about yourself rather than ashamed.",
    who: "Sigmund Freud", src: "Three Essays on the Theory of Sexuality (1905)" },
  { t: "Your daydreams are wishes correcting reality.",
    who: "Sigmund Freud", src: "“Creative Writers and Day-Dreaming” (1908)" },
  { t: "Accepting reality doesn’t cancel pleasure. It postpones it so you can have it more reliably. Waiting for something isn’t the same as losing it.",
    who: "Sigmund Freud", src: "The reality principle — “Formulations on the Two Principles of Mental Functioning” (1911)" },
  { t: "In the end we must begin to love in order not to fall ill. Love turned entirely inwards makes us sick.",
    who: "Sigmund Freud", src: "“On Narcissism: An Introduction” (1914)" },
  { t: "Falling for your therapist, teacher or boss repeats an earlier love, and is also, inconveniently, genuine. Most new loves are both new and very old.",
    who: "Sigmund Freud", src: "“Observations on Transference-Love” (1915)" },
  { t: "The uncanny is the kind of fright that leads back to something long familiar.",
    who: "Sigmund Freud", src: "“The Uncanny” (1919)" },
  { t: "A child throws a toy away and pulls it back, turning being left into a game he controls. We all rehearse our losses somehow.",
    who: "Sigmund Freud", src: "Fort–da — Beyond the Pleasure Principle (1920)" },
  { t: "Part of us is pulled towards stillness and the end of all tension. Not everything in you wants more.",
    who: "Sigmund Freud", src: "The death drive — Beyond the Pleasure Principle (1920)" },
  { t: "In a group, people put the leader in place of their own conscience, which is why crowds do what individuals wouldn’t.",
    who: "Sigmund Freud", src: "Group Psychology and the Analysis of the Ego (1921)" },
  { t: "The ego is like a rider who often has to go where the horse wants, then claims the route as his choice.",
    who: "Sigmund Freud", src: "The ego as rider — The Ego and the Id (1923)" },
  { t: "A repressed thought can surface as long as it’s denied. ‘It’s not that I’m envious’ is usually a fairly good clue. Listen to what you’re quick to deny.",
    who: "Sigmund Freud", src: "“Negation” (1925)" },
  { t: "Anxiety is a signal that danger might be coming. Treat it like a smoke alarm: always worth checking, not always a fire.",
    who: "Sigmund Freud", src: "Signal anxiety — Inhibitions, Symptoms and Anxiety (1926)" },
  { t: "Beliefs driven by wishes are illusions. The voice of the intellect is a soft one, but it doesn’t rest until it’s been heard. Give your quieter doubts a hearing.",
    who: "Sigmund Freud", src: "The Future of an Illusion (1927)" },
  { t: "Humour isn’t resigned. It’s rebellious: the conscience, for once, comforting you. When things are bad, a joke isn’t denial. It’s a way of refusing to be crushed.",
    who: "Sigmund Freud", src: "“Humour” (1927)" },
  { t: "The fiercest feuds are often between people who are nearly alike.",
    who: "Sigmund Freud", src: "The narcissism of minor differences — Civilization and Its Discontents (1930)" },
  { t: "Happiness was never part of the plan of Creation. That isn’t gloomy, it’s freeing.",
    who: "Sigmund Freud", src: "Civilization and Its Discontents (1930)" },
  { t: "Civilisation costs us some happiness by heightening our guilt. If you feel vaguely guilty for no clear reason, it may be the price of living among other people, not proof you’ve done anything wrong.",
    who: "Sigmund Freud", src: "Guilt as the price of civilisation — Civilization and Its Discontents (1930)" },
  { t: "Educating, governing and healing minds are impossible professions: the results are bound to be unsatisfying. Parenting involves all three.",
    who: "Sigmund Freud", src: "The impossible professions — “Analysis Terminable and Interminable” (1937)" },
  { t: "Some people fall ill just when a long-cherished wish comes true. Success can feel forbidden.",
    who: "Sigmund Freud", src: "“Those Wrecked by Success” (1916)" },
  { t: "Listen without deciding in advance what matters. The important part of what someone says is rarely where you expected it.",
    who: "Sigmund Freud", src: "Evenly suspended attention — “Recommendations to Physicians Practising Psycho-Analysis” (1912)" },
  { t: "Each of us carries an early pattern of loving that gets reprinted in every new relationship.",
    who: "Sigmund Freud", src: "“The Dynamics of Transference” (1912)" },
  { t: "Vivid memories of trivial childhood moments can be screens for something more significant nearby. What you remember clearly isn’t always what mattered. Look just outside the frame.",
    who: "Sigmund Freud", src: "“Screen Memories” (1899)" },
  { t: "Children fantasise that they were born to grander parents. It’s a way of coping with discovering their real parents are ordinary. Most of us eventually have to forgive them for it.",
    who: "Sigmund Freud", src: "“Family Romances” (1909)" },
  { t: "A grieving person’s harshest self-reproaches often fit someone else: the one who was lost.",
    who: "Sigmund Freud", src: "Melancholic self-reproach — “Mourning and Melancholia” (1917)" },
  { t: "Something isn’t worth less because it doesn’t last. If anything, it’s worth more. That a thing will end is a reason to enjoy it now.",
    who: "Sigmund Freud", src: "“On Transience” (1916)" },
  { t: "Repression keeps something away from consciousness, but it doesn’t stay away. It comes back, usually in disguise. What you refuse to think about will find another way in.",
    who: "Sigmund Freud", src: "The return of the repressed — “Repression” (1915)" },
  { t: "At bottom, nobody believes in their own death. That’s why so much gets left for ‘one day’.",
    who: "Sigmund Freud", src: "“Thoughts for the Times on War and Death” (1915)" },
  { t: "Private rituals and religious ones work the same way: repetition soothes anxiety.",
    who: "Sigmund Freud", src: "“Obsessive Actions and Religious Practices” (1907)" },
  { t: "Talking is a cure. Saying something out loud, in detail, to someone who listens changes it.",
    who: "Sigmund Freud", src: "The talking cure — Studies on Hysteria (1895, with Josef Breuer)" },
  { t: "The realistic aim is to turn misery into common unhappiness. Ordinary unhappiness is something you can live with.",
    who: "Sigmund Freud", src: "Common unhappiness — Studies on Hysteria (1895, with Josef Breuer)" },
  { t: "The mind can know something and refuse to know it at the same time. If a thought keeps slipping away from you, it may be one you’re not ready to know yet.",
    who: "Sigmund Freud", src: "“Splitting of the Ego in the Process of Defence” (1940)" },
  { t: "We forbid most strictly what we’re most tempted by.",
    who: "Sigmund Freud", src: "Totem and Taboo (1913)" },
  { t: "A single shameful fantasy can disguise several different wishes. Don’t just try to get rid of it, be curious about what job it’s doing for you.",
    who: "Sigmund Freud", src: "“A Child Is Being Beaten” (1919)" },
  { t: "The unconscious doesn’t keep time. Old experiences aren’t worn down by the years, which is why an old hurt can feel brand new.",
    who: "Sigmund Freud", src: "Timelessness — “The Unconscious” (1915)" },
  { t: "Even a loving mother has reasons to hate her baby, and admitting the hate makes the love more honest. Any close relationship holds both.",
    who: "D. W. Winnicott", src: "“Hate in the Counter-Transference” (1949)" },
  { t: "Sentimentality is no use to children, because it denies the hate that’s also there. Love that can admit anger is more trustworthy.",
    who: "D. W. Winnicott", src: "Sentimentality — “Hate in the Counter-Transference” (1949)" },
  { t: "A child’s first blanket or bear is a remarkable thing: not quite part of the child, not quite part of the world, but a bridge between the two. It lets the child bear being apart from the one they love. In time it isn’t lost so much as spread out, into play, art and everything we come to cherish.",
    who: "D. W. Winnicott", src: "“Transitional Objects and Transitional Phenomena” (1953)" },
  { t: "Never ask a child whether they made up their blanket’s magic or found it. Some things are allowed to be both.",
    who: "D. W. Winnicott", src: "The paradox of the transitional object — Playing and Reality (1971)" },
  { t: "People become fully real to us only after we’ve attacked them in our minds and they’ve survived without retaliating.",
    who: "D. W. Winnicott", src: "“The Use of an Object” (1969)" },
  { t: "‘Hullo object! I destroyed you. I love you.’ Love needs the other person to survive our worst feelings.",
    who: "D. W. Winnicott", src: "“The Use of an Object” (1969)" },
  { t: "The breakdown you dread may already have happened, early, before you could take it in. Ask whether your fear is pointing backward rather than forward.",
    who: "D. W. Winnicott", src: "“Fear of Breakdown” (1974)" },
  { t: "When a baby looks into its mother’s face, what it ordinarily sees is itself, because how she looks is shaped by what she sees. Long before any mirror, we find ourselves in the faces that truly look at us.",
    who: "D. W. Winnicott", src: "“Mirror-role of Mother and Family in Child Development” (1967)" },
  { t: "Concern is guilt that can do something, through repair, instead of mere suffering. When you feel guilty, ask what repair would look like.",
    who: "D. W. Winnicott", src: "“The Development of the Capacity for Concern” (1963)" },
  { t: "It’s a joy to be hidden, and a disaster not to be found.",
    who: "D. W. Winnicott", src: "“Communicating and Not Communicating” (1963)" },
  { t: "A child who steals or destroys may be trying to reclaim something good that was lost. It’s an act of hope.",
    who: "D. W. Winnicott", src: "“The Antisocial Tendency” (1956)" },
  { t: "New parents go into a near-illness of absorption in their baby, and it’s healthy.",
    who: "D. W. Winnicott", src: "“Primary Maternal Preoccupation” (1956)" },
  { t: "Holding means a setting reliable enough that someone can fall apart and come back together.",
    who: "D. W. Winnicott", src: "Holding — “The Theory of the Parent–Infant Relationship” (1960)" },
  { t: "There’s no such thing as a baby, only a baby and someone caring for it.",
    who: "D. W. Winnicott", src: "“There is no such thing as a baby” — “Anxiety Associated with Insecurity” (1952)" },
  { t: "Aggression starts as plain aliveness: how a baby discovers that the world is out there and pushes back. It’s how you learn where you end and others begin.",
    who: "D. W. Winnicott", src: "“Aggression in Relation to Emotional Development” (1950)" },
  { t: "Art, music, and play live in the same in-between space as a child’s teddy bear (or Frosty!), neither purely inside nor out.",
    who: "D. W. Winnicott", src: "“The Location of Cultural Experience” (1967)" },
  { t: "Living creatively means feeling that life is yours rather than something you comply with. It needs no talent.",
    who: "D. W. Winnicott", src: "“Living Creatively” (1970)" },
  { t: "Health is harder to deal with than illness. Illness comes with explanations. Health just leaves you with your life. If you’re doing better, expect it to feel strange for a while.",
    who: "D. W. Winnicott", src: "“The Concept of a Healthy Individual” (1967)" },
  { t: "One person draws a squiggle, the other turns it into something, then they swap. Understanding and relating is often a matter of finishing each other’s lines.",
    who: "D. W. Winnicott", src: "The squiggle game — Therapeutic Consultations in Child Psychiatry (1971)" },
  { t: "Going loose and formless for a while isn’t the same as falling apart. With someone reliable nearby, it’s one of the deepest kinds of rest.",
    who: "D. W. Winnicott", src: "Unintegration — “Ego Integration in Child Development” (1962)" },
  { t: "A good environment doesn’t make anyone grow. It allows the growth that’s already trying to happen.",
    who: "D. W. Winnicott", src: "The holding environment — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "When the world intrudes before a child is ready, the child learns to react instead of simply be.",
    who: "D. W. Winnicott", src: "Impingement — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "Beneath everything a baby needs is the simple, unbroken feeling of existing from one moment to the next: going on being. Interrupt it too often and a person learns to survive rather than live.",
    who: "D. W. Winnicott", src: "Going-on-being — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "The urge to repair what we feel we’ve damaged is one of the deepest sources of love.",
    who: "Melanie Klein", src: "Love, Guilt and Reparation (1937)" },
  { t: "When we feel threatened, the mind splits the world in two: whatever frightens us becomes a persecutor, whatever comforts us becomes ideal. Everyone goes there sometimes. Recognising you’re there is the first step out.",
    who: "Melanie Klein", src: "The paranoid-schizoid position — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "When a feeling is too painful to own, we can lodge it in someone else and then treat it as theirs. Often they even start to feel it.",
    who: "Melanie Klein", src: "Projective identification — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Triumph, contempt, frantic busyness — anything but grief. It looks like coping, but it only postpones the mourning.",
    who: "Melanie Klein", src: "The manic defence — “A Contribution to the Psychogenesis of Manic-Depressive States” (1935)" },
  { t: "Greed wants everything, whatever the source can give. Gratitude is satisfied by what is given.",
    who: "Melanie Klein", src: "Greed — Envy and Gratitude (1957)" },
  { t: "A certain loneliness persists however loved you are: a longing to be understood completely, which words can’t fully satisfy.",
    who: "Melanie Klein", src: "“On the Sense of Loneliness” (1963)" },
  { t: "Adult relationships, institutions and quarrels carry the marks of infancy’s earliest fears. When an office row feels oddly primal, it probably is.",
    who: "Melanie Klein", src: "“Our Adult World and Its Roots in Infancy” (1959)" },
  { t: "Children say with toys what they can’t yet put into words. Adults do it with hobbies and habits. Pay attention to what you do when nobody’s asking anything of you.",
    who: "Melanie Klein", src: "“The Psycho-Analytic Play Technique” (1955)" },
  { t: "You can identify with someone so completely that you lose track of where you end and they begin. Closeness and confusion feel similar. Notice whose feelings you’re carrying.",
    who: "Melanie Klein", src: "“On Identification” (1955)" },
  { t: "Guilt arises when you realise you’ve attacked, in your mind, someone you love. It’s painful, but it’s the beginning of concern. Let it lead you to repair, not just self-punishment.",
    who: "Melanie Klein", src: "Depressive guilt — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "We carry inner versions of the people who mattered, and they go on shaping how we feel long after the real people have gone. It’s worth knowing who you’re still living with.",
    who: "Melanie Klein", src: "Internal objects — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "Idealising someone keeps them wholly good, safe from your own hostility. The fall, when it comes, is proportionate. Admire people without building a pedestal you’ll later kick.",
    who: "Melanie Klein", src: "Idealisation — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "The wish to create often grows from the wish to restore what we fear we’ve damaged. If you feel guilty and stuck, making something can be a form of repair.",
    who: "Melanie Klein", src: "Reparation and creativity — “Infantile Anxiety Situations Reflected in a Work of Art” (1929)" },
  { t: "Every new grief reawakens the oldest ones. A small loss can bring a surprisingly large sorrow. If you’re crying harder than the occasion warrants, it isn’t only about the occasion.",
    who: "Melanie Klein", src: "Revived losses — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "Curiosity and fear grow up together. The urge to know is tangled with anxiety about what you’ll find. If you’re avoiding finding something out, the fear may be what’s in the way.",
    who: "Melanie Klein", src: "The epistemophilic impulse — “Early Stages of the Oedipus Conflict” (1928)" },
  { t: "Unconscious phantasy runs beneath all experience, like background music. You never stop having it, you just stop hearing it. Your strongest reactions are the best way to tune in.",
    who: "Melanie Klein", src: "Unconscious phantasy — “The Psycho-Analytic Play Technique” (1955)" },
  { t: "The only thing you can really be guilty of is giving ground on your desire. That doesn’t mean do whatever you like. It means don’t betray what you actually want.",
    who: "Jacques Lacan", src: "Not giving ground on desire — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "There’s no perfect fit between two people. Love is what makes up for it. Stop waiting for the fit and look at the love.",
    who: "Jacques Lacan", src: "“There is no sexual relationship” — Seminar XX: Encore (1972–73)" },
  { t: "Anxiety is the one feeling that doesn’t deceive. When everything else is telling you it’s fine and anxiety isn’t, take anxiety seriously.",
    who: "Jacques Lacan", src: "Seminar X: Anxiety (1962–63)" },
  { t: "Anxiety comes not when something’s missing but when nothing is: when the other is too close and wants too much. If you feel smothered, you may need distance, not reassurance.",
    who: "Jacques Lacan", src: "Seminar X: Anxiety (1962–63)" },
  { t: "Love is giving what you don’t have: offering your own lack, not your possessions. Presents are easier. Admitting what you need from someone is the real gift.",
    who: "Jacques Lacan", src: "Love as giving what you don’t have — Seminar VIII: Transference (1960–61)" },
  { t: "A letter always arrives at its destination. What’s been sent will be received, even if it takes the long way round. What you’re avoiding will reach you eventually. Better to open it.",
    who: "Jacques Lacan", src: "“Seminar on ‘The Purloined Letter’” (1956)" },
  { t: "What makes something desirable is never quite in the thing itself. That’s why getting what you wanted can feel strangely empty. Sometimes the wanting was the point.",
    who: "Jacques Lacan", src: "Objet petit a — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "The unconscious is the discourse of the Other: we speak with words and wishes we inherited. When your parents’ phrases come out of your mouth, that’s what you’re hearing.",
    who: "Jacques Lacan", src: "“The Function and Field of Speech and Language in Psychoanalysis” (1953)" },
  { t: "I think where I am not, and I am where I do not think. The truth about you isn’t in your self-description. It shows up in what you didn’t mean to say.",
    who: "Jacques Lacan", src: "“The Instance of the Letter in the Unconscious” (1957)" },
  { t: "We compete with others as images of ourselves. The rival is often a mirror. Ask what you see of yourself in the person you’re competing with.",
    who: "Jacques Lacan", src: "Imaginary rivalry — Seminar II: The Ego in Freud’s Theory (1954–55)" },
  { t: "There’s no final authority guaranteeing the rules. Everyone is improvising more than they let on. That’s a good reason to trust your own judgement a little more.",
    who: "Jacques Lacan", src: "The Other has no Other — “The Subversion of the Subject and the Dialectic of Desire” (1960)" },
  { t: "A symptom is a message addressed to someone, in a language you don’t yet understand. It keeps coming back until it’s read. Ask what yours might be trying to say, and to whom.",
    who: "Jacques Lacan", src: "The symptom as message — “The Function and Field of Speech and Language in Psychoanalysis” (1953)" },
  { t: "Some enjoyment goes past pleasure into pain, and still we keep going back to it. Not everything you repeat is because you like it. Notice the habits that hurt and still pull.",
    who: "Jacques Lacan", src: "Jouissance — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "The gaze isn’t your looking. It’s the feeling of being looked at from somewhere you can’t see. If you feel watched in an empty room, the watcher is usually inside you.",
    who: "Jacques Lacan", src: "The gaze — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "Every life needs some law and limit to hold its meanings in place. Limits aren’t only restrictions. Without some, nothing stays meaningful for long.",
    who: "Jacques Lacan", src: "The Name-of-the-Father — Seminar III: The Psychoses (1955–56)" },
  { t: "Repetition is a missed appointment with something real: we keep returning to the place where something happened that we couldn’t take in. If you keep circling one spot, go and look at it.",
    who: "Jacques Lacan", src: "Repetition and the missed encounter — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "We trust experts because we suppose they know. Often that supposition is what does the work. Some of the knowledge you’re waiting for may already be yours.",
    who: "Jacques Lacan", src: "The subject supposed to know — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "At the centre of desire is a lost Thing we circle and never quite reach. Desire keeps its distance from what it wants. Don’t be surprised when getting closer makes you want to back away.",
    who: "Jacques Lacan", src: "Das Ding — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "Everyone has a particular knot that holds them together, a symptom that has become a way of living. The aim isn’t always to undo it. It’s to learn how to use it well.",
    who: "Jacques Lacan", src: "The sinthome — Seminar XXIII: The Sinthome (1975–76)" },
  { t: "The persona is a compromise between you and society about how you should appear. It’s useful. It isn’t you. Remember to take it off when you get home.",
    who: "Carl Jung", src: "The persona — “The Relations between the Ego and the Unconscious” (1928)" },
  { t: "Introverts draw energy from inner experience, extraverts from the outer world. Neither is a flaw, and each tends to undervalue the other. Know which you are before you plan your weekend.",
    who: "Carl Jung", src: "Psychological Types (1921)" },
  { t: "You can’t live the afternoon of life by the programme of the morning. What was true in the morning may be a lie by evening. Whatever your age, check which part of the day you’re in.",
    who: "Carl Jung", src: "“The Stages of Life” (1930)" },
  { t: "In a crisis, playing like a child can bring you back to yourself. Building, drawing, making things with your hands isn’t regression. Sometimes it’s how you find your way back.",
    who: "Carl Jung", src: "Memories, Dreams, Reflections (1962)" },
  { t: "Meaningful coincidences happen, whatever they mean about the world. Take them as psychological events: notice what they make you think of. That’s where their meaning is.",
    who: "Carl Jung", src: "“Synchronicity: An Acausal Connecting Principle” (1952)" },
  { t: "When two parts of you disagree, don’t force a winner. Hold the tension long enough and a third option tends to appear. Patience is a way of thinking.",
    who: "Carl Jung", src: "“The Transcendent Function” (1916)" },
  { t: "We all live out old patterns: the hero, the mother, the trickster, the wise fool. You’re living an old story in your own way. Notice which role you’ve been cast in lately.",
    who: "Carl Jung", src: "Archetypes — The Archetypes and the Collective Unconscious (1959)" },
  { t: "The child within stands for possibility, what isn’t yet formed in you. It’s also vulnerable and easily abandoned. Give your unfinished ideas a little protection.",
    who: "Carl Jung", src: "“The Psychology of the Child Archetype” (1940)" },
  { t: "The person you fall for often carries a part of yourself you haven’t yet lived. Projection is how we first meet what we haven’t integrated. Ask what you admire in them that you could develop in you.",
    who: "Carl Jung", src: "Anima and animus — Aion (1951)" },
  { t: "Becoming who you are doesn’t mean becoming perfect. It means becoming whole, which includes the parts you’d rather leave out. Mostly those parts.",
    who: "Carl Jung", src: "Individuation — Two Essays on Analytical Psychology (1928)" },
  { t: "After midlife, many problems are at root questions of meaning. Not every suffering is a symptom. Some is a question. Ask what your life is for, not only what’s wrong with it.",
    who: "Carl Jung", src: "Modern Man in Search of a Soul (1933)" },
  { t: "People dissolve into mass movements to avoid knowing themselves. The only real resistance is self-knowledge. Before you take a side, take a look inward.",
    who: "Carl Jung", src: "The Undiscovered Self (1957)" },
  { t: "You don’t become enlightened by imagining figures of light, but by making the darkness conscious. It’s less pleasant, which is why it’s less popular. Do it anyway.",
    who: "Carl Jung", src: "Making the darkness conscious — “The Philosophical Tree” (1945)" },
  { t: "Everyone knows people have complexes. Less well known is that complexes can have us. When you react far too strongly, it may be a complex doing the talking.",
    who: "Carl Jung", src: "“A Review of the Complex Theory” (1934)" },
  { t: "A dream is a self-portrait of where you actually are, not where you’d like to be. Don’t argue with it. It isn’t trying to flatter you.",
    who: "Carl Jung", src: "“On the Nature of Dreams” (1945)" },
  { t: "Only the wounded physician heals. Your own wounds are part of what lets you understand other people’s. Don’t hide every scar. Some are qualifications.",
    who: "Carl Jung", src: "The wounded healer — “Fundamental Questions of Psychotherapy” (1951)" },
  { t: "The mind can attack its own connections so as not to know something painful. If you can’t think straight about one particular person or subject, that’s information.",
    who: "Wilfred Bion", src: "“Attacks on Linking” (1959)" },
  { t: "Groups often behave as if they’ve met to depend on a leader, to fight an enemy, or to pair off in hope of a saviour. Next meeting, ask which one this is.",
    who: "Wilfred Bion", src: "Basic assumptions — Experiences in Groups (1961)" },
  { t: "Groups expect their leader to meet every need, then turn on the leader for failing. If you’re leading, expect it. If you’re following, notice when you’re doing it.",
    who: "Wilfred Bion", src: "Dependency groups — Experiences in Groups (1961)" },
  { t: "Thoughts come first, and thinking develops to cope with them. Some thoughts are waiting for a mind ready to hold them. If something can’t be thought yet, it may need time, not force.",
    who: "Wilfred Bion", src: "“A Theory of Thinking” (1962)" },
  { t: "Be capable of uncertainty and doubt without irritably reaching for facts and reasons. Not knowing is part of finding out. Leave the question open a little longer.",
    who: "Wilfred Bion", src: "Negative capability — Attention and Interpretation (1970)" },
  { t: "There’s a wish to know and an equally strong wish not to know. Both are at work in most of us, especially about ourselves. Notice which one is winning.",
    who: "Wilfred Bion", src: "K and minus K — Learning from Experience (1962)" },
  { t: "The deepest reality can’t be known, only lived. Some things you can’t understand from outside. You have to be in them.",
    who: "Wilfred Bion", src: "O — Transformations (1965)" },
  { t: "Raw feelings that can’t be thought get pushed out, usually into whoever is nearby. If you’re unloading on someone, it may be a feeling you haven’t found words for yet.",
    who: "Wilfred Bion", src: "Beta elements — Learning from Experience (1962)" },
  { t: "Dreaming is how the mind digests experience into something it can think and remember. Bad sleep is bad digestion. Protect your rest. It does real work.",
    who: "Wilfred Bion", src: "Alpha function — Learning from Experience (1962)" },
  { t: "Not every thought in your head is at the same stage. Some are raw, some are half-formed, some are ready to use. Don’t treat a raw thought as a conclusion.",
    who: "Wilfred Bion", src: "The Grid — Elements of Psycho-Analysis (1963)" },
  { t: "Much suffering comes from a self that never got what it needed to feel whole. That’s why a small slight can feel like structural damage. Be gentle with those cracks, yours and others’.",
    who: "Heinz Kohut", src: "The Restoration of the Self (1977)" },
  { t: "Rage out of proportion to the insult means a deeper wound has been touched. The slight was small. The bruise it landed on wasn’t. Look for the bruise.",
    who: "Heinz Kohut", src: "“Thoughts on Narcissism and Narcissistic Rage” (1972)" },
  { t: "Everyone needs someone calm and strong to look up to and borrow strength from. Admiring someone isn’t weakness. Just pick people who can bear being looked up to.",
    who: "Heinz Kohut", src: "The idealising transference — The Analysis of the Self (1971)" },
  { t: "We need to feel essentially alike with someone. Belonging begins with recognising your own kind. If you feel alien, look for even one person who shares something with you.",
    who: "Heinz Kohut", src: "Twinship — How Does Analysis Cure? (1984)" },
  { t: "Empathy is vicarious introspection: thinking and feeling your way into someone else’s experience. It’s a way of understanding, not agreeing. You can understand perfectly and still say no.",
    who: "Heinz Kohut", src: "“Introspection, Empathy, and Psychoanalysis” (1959)" },
  { t: "Small, bearable disappointments help a self build strength of its own. Too little frustration and we never learn. Too much and we break. Aim for the middle, with children and with yourself.",
    who: "Heinz Kohut", src: "Optimal frustration — The Analysis of the Self (1971)" },
  { t: "Childhood grandiosity is healthy if it grows up into ambition and self-respect. It becomes a problem only when it was never met, and so never outgrown. Let your ambition mature, not disappear.",
    who: "Heinz Kohut", src: "The grandiose self — The Analysis of the Self (1971)" },
  { t: "Some people suffer from guilt over forbidden wishes. More, these days, suffer from a self that can’t fulfil its aims. Ask which kind of unhappiness is yours. They need different remedies.",
    who: "Heinz Kohut", src: "Tragic Man — The Restoration of the Self (1977)" },
  { t: "Under anxiety we move towards people, against them or away from them. Each has its place. Trouble starts when only one move is available. Practise the one you use least.",
    who: "Karen Horney", src: "Moving toward, against and away — Our Inner Conflicts (1945)" },
  { t: "We build an idealised image of ourselves and then hate the real self for not matching it. The real self is the one that has to live your life. Side with it.",
    who: "Karen Horney", src: "The idealised self — Neurosis and Human Growth (1950)" },
  { t: "The search for glory never arrives, because the ideal is always just out of reach. Notice when ambition has turned into a treadmill.",
    who: "Karen Horney", src: "The search for glory — Neurosis and Human Growth (1950)" },
  { t: "We make unspoken claims on the world: to be treated as special, spared difficulty, given to without asking. The world doesn’t know about the claims. Saying what you want works better.",
    who: "Karen Horney", src: "Neurotic claims — Neurosis and Human Growth (1950)" },
  { t: "Basic anxiety is feeling isolated and helpless in a potentially hostile world. It starts in childhood and colours how adult life looks. The world is mostly not hostile. It’s mostly busy.",
    who: "Karen Horney", src: "Basic anxiety — The Neurotic Personality of Our Time (1937)" },
  { t: "You can analyse yourself, with honesty and persistence. It’s hard, and it requires being willing to be surprised by what you find. Start by noticing what you avoid.",
    who: "Karen Horney", src: "Self-Analysis (1942)" },
  { t: "Envy runs in more than one direction. Men may envy women’s capacity to bear life, and compensate in other ways. When someone belittles a thing, ask whether they envy it.",
    who: "Karen Horney", src: "Womb envy — “The Flight from Womanhood” (1926)" },
  { t: "The real self is a force for growth that emerges when anxiety stops getting in the way. It doesn’t need to be invented. It needs room. Make some.",
    who: "Karen Horney", src: "The real self — Neurosis and Human Growth (1950)" },
  { t: "We experience inner conflicts as if they were happening outside us, which makes other people look like the problem. Before blaming the world, check the inside first.",
    who: "Karen Horney", src: "Externalisation — Our Inner Conflicts (1945)" },
  { t: "A need to be loved by everyone can never be satisfied, because it’s driven by anxiety rather than desire. More affection won’t fix it. Less anxiety will.",
    who: "Karen Horney", src: "The neurotic need for affection — The Neurotic Personality of Our Time (1937)" },
  { t: "There’s a having mode, relating to the world by owning, and a being mode, relating by experiencing. Most of us live in the first. Try spending an hour in the second.",
    who: "Erich Fromm", src: "To Have or to Be? (1976)" },
  { t: "If I am what I have, and I lose what I have, who am I? Build your sense of self on something that can’t be repossessed.",
    who: "Erich Fromm", src: "To Have or to Be? (1976)" },
  { t: "Treating yourself as a product means your worth rises and falls with demand. You are not a commodity. Value yourself on something other than how well you sell.",
    who: "Erich Fromm", src: "The marketing orientation — Man for Himself (1947)" },
  { t: "A whole society can be unwell while everyone in it seems normal. Adjusting to an unhealthy way of life isn’t health. If everyone around you is exhausted, don’t assume exhaustion is normal.",
    who: "Erich Fromm", src: "The Sane Society (1955)" },
  { t: "Giving is the highest expression of strength. In giving, we feel our own aliveness. It isn’t a loss. Give something today and notice how it feels.",
    who: "Erich Fromm", src: "Giving — The Art of Loving (1956)" },
  { t: "Selfish people don’t love themselves too much. They love themselves too little. Real self-love and love of others go together, so caring for yourself isn’t selfish.",
    who: "Erich Fromm", src: "Self-love — The Art of Loving (1956)" },
  { t: "Love is a standing in, not a falling for. Falling is easy. Standing takes practice. Put the effort in after the falling stops.",
    who: "Erich Fromm", src: "Falling in love versus standing in love — The Art of Loving (1956)" },
  { t: "Love, like any art, needs discipline, concentration, patience and real concern. Those are also the things distraction erodes. Protect your attention for the people you love.",
    who: "Erich Fromm", src: "Discipline, concentration, patience — The Art of Loving (1956)" },
  { t: "Some destructiveness comes from chronic boredom, an inner deadness looking for stimulation. The cure isn’t excitement. It’s finding something that makes you feel alive.",
    who: "Erich Fromm", src: "Boredom and destructiveness — The Anatomy of Human Destructiveness (1973)" },
  { t: "Some people are drawn to life and growth, others to control and tidiness. Love of life is a choice you can lean towards. Tend something that grows.",
    who: "Erich Fromm", src: "Biophilia — The Heart of Man (1964)" },
  { t: "We can think, feel and want what we’re expected to, and experience it all as our own. Check the last opinion you were absolutely sure of. Where did it come from?",
    who: "Erich Fromm", src: "Automaton conformity — Escape from Freedom (1941)" },
  { t: "Some people want both to submit to authority and to be the authority others submit to. It’s an anxious arrangement. Notice when you’re bowing up and kicking down.",
    who: "Erich Fromm", src: "The authoritarian character — Escape from Freedom (1941)" },
  { t: "The first question of life is whether the world can be trusted. It’s settled in infancy and tested again and again. Where trust has been earned, let yourself rely on it.",
    who: "Erik Erikson", src: "Trust vs. mistrust — Childhood and Society (1950)" },
  { t: "Being shamed for trying to do things yourself leaves doubt behind for a long time. Let children, and yourself, try things clumsily.",
    who: "Erik Erikson", src: "Autonomy vs. shame — Childhood and Society (1950)" },
  { t: "Guilt can make starting things feel like trespassing. If you never begin anything, ask whether you were once made to feel wrong for trying. You’re allowed to start.",
    who: "Erik Erikson", src: "Initiative vs. guilt — Childhood and Society (1950)" },
  { t: "Childhood teaches us whether our efforts can produce something worthwhile. Many adults are still waiting for the verdict. Give yourself the mark.",
    who: "Erik Erikson", src: "Industry vs. inferiority — Childhood and Society (1950)" },
  { t: "Working out who you are is supposed to involve a crisis. It’s normal, even necessary. Being confused about your identity means you’re doing the work.",
    who: "Erik Erikson", src: "The identity crisis — Identity: Youth and Crisis (1968)" },
  { t: "Young people need time to experiment before committing to roles. Being undecided can be a legitimate stage, not a failure. Adults need some of this too.",
    who: "Erik Erikson", src: "The psychosocial moratorium — Identity: Youth and Crisis (1968)" },
  { t: "Real intimacy needs a self secure enough not to fear being lost in someone else. If closeness feels like drowning, work on the self first.",
    who: "Erik Erikson", src: "Intimacy vs. isolation — Childhood and Society (1950)" },
  { t: "In middle life the question is whether you’re caring for something that will outlast you: children, work, a community. The alternative is stagnation. Find something to tend.",
    who: "Erik Erikson", src: "Generativity vs. stagnation — The Life Cycle Completed (1982)" },
  { t: "The last task is accepting your one and only life as the one it had to be. Its virtue is wisdom. Start practising acceptance before you need it most.",
    who: "Erik Erikson", src: "Integrity vs. despair — The Life Cycle Completed (1982)" },
  { t: "You can admire someone deeply and still tell them honestly where they’ve failed. Admiration and honesty aren’t opposites. The best respect includes both.",
    who: "Erik Erikson", src: "Gandhi’s Truth (1969)" },
  { t: "Each stage of life is meant to leave a virtue behind: hope, will, purpose, competence, fidelity, love, care, wisdom. Each is earned, not given. Notice which ones you’ve already earned.",
    who: "Erik Erikson", src: "The basic virtues — Insight and Responsibility (1964)" },
  { t: "Some people give up their own wishes and satisfy them through others. It looks generous. It can also be a way of not having to want. Let yourself want something directly.",
    who: "Anna Freud", src: "Altruistic surrender — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Turning feelings into abstract argument keeps them at a safe distance. It sounds like thinking. Sometimes it’s hiding. Say what you feel, not just what you think.",
    who: "Anna Freud", src: "Intellectualisation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "A sudden, severe renunciation of pleasure can be a defence against urges that feel too big. Extreme discipline isn’t always strength. Sometimes it’s fear.",
    who: "Anna Freud", src: "Adolescent asceticism — The Ego and the Mechanisms of Defence (1936)" },
  { t: "An unacceptable feeling can be turned into its opposite: hostility becomes excessive kindness. The exaggeration usually gives it away. Notice when your niceness is overdone.",
    who: "Anna Freud", src: "Reaction formation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Feelings get redirected from their real target to a safer one. The safer target rarely deserves it. Before snapping at someone, ask who you’re actually angry with.",
    who: "Anna Freud", src: "Displacement — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Anger that can’t safely go outwards turns inwards. Self-criticism is sometimes anger with nowhere else to go. Ask who you’d be cross with if you were allowed.",
    who: "Anna Freud", src: "Turning against the self — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Children develop unevenly, ahead in one area and behind in another. Adults do too. Being uneven is normal. Straight lines are suspicious.",
    who: "Anna Freud", src: "Developmental lines — Normality and Pathology in Childhood (1965)" },
  { t: "The healthiest defence turns a difficult urge into something valued. Aggression becomes sport, restlessness becomes work. Find a useful home for what you can’t get rid of.",
    who: "Anna Freud", src: "Sublimation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Children reverse painful facts in fantasy, becoming the strong one in their games. Adults have more sophisticated versions. Check which of your plans are really fantasies of reversal.",
    who: "Anna Freud", src: "Denial in fantasy — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Children separated from those they love go through protest, then despair, then detachment. Detachment looks like recovery but isn’t. If you’ve stopped caring, check whether you’ve only stopped hoping.",
    who: "John Bowlby", src: "Protest, despair, detachment — Attachment and Loss, Vol. 2: Separation (1973)" },
  { t: "Grief includes an urge to search for the person you’ve lost. It isn’t irrational. It’s attachment doing its job. Seeing them in a crowd is love, arriving late.",
    who: "John Bowlby", src: "Searching — Attachment and Loss, Vol. 3: Loss (1980)" },
  { t: "We carry early models of how people will treat us, and they shape every later relationship. They can be revised, but by new experience, not argument. Let someone surprise you.",
    who: "John Bowlby", src: "Internal working models — Attachment and Loss, Vol. 2: Separation (1973)" },
  { t: "A secure base is somewhere to explore from and come back to. Security is what makes independence possible. Be someone’s base. Let someone be yours.",
    who: "John Bowlby", src: "A Secure Base (1988)" },
  { t: "Some children steal after early, prolonged separation from those who cared for them. Taking can be a way of searching. When someone takes too much, ask what they’ve lost.",
    who: "John Bowlby", src: "“Forty-Four Juvenile Thieves” (1944)" },
  { t: "Love in early childhood matters to mental health as much as vitamins do to the body. That seems obvious now. It wasn’t always. Don’t underrate warmth.",
    who: "John Bowlby", src: "Maternal Care and Mental Health (1951)" },
  { t: "Some people insist on doing everything alone because needing others once hurt too much. It’s self-sufficiency as armour. You’re allowed to put it down sometimes.",
    who: "John Bowlby", src: "Compulsive self-reliance — Attachment and Loss, Vol. 3: Loss (1980)" },
  { t: "Securely attached toddlers are upset when a parent leaves and comforted when they return. Distress isn’t the problem. Being unable to be comforted is. Let yourself be comforted.",
    who: "Mary Ainsworth", src: "Secure attachment — Patterns of Attachment (1978)" },
  { t: "Some toddlers seem unbothered when their parent leaves, yet their bodies are stressed all the same. Looking fine and being fine are different. Check which one you’re doing.",
    who: "Mary Ainsworth", src: "Avoidant attachment — Patterns of Attachment (1978)" },
  { t: "Some toddlers cling and push away at once, hard to soothe. Inconsistent care teaches inconsistent hope. If you seek closeness and resist it, you learned that somewhere. You can unlearn it.",
    who: "Mary Ainsworth", src: "Ambivalent attachment — Patterns of Attachment (1978)" },
  { t: "A child would rather believe they’re bad than that their parents are. Better a sinner in a world ruled by God than live in one ruled by the Devil. If you always assume it’s your fault, ask why that was safer.",
    who: "W. R. D. Fairbairn", src: "The moral defence — Psychoanalytic Studies of the Personality (1952)" },
  { t: "What we’re after, at bottom, isn’t pleasure but people. Libido seeks relationship. If you feel empty despite having everything, look at your connections.",
    who: "W. R. D. Fairbairn", src: "Libido is object-seeking — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Someone thrilling and unavailable stirs a longing that can feel like love. Often the thrill is the unavailability. Ask whether you love the person or the longing.",
    who: "W. R. D. Fairbairn", src: "The exciting object — Psychoanalytic Studies of the Personality (1952)" },
  { t: "There’s a part of us that attacks our own needs and sides with whoever rejected them. It passes itself off as good sense. Notice when ‘being realistic’ is really self-sabotage.",
    who: "W. R. D. Fairbairn", src: "The internal saboteur — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Some people keep their love hidden because they fear it destroys. They seem cold, but they’re protecting others. If someone seems distant, they may be guarding something.",
    who: "W. R. D. Fairbairn", src: "“Schizoid Factors in the Personality” (1940)" },
  { t: "Development moves from infantile dependence to mature dependence, not to independence. Needing others never stops. How you need them can grow up.",
    who: "W. R. D. Fairbairn", src: "Mature dependence — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Tact is the capacity to feel with someone. Knowing when to say something matters as much as what to say. Before you say the true thing, check whether it’s the right moment.",
    who: "Sándor Ferenczi", src: "Tact — “The Elasticity of Psycho-Analytic Technique” (1928)" },
  { t: "Professional calm can repeat the coldness that did harm in the first place. Detachment isn’t always neutral. Sometimes warmth is the honest response.",
    who: "Sándor Ferenczi", src: "The Clinical Diary (1932)" },
  { t: "Children who sense they weren’t wanted can lose some of their will to live. If you’ve always felt in the way, that feeling has a history. It isn’t a verdict on you.",
    who: "Sándor Ferenczi", src: "“The Unwelcome Child and His Death-Instinct” (1929)" },
  { t: "There’s an old longing in all of us to return to somewhere warm and wordless, the womb, even the sea. It explains a lot about baths. Let yourself rest in it sometimes.",
    who: "Sándor Ferenczi", src: "Thalassa: A Theory of Genitality (1924)" },
  { t: "Children speak the language of tenderness. Harm follows when adults answer in the language of passion. With anyone vulnerable, make sure you’re speaking their language.",
    who: "Sándor Ferenczi", src: "Tenderness and passion — “Confusion of Tongues between Adults and the Child” (1933)" },
  { t: "The listener needs to be listened to as well. Even helpers have blind spots. If you’re everyone’s confidant, find someone to be yours.",
    who: "Sándor Ferenczi", src: "Mutual analysis — The Clinical Diary (1932)" },
  { t: "Children forced to grow up too soon become wise babies, looking after the adults who should have looked after them. If you were one, you’re allowed to be looked after now.",
    who: "Sándor Ferenczi", src: "The wise baby — “Confusion of Tongues between Adults and the Child” (1933)" },
  { t: "Some problems aren’t conflicts to resolve but something missing, a basic fault. Arguments won’t fix a lack. It needs to be met, slowly, by someone reliable.",
    who: "Michael Balint", src: "The Basic Fault (1968)" },
  { t: "Some people cling to objects and feel anxious in the open spaces between them. If you’re a clinger, know that the spaces are survivable. Practise small crossings.",
    who: "Michael Balint", src: "Ocnophils — Thrills and Regressions (1959)" },
  { t: "Some people love the open spaces and the thrill of leaving safety, sure they’ll get back. If that’s you, enjoy it. Just check you’re still coming back.",
    who: "Michael Balint", src: "Philobats — Thrills and Regressions (1959)" },
  { t: "The doctor is a drug: how they treat you affects you as much as what they prescribe. Friends work the same way. Choose people whose effect on you is good.",
    who: "Michael Balint", src: "The doctor as drug — The Doctor, His Patient and the Illness (1957)" },
  { t: "Our first carer transformed our whole world, and we go on searching for things that will transform us again: lovers, holidays, new kitchens. It’s the same search. Know what you’re really shopping for.",
    who: "Christopher Bollas", src: "The transformational object — The Shadow of the Object (1987)" },
  { t: "Some people are abnormally normal, all facts and objects, with no interest in inner life. It doesn’t look like illness. If you never feel anything complicated, that’s worth wondering about.",
    who: "Christopher Bollas", src: "Normotic illness — The Shadow of the Object (1987)" },
  { t: "Fate is being determined by circumstances. Destiny is using your life to express who you are. Everyone gets fate. Destiny takes effort. Make a few choices that are recognisably yours.",
    who: "Christopher Bollas", src: "Fate and destiny — Forces of Destiny (1989)" },
  { t: "We use the objects of the world, people, places, music, to express ourselves. Your choices of taste are a kind of self-expression. Choose things that say something true.",
    who: "Christopher Bollas", src: "Being a Character (1992)" },
  { t: "Some things evoke parts of you that you didn’t know were there: a song, a street, the smell of toast. Pay attention to what moves you. It’s a letter from yourself.",
    who: "Christopher Bollas", src: "Evocative objects — Being a Character (1992)" },
  { t: "Unconscious thinking breaks up ordinary experience into new connections, like a laugh does. Let your mind wander. That’s when it does some of its best work.",
    who: "Christopher Bollas", src: "Cracking Up (1995)" },
  { t: "Free association is the mind’s natural way of thinking. Its logic only shows itself over time. Not every thought needs to arrive in order. Let them come.",
    who: "Christopher Bollas", src: "The Mystery of Things (1999)" },
  { t: "Modern life discourages reflection, and some unhappiness may be the cost of never having time to think. Leave some space in your day with nothing in it.",
    who: "Christopher Bollas", src: "Meaning and Melancholia (2018)" },
  { t: "Some people take over others’ feelings or experiences as if they were their own, leaving the other strangely emptied. Notice who borrows your stories. Keep some for yourself.",
    who: "Christopher Bollas", src: "Extractive introjection — The Shadow of the Object (1987)" },
  { t: "Being loved as an object isn’t the same as being known as a person. We need to be recognised by someone we in turn recognise. Ask the people you love what it’s like to be them.",
    who: "Jessica Benjamin", src: "Like Subjects, Love Objects (1995)" },
  { t: "When an argument becomes ‘who’s doing what to whom’, look for a third space where you can both be heard. Nobody has to win for the relationship to.",
    who: "Jessica Benjamin", src: "The third — Beyond Doer and Done To (2018)" },
  { t: "Every relationship breaks and mends. What matters isn’t avoiding rupture but being able to repair it. Don’t fear the break. Get good at the mending.",
    who: "Jessica Benjamin", src: "Rupture and repair — Beyond Doer and Done To (2018)" },
  { t: "Repair starts with acknowledgment: saying clearly that harm was done and seeing its effect. ‘I hurt you and I see it’ does more than any apology that defends itself.",
    who: "Jessica Benjamin", src: "Acknowledgment — Beyond Doer and Done To (2018)" },
  { t: "Boredom is a state of suspended anticipation, a waiting for a desire you don’t have yet. Don’t fill it straight away. Something might turn up.",
    who: "Adam Phillips", src: "Boredom — On Kissing, Tickling, and Being Bored (1993)" },
  { t: "You can’t tickle yourself. Some pleasures need another person, and need you not to be in control. Let someone else in on the fun.",
    who: "Adam Phillips", src: "Tickling — On Kissing, Tickling, and Being Bored (1993)" },
  { t: "Nobody really knows what they’re doing with fidelity, desire and love. Everyone is improvising. Be a little kinder to your own improvisations.",
    who: "Adam Phillips", src: "Monogamy (1996)" },
  { t: "We have detailed descriptions of madness and very few of sanity. We may not know what we’re aiming for. Work out your own picture of being well.",
    who: "Adam Phillips", src: "Going Sane (2005)" },
  { t: "Kindness has become suspect, seen as weakness or naivety. It’s actually one of life’s great pleasures. Be kind anyway, and notice how it feels.",
    who: "Adam Phillips", src: "On Kindness (2009, with Barbara Taylor)" },
  { t: "Frustration is where you discover what you want. Rush to relieve it and you lose the information. Stay with it a moment and ask what it’s telling you.",
    who: "Adam Phillips", src: "Frustration — Missing Out: In Praise of the Unlived Life (2012)" },
  { t: "Balance is overrated. Some of what matters most, love among it, involves excess. Don’t moderate everything.",
    who: "Adam Phillips", src: "On Balance (2010)" },
  { t: "Be wary of anyone who knows exactly what you mean, including experts. Curiosity is more useful than certainty. Stay curious about yourself.",
    who: "Adam Phillips", src: "Terrors and Experts (1995)" },
  { t: "Accepting that everything ends, ourselves included, is what lets life matter. Transience isn’t the enemy of meaning. It’s the condition for it.",
    who: "Adam Phillips", src: "Darwin’s Worms (1999)" },
  { t: "We use promises and theories to manage what we can’t control. A promise is partly a hope dressed as a certainty. Make fewer, and keep them.",
    who: "Adam Phillips", src: "Promises, Promises (2000)" },
  { t: "We’re so fascinated by forbidden pleasures that we neglect the ones nobody stops us having. A walk, a nap, a long lunch. Enjoy something you’re allowed.",
    who: "Adam Phillips", src: "Unforbidden Pleasures (2015)" },
  { t: "Everyone wants attention, and what we attend to shapes who we become. Choose carefully where you put yours.",
    who: "Adam Phillips", src: "Attention Seeking (2019)" },
  { t: "Wanting to become someone else can be a way of not acknowledging who you already are. Before reinventing yourself, get to know the current version.",
    who: "Adam Phillips", src: "On Wanting to Change (2021)" },
  { t: "Getting better may mean becoming more fully who you are, not someone new. Recovery isn’t replacement. Expect to recognise yourself on the other side.",
    who: "Adam Phillips", src: "On Getting Better (2021)" },
  { t: "Giving things up can be a form of freedom, not just defeat. Knowing what to stop matters as much as knowing what to pursue. Let something go this week.",
    who: "Adam Phillips", src: "On Giving Up (2024)" },
  { t: "We bring both hope and dread into new relationships: hope of something new, dread of repeating something old. Both are normal. Don’t let the dread do all the talking.",
    who: "Stephen A. Mitchell", src: "Hope and Dread in Psychoanalysis (1993)" },
  { t: "Romance fades less from familiarity than from believing you know your partner completely. Nobody is fully known. Stay curious about the person you live with.",
    who: "Stephen A. Mitchell", src: "Can Love Last? (2002)" },
  { t: "We are always influenced by others. Autonomy isn’t freedom from influence. It’s owning the influences you’ve taken in. Know whose ideas you’re carrying.",
    who: "Stephen A. Mitchell", src: "Influence and Autonomy in Psychoanalysis (1997)" },
  { t: "Love is a tension between the wish for safety and the wish for adventure. Neither goes away. The work is in keeping both alive with the same person.",
    who: "Stephen A. Mitchell", src: "Safety and adventure — Can Love Last? (2002)" },
  { t: "What disgusts us marks the border between ‘me’ and ‘not me’. Disgust defends identity. When something revolts you, ask what boundary it’s threatening.",
    who: "Julia Kristeva", src: "Abjection — Powers of Horror (1980)" },
  { t: "Depression can feel like a black sun: an inner light that gives no warmth, tied to a loss that can’t be named. Finding words for it is part of the way out. Tell someone.",
    who: "Julia Kristeva", src: "Black Sun: Depression and Melancholia (1987)" },
  { t: "Love both dissolves and remakes the boundaries of the self. That’s why it’s thrilling and frightening. Expect to be changed by it.",
    who: "Julia Kristeva", src: "Tales of Love (1983)" },
  { t: "Question yourself as well as the world. Inner life depends on that kind of intimate revolt. A little self-questioning keeps you alive.",
    who: "Julia Kristeva", src: "Intimate revolt — The Sense and Non-Sense of Revolt (1996)" },
  { t: "A parent can be present but emotionally absent, often lost in their own grief. A child tries to revive them, and may later feel hollow without knowing why. That hollowness has a history.",
    who: "André Green", src: "“The Dead Mother” (1980)" },
  { t: "What’s missing shapes us as much as what’s there: absences, losses, the things that never happened. Pay attention to the empty chairs in your life.",
    who: "André Green", src: "The Work of the Negative (1993)" },
  { t: "Some withdrawal sustains the self. Some seeks to switch everything off. When you cancel plans, ask which kind of retreat you’re making.",
    who: "André Green", src: "Life Narcissism, Death Narcissism (1983)" },
  { t: "Parents send children messages charged with meanings the parents themselves don’t understand. We spend a lifetime translating them. You don’t have to finish the translation alone.",
    who: "Jean Laplanche", src: "The enigmatic signifier — New Foundations for Psychoanalysis (1987)" },
  { t: "An event can become a wound only later, when we come to understand it. The past isn’t fixed. Its meaning can change, and so can your relationship to it.",
    who: "Jean Laplanche", src: "“Notes on Afterwardsness” — Essays on Otherness (1999)" },
  { t: "Every close relationship creates a third thing that belongs to neither person alone. When you argue, notice what the two of you are creating together.",
    who: "Thomas Ogden", src: "The analytic third — Subjects of Analysis (1994)" },
  { t: "Stray thoughts and daydreams during a conversation can be clues to what’s happening between you. When your mind wanders, notice where it goes.",
    who: "Thomas Ogden", src: "“Reverie and Interpretation” (1997)" },
  { t: "Some experiences can’t be digested alone. We need someone to help us dream what we couldn’t dream by ourselves. Talk things through with someone, out loud.",
    who: "Thomas Ogden", src: "Dreaming undreamt dreams — This Art of Psychoanalysis (2005)" },
  { t: "Comfort sometimes has to come through the body before it can come through words: rhythm, warmth, texture. When talking doesn’t help, try a blanket or a walk.",
    who: "Thomas Ogden", src: "The autistic-contiguous position — The Primitive Edge of Experience (1989)" },
  { t: "Every separation echoes the first one, birth. Leaving a job, a house, a person, each recalls it. Allow yourself to find endings harder than they look.",
    who: "Otto Rank", src: "The Trauma of Birth (1924)" },
  { t: "We fear standing out and alone, and we fear dissolving into others. We spend our lives moving between the two. Notice which fear is steering you today.",
    who: "Otto Rank", src: "Life fear and death fear — Will Therapy (1936)" },
  { t: "Creativity turns inner conflict into form. You don’t have to resolve a struggle before making something from it. Use it.",
    who: "Otto Rank", src: "Art and Artist (1932)" },
  { t: "The will is a creative force, not just stubbornness. Don’t break your will. Point it at something worth doing.",
    who: "Otto Rank", src: "The creative will — Will Therapy (1936)" },
  { t: "We are all much more simply human than otherwise. When someone seems incomprehensible, start from what you have in common.",
    who: "Harry Stack Sullivan", src: "The one-genus postulate — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "We fail to notice whatever would make us anxious. What we don’t see is often chosen. Ask a trusted friend what you’re not noticing.",
    who: "Harry Stack Sullivan", src: "Selective inattention — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "We sort ourselves into good-me, bad-me and not-me. Not-me holds what’s too frightening to own. The parts you disown still belong to you.",
    who: "Harry Stack Sullivan", src: "Good-me, bad-me, not-me — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "In anxious moments we deflect: jokes, topic changes, sudden interest in the weather. It reduces anxiety at the cost of contact. Next time, stay on the topic one beat longer.",
    who: "Harry Stack Sullivan", src: "Security operations — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "A close childhood friendship teaches you to care about someone else’s wellbeing as much as your own. If you never had one, it’s not too late. Be a good chum to someone.",
    who: "Harry Stack Sullivan", src: "Chumship — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "When someone matches the feeling behind what you do, not just the action, you feel understood. That’s attunement. Try reflecting the feeling, not just the words.",
    who: "Daniel Stern", src: "Affect attunement — The Interpersonal World of the Infant (1985)" },
  { t: "Change often happens in brief moments of real meeting, just seconds long. Not everything takes years. Be ready for the moment.",
    who: "Daniel Stern", src: "The Present Moment in Psychotherapy and Everyday Life (2004)" },
  { t: "Infants live in a world of light, hunger, weather and faces. Adults still live partly there. Sometimes the problem is just that you’re hungry or tired.",
    who: "Daniel Stern", src: "Diary of a Baby (1990)" },
  { t: "Without an integrated sense of self and others, each relationship produces a different person. Try to notice what stays constant in you across rooms.",
    who: "Otto Kernberg", src: "Identity diffusion — Borderline Conditions and Pathological Narcissism (1975)" },
  { t: "Mature love integrates tenderness with desire and even some aggression. Love with no room for ambivalence tends not to last. You’re allowed to be cross with people you love.",
    who: "Otto Kernberg", src: "Love Relations: Normality and Pathology (1995)" },
  { t: "Feelings of inferiority are universal and drive human striving. They become a problem only when they harden into a complex. Use the feeling as fuel, not as a verdict.",
    who: "Alfred Adler", src: "The inferiority feeling — Understanding Human Nature (1927)" },
  { t: "Psychological health shows in social interest: a feeling of community and concern for others. Self-care alone won’t get you there. Do something for someone else.",
    who: "Alfred Adler", src: "Social interest — What Life Should Mean to You (1931)" },
  { t: "Life sets three tasks: work, friendship and love. Each tests your connection to others. Check whether you’ve been neglecting one.",
    who: "Alfred Adler", src: "The three life tasks — What Life Should Mean to You (1931)" },
  { t: "Birth order shapes the roles children take on. Siblings grow up in different families under the same roof. Your sister’s memories aren’t wrong. She had a different seat.",
    who: "Alfred Adler", src: "Birth order — Understanding Human Nature (1927)" },
  { t: "By early childhood you’ve adopted a style of life, a characteristic way of meeting problems. It can change, but rarely without being noticed first. Notice yours.",
    who: "Alfred Adler", src: "Style of life — Understanding Human Nature (1927)" },
  { t: "Defences live in the body: tight jaws, raised shoulders, a held breath. Drop your shoulders now. Your body has been bracing for something.",
    who: "Wilhelm Reich", src: "Character armour — Character Analysis (1933)" },
  { t: "How someone speaks reveals as much as what they say. Listen to the tone and manner, not just the words, including your own.",
    who: "Wilhelm Reich", src: "Character Analysis (1933)" },
  { t: "A role can be worn as a mask to avoid retaliation for success. Any identity can become a costume. Notice when you’re playing smaller to stay safe.",
    who: "Joan Riviere", src: "“Womanliness as a Masquerade” (1929)" },
  { t: "Some people get worse when helped, because getting better feels like abandoning someone they love. If recovery feels like betrayal, ask who you’d be leaving behind.",
    who: "Joan Riviere", src: "“A Contribution to the Analysis of the Negative Therapeutic Reaction” (1936)" },
