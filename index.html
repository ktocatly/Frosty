  { t: "What actually makes you happy is often not what you assume. Keep notes for a while on what really lifts you. The results may surprise you.",
    who: "Marion Milner", src: "A Life of One’s Own (1934, as Joanna Field)" },
  { t: "Widening your attention, rather than narrowing it on a goal, makes ordinary things vivid. Try taking in the whole room, not just the screen.",
    who: "Marion Milner", src: "Wide attention — A Life of One’s Own (1934, as Joanna Field)" },
  { t: "You can often only create freely once you stop trying to control the result. Creativity needs tolerance of not knowing. Make something badly on purpose.",
    who: "Marion Milner", src: "On Not Being Able to Paint (1950)" },
  { t: "Some things can be shown before they can be said. If you can’t put something into words, try drawing it.",
    who: "Marion Milner", src: "The Hands of the Living God (1969)" },
  { t: "Frames matter: the edge of a picture, the end of an hour. A boundary makes a different kind of experience possible. Give your day some edges.",
    who: "Marion Milner", src: "The frame — “The Role of Illusion in Symbol Formation” (1952)" },
  { t: "When a symbol is treated as the thing itself, trouble follows. A present is not the love. A text is not the person. Keep them apart in your mind.",
    who: "Hanna Segal", src: "The symbolic equation — “Notes on Symbol Formation” (1957)" },
  { t: "Making something beautiful can be a way of mourning: rebuilding a lost world in a new form. If you’re grieving, create something from it.",
    who: "Hanna Segal", src: "“A Psycho-Analytical Approach to Aesthetics” (1952)" },
  { t: "It’s possible to become quietly addicted to despair, finding a secret comfort in it. If your misery has become familiar and strangely cosy, it may be time to leave it.",
    who: "Betty Joseph", src: "“Addiction to Near-Death” (1982)" },
  { t: "We keep our inner balance by pulling others into familiar patterns, often without anyone noticing. If every boss becomes your father, look at the pattern, not the boss.",
    who: "Betty Joseph", src: "Psychic Equilibrium and Psychic Change (1989)" },
  { t: "Part of the self can operate like a gang, promising protection if you refuse to depend on anyone. Gangs always say that. Accepting help is how you leave.",
    who: "Herbert Rosenfeld", src: "Destructive narcissism — “A Clinical Approach to the Psychoanalytic Theory of the Life and Death Instincts” (1971)" },
  { t: "We have inner hideouts that protect us from pain and from growth in equal measure. Know where yours is, and how long you’ve been staying there.",
    who: "John Steiner", src: "Psychic Retreats (1993)" },
  { t: "Shame is about being seen at the wrong moment. The cure is usually being seen properly, at the right one, by someone kind. Let someone see you.",
    who: "John Steiner", src: "Seeing and Being Seen (2011)" },
  { t: "Narcissism is turning away from what could sustain you because it comes from outside. Take the help. You can still pretend it was your idea.",
    who: "Neville Symington", src: "The lifegiver — Narcissism: A New Theory (1993)" },
  { t: "Gifted children learn early to sense and meet their parents’ needs, and lose touch with their own. If you’re brilliant at reading others, check in with yourself.",
    who: "Alice Miller", src: "The Drama of the Gifted Child (1979)" },
  { t: "Much depression is grief for the self you were never allowed to be. Grieve it. Then go looking for that self. It’s still there.",
    who: "Alice Miller", src: "Depression as grief — The Drama of the Gifted Child (1979)" },
  { t: "Cruelty to children has often been justified as good upbringing. Listen closely to anything done ‘for your own good’, including what you do to yourself.",
    who: "Alice Miller", src: "For Your Own Good (1980)" },
  { t: "A child needs an average expectable environment. Not ideal conditions, ordinary adequate ones. You don’t have to provide perfection. Reliable is enough.",
    who: "Heinz Hartmann", src: "The average expectable environment — Ego Psychology and the Problem of Adaptation (1939)" },
  { t: "Psychological birth happens long after physical birth, through a slow process of separating and becoming oneself. Some of us are still being born. Be patient with it.",
    who: "Margaret Mahler", src: "The Psychological Birth of the Human Infant (1975)" },
  { t: "Toddlers run off to explore, discover they’re separate, and come back anxiously for reassurance. We do the same with every big step. It’s fine to check in.",
    who: "Margaret Mahler", src: "Rapprochement — The Psychological Birth of the Human Infant (1975)" },
  { t: "Separating and becoming yourself are twin processes. Neither works without the other. You can become your own person without cutting ties.",
    who: "Margaret Mahler", src: "Separation-individuation — The Psychological Birth of the Human Infant (1975)" },
  { t: "Some people adapt perfectly to every setting but feel nothing genuine. The imitation is good; the feeling is missing. Do one thing today that you actually feel.",
    who: "Helene Deutsch", src: "The ‘as-if’ personality — “Some Forms of Emotional Disturbance and Their Relationship to Schizophrenia” (1942)" },
  { t: "Who does the early caring shapes how children learn to relate, and the pattern reproduces itself. Change who holds the baby and you change a lot.",
    who: "Nancy Chodorow", src: "The Reproduction of Mothering (1978)" },
  { t: "Siblings shape us sideways in ways theories about parents miss. Your first rival and ally arrived in the same house. Look at how you treat peers.",
    who: "Juliet Mitchell", src: "Siblings (2003)" },
  { t: "We’ve medicalised grief as depression and lost the rituals that helped people mourn. You may not be broken. You may be mourning. Give it its own time.",
    who: "Darian Leader", src: "The New Black (2008)" },
  { t: "Letters we write and never send are still a way of speaking, to ourselves as much as the other. Write the letter. You don’t have to post it.",
    who: "Darian Leader", src: "Why Do Women Write More Letters Than They Post? (1996)" },
  { t: "Being mad is different from going mad. Madness can be quiet and stable; the crisis comes when what held it together gives way. Pay attention to what’s holding you together.",
    who: "Darian Leader", src: "What Is Madness? (2011)" },
  { t: "Insomnia can express what you can’t put into words. If you’re lying awake at 3 a.m., something may want a hearing. Try listening to it in daylight.",
    who: "Darian Leader", src: "Why Can’t We Sleep? (2019)" },
  { t: "Praising children for being clever can make them afraid to fail. Praise effort instead. It leaves room to try hard things.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "People resist change because change involves loss. Staying stuck can be a way of not giving something up. Ask what you’d lose if you changed.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "The stories we tell about ourselves can hide other stories. The one you tell most often may be covering for one you can’t yet tell.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "Inertia isn’t always laziness. Doing nothing can be a protest against relentless demands to perform. Rest without apologising for it.",
    who: "Josh Cohen", src: "Not Working: Why We Have to Stop (2018)" },
  { t: "Burnout is exhausted desire: not just tiredness, but no longer being able to want. If nothing appeals, you need rest, not motivation.",
    who: "Josh Cohen", src: "Burnout — Not Working: Why We Have to Stop (2018)" },
  { t: "Without enough holding, babies hold themselves together with tense muscles or constant movement, a second skin. Adults use busyness. Try being held instead.",
    who: "Esther Bick", src: "The second skin — “The Experience of the Skin in Early Object-Relations” (1968)" },
  { t: "A part of the self can withdraw from a world that once felt like too much. It isn’t absent, it’s hiding. Offer it warm, low-pressure invitations.",
    who: "Harry Guntrip", src: "Schizoid Phenomena, Object-Relations and the Self (1968)" },
  { t: "We are lived by forces we don’t know and can’t fully steer. You’re not entirely in charge. Accepting that can be a relief.",
    who: "Georg Groddeck", src: "The Book of the It (1923)" },
  { t: "Listen with a third ear: to what isn’t said, and to your own reactions. The pauses carry as much as the words.",
    who: "Theodor Reik", src: "Listening with the Third Ear (1948)" },
  { t: "Surprise is often a sign you’ve touched something true. The thought that startles you is the one worth keeping.",
    who: "Theodor Reik", src: "Surprise — Listening with the Third Ear (1948)" },
  { t: "Healing turns ghosts into ancestors: the past stops haunting and starts guiding. You don’t have to forget your history. You have to put it to rest.",
    who: "Hans Loewald", src: "Ghosts into ancestors — “On the Therapeutic Action of Psycho-Analysis” (1960)" },
  { t: "Growing up means taking over your parents’ authority and becoming responsible for yourself. You can do it kindly. You still have to do it.",
    who: "Hans Loewald", src: "“The Waning of the Oedipus Complex” (1979)" },
  { t: "A good helper holds a picture of who you could become, a version a little further along. Find people who see that version of you, and grow towards it.",
    who: "Hans Loewald", src: "“On the Therapeutic Action of Psycho-Analysis” (1960)" },
  { t: "Parents who can remember and feel their own childhood pain are less likely to repeat it. The danger isn’t the memory. It’s forgetting.",
    who: "Selma Fraiberg", src: "“Ghosts in the Nursery” (1975)" },
  { t: "Understanding behaviour in terms of what people think and feel, yours and theirs, prevents a lot of trouble. When conflict starts, ask what’s going on in their head.",
    who: "Peter Fonagy", src: "Mentalization — Affect Regulation, Mentalization, and the Development of the Self (2002)" },
  { t: "To be helped, you need to be able to trust others as sources of knowledge. If no advice ever reaches you, the problem may not be the advice.",
    who: "Peter Fonagy", src: "Epistemic trust — “The Role of Mentalizing and Epistemic Trust in the Therapeutic Relationship” (2014, with Elizabeth Allison)" },
  { t: "We seek a background feeling of safety even more than pleasure. That’s why routine soothes and holidays can exhaust. Build some safety into your days.",
    who: "Joseph Sandler", src: "“The Background of Safety” (1960)" },
  { t: "Say ‘I am anxious about it’ rather than ‘anxiety overwhelms me’. Feelings aren’t weather. Speaking as the one who feels gives you back some agency.",
    who: "Roy Schafer", src: "Action language — A New Language for Psychoanalysis (1976)" },
  { t: "Healing can mean telling your life as a different story, true, but with fewer villains and more plot. Try retelling one of your old stories.",
    who: "Roy Schafer", src: "Retelling a Life (1992)" },
  { t: "A coherent, convincing story about your past can heal even if you can’t know exactly what happened. Your memories don’t have to be perfect to be useful.",
    who: "Donald Spence", src: "Narrative Truth and Historical Truth (1982)" },
  { t: "Hope can survive the collapse of a whole way of life, hope for a good you can’t yet imagine. When everything familiar ends, you can still hope.",
    who: "Jonathan Lear", src: "Radical Hope (2006)" },
  { t: "Every idea of a happy life leaves something over that doesn’t fit. That remainder isn’t a flaw. It’s part of being a person.",
    who: "Jonathan Lear", src: "Happiness, Death, and the Remainder of Life (2000)" },
  { t: "The mind isn’t transparent to itself. Self-knowledge is always partial. Be humble about how well you know your own reasons.",
    who: "Jonathan Lear", src: "Open Minded (1998)" },
  { t: "The same people and situations that nourish us can also poison us. It’s hard to separate the two. Learn to taste what you’re being given.",
    who: "Michael Eigen", src: "Toxic Nourishment (1999)" },
  { t: "Life’s first shock is beauty, along with not knowing what lies behind it. Beauty and doubt arrive together. Being moved by something isn’t naive. It’s original.",
    who: "Donald Meltzer", src: "Aesthetic conflict — The Apprehension of Beauty (1988)" },
  { t: "We each have an inner theatre where old scenes are restaged with new actors. Once you know the script, you can change it.",
    who: "Joyce McDougall", src: "Theaters of the Mind (1985)" },
  { t: "When feelings can’t find words, the body may speak them instead. Some aches are feelings without language. Ask what yours might be saying.",
    who: "Joyce McDougall", src: "Theaters of the Body (1989)" },
  { t: "The self begins as a skin: a surface that holds, protects and communicates. Some days you need to thicken it. Some days you need to let a little weather in.",
    who: "Didier Anzieu", src: "The Skin-Ego (1985)" },
  { t: "Every creation involves some destruction. To make something new, something old has to go. Expect change to cost you something.",
    who: "Sabina Spielrein", src: "“Destruction as the Cause of Coming into Being” (1912)" },
  { t: "Submission gives yourself up to another’s power. Surrender lets go of a defence so you can be known. One shrinks you, the other doesn’t. Know the difference.",
    who: "Emmanuel Ghent", src: "“Masochism, Submission, Surrender” (1990)" },
  { t: "Relationships need ritual and spontaneity: a stable frame and genuine response. Too much of either loses something. Keep the routine. Occasionally break it.",
    who: "Irwin Z. Hoffman", src: "Ritual and Spontaneity in the Psychoanalytic Process (1998)" },
  { t: "Fantasy doesn’t just fulfil desire. It teaches us how to desire, and what. Check who wrote your fantasies.",
    who: "Slavoj Žižek", src: "Fantasy — The Plague of Fantasies (1997)" },
  { t: "People know very well what they’re doing, and they do it anyway. Seeing through something isn’t the same as being free of it. Change the behaviour, not just the opinion.",
    who: "Slavoj Žižek", src: "Cynical reason — The Sublime Object of Ideology (1989)" },
  { t: "Ending on a striking word leaves it echoing. Where you stop shapes what’s heard. End conversations a little earlier than you think you should.",
    who: "Bruce Fink", src: "A Clinical Introduction to Lacanian Psychoanalysis (1997)" },
  { t: "Images of ourselves and others develop together. Change how you see one and the other shifts. Revising how you see your parents can change how you see yourself.",
    who: "Edith Jacobson", src: "The Self and the Object World (1964)" },
  { t: "In mourning we take the lost person inside us to keep them. Their phrases and habits may become yours. That’s not strange. It’s how they stay.",
    who: "Karl Abraham", src: "“A Short Study of the Development of the Libido” (1924)" },
  { t: "Painful feelings become trauma when there’s no one to share them with. Pain needs a relational home. Find yours one.",
    who: "Robert Stolorow", src: "Trauma and Human Existence (2007)" },
  { t: "A society built on competition and performance breeds anxious, isolated selves. Some of your distress is social, not personal. Don’t blame yourself for all of it.",
    who: "Paul Verhaeghe", src: "What About Me? (2012)" },
];

const bubble = document.getElementById('bubble');
const byline = document.getElementById('byline');
const snowman = document.getElementById('snowman');
const countEl = document.getElementById('count');
let deck = [], n = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function next() {
  if (!deck.length) deck = shuffle(ADVICE.slice());
  return deck.pop();
}
function speak() {
  const a = next();
  n++;
  bubble.classList.remove('fresh'); void bubble.offsetWidth; bubble.classList.add('fresh');
  bubble.innerHTML = '';
  const p = document.createElement('p'); p.textContent = '“' + a.t + '”'; bubble.appendChild(p);
  byline.querySelector('.who').textContent = a.who;
  byline.querySelector('.src').textContent = a.src;
  countEl.textContent = 'Session ' + n;
  snowman.classList.remove('wobble'); void snowman.offsetWidth; snowman.classList.add('wobble');
}
snowman.addEventListener('click', speak);
document.getElementById('again').addEventListener('click', speak);

document.getElementById('issue').textContent =
  new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });

// Gentle snowfall
const c = document.getElementById('snowfall'), ctx = c.getContext('2d');
let flakes = [];
function size() {
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  const count = Math.min(140, Math.floor(innerWidth / 8));
  flakes = Array.from({ length: count }, () => ({
    x: Math.random() * c.width, y: Math.random() * c.height,
    r: (Math.random() * 2 + 0.8) * devicePixelRatio, s: Math.random() * 0.6 + 0.3, d: Math.random() * Math.PI * 2
  }));
}
function tick() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const f of flakes) {
    f.y += f.s * devicePixelRatio; f.d += 0.01; f.x += Math.sin(f.d) * 0.4 * devicePixelRatio;
    if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(tick);
}
addEventListener('resize', size);
size();
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
</script>
