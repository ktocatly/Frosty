<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frosty Says</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe3;
    --paper-edge: #e6dcc6;
    --ink: #2a2622;
    --ink-soft: #6b6157;
    --rule: #2a2622;
    --night: #1d2a44;
    --night-2: #34476b;
    --snow: #fbfaf6;
    --scarf: #3f6b4e;
    --scarf-2: #2c4f39;
    --hat: #2f3a34;
    --nose: #e07a2e;
    --bubble: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    background-image: radial-gradient(ellipse at top, var(--night-2), var(--night) 70%);
    min-height: 100vh;
    font-family: "Libre Baskerville", Georgia, serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
  }
  #snowfall { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .column {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(180,160,120,.12), transparent 50%);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    padding: 28px 28px 22px;
    transform: rotate(-0.4deg);
  }

  /* Masthead */
  .meta {
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
    border-top: 3px double var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 6px 0;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900;
    font-size: clamp(44px, 12vw, 72px);
    line-height: .95;
    text-align: center;
    margin: 14px 0 4px;
    letter-spacing: -.01em;
  }
  .dek {
    text-align: center;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  /* Stage */
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; }

  .bubble {
    position: relative;
    width: 100%;
    min-height: 132px;
    background: var(--bubble);
    border: 2px solid var(--ink);
    border-radius: 22px;
    padding: 18px 20px;
    margin: 6px 0 18px;
    font-size: 16px;
    line-height: 1.6;
    box-shadow: 4px 4px 0 rgba(42,38,34,.15);
    display: flex; align-items: center;
  }
  .bubble::after, .bubble::before {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    border-style: solid;
  }
  .bubble::before { bottom: -18px; border-width: 18px 14px 0 14px; border-color: var(--ink) transparent transparent; }
  .bubble::after  { bottom: -14px; border-width: 15px 11px 0 11px; border-color: var(--bubble) transparent transparent; }
  .bubble p { margin: 0; }
  .bubble .hint { color: var(--ink-soft); font-style: italic; text-align: center; width: 100%; }
  .bubble.fresh p { animation: inkIn .5s ease both; }
  @keyframes inkIn { from { opacity: 0; filter: blur(3px); transform: translateY(4px); } to { opacity: 1; filter: none; transform: none; } }

  .snowman-btn {
    appearance: none; border: 0; background: none; padding: 0; margin: 0;
    cursor: pointer; width: min(320px, 80vw);
    -webkit-tap-highlight-color: transparent;
  }
  .snowman-btn:focus-visible { outline: 3px dashed var(--scarf); outline-offset: 6px; border-radius: 12px; }
  .snowman-btn img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(0 10px 10px rgba(42,38,34,.22));
    transform-origin: 50% 90%;
    user-select: none; -webkit-user-drag: none;
  }
  .snowman-btn.wobble img { animation: wobble .6s ease; }
  @keyframes wobble {
    0% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-4deg) scale(1.03, .97); }
    45% { transform: rotate(3deg) scale(.98, 1.03); }
    70% { transform: rotate(-1.5deg); }
    100% { transform: rotate(0) scale(1); }
  }

  /* Byline / citation */
  .byline {
    margin-top: 14px;
    border-top: 1px solid var(--rule);
    padding-top: 10px;
    min-height: 66px;
    font-size: 13px;
    line-height: 1.5;
  }
  .byline .label {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .byline .who {
    font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 18px;
  }
  .byline .src { color: var(--ink-soft); font-style: italic; }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 3px double var(--rule);
    margin-top: 12px; padding-top: 8px;
    font-size: 11px; color: var(--ink-soft);
  }
  .footer button {
    font: inherit; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    background: none; border: 1px solid var(--ink-soft); color: var(--ink);
    padding: 5px 10px; cursor: pointer; border-radius: 3px;
  }
  .footer button:hover { background: var(--ink); color: var(--paper); }

  @media (max-width: 420px) {
    .column { padding: 20px 16px 16px; transform: none; }
    .bubble { font-size: 15px; padding: 14px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .snowman-btn.wobble img, .bubble.fresh p { animation: none; }
  }
</style>
</head>
<body>
<canvas id="snowfall" aria-hidden="true"></canvas>

<main class="column">
  <div class="meta"><span>The Winter Gazette</span><span id="issue">Advice Column</span></div>
  <h1>Frosty Says</h1>
  <p class="dek">Your snowman is with you &mdash; tap him anywhere for a word from the unconscious.</p>

  <section class="stage">
    <div class="bubble" id="bubble" aria-live="polite">
      <p class="hint">&ldquo;Go on, poke me. I&rsquo;ve been listening all winter and I have notes.&rdquo;</p>
    </div>

    <button class="snowman-btn" id="snowman" aria-label="Tap the snowman for advice">
      <img src="frosty.webp" alt="Frosty, a plush snowman in a green hat and scarf" width="640" height="835">
    </button>
  </section>

  <section class="byline" id="byline" aria-live="polite">
    <div class="label">Speaking according to</div>
    <div class="who">&hellip;</div>
    <div class="src">Tap the snowman to begin your session.</div>
  </section>

  <div class="footer">
    <span id="count">Session 0</span>
    <button id="again" type="button">Another, please</button>
  </div>
</main>

<script>
const ADVICE = [
  { t: "You ‘forgot’ to reply. Again. I’m not saying you didn’t want to. I’m saying your thumbs seem to have an opinion.",
    who: "Sigmund Freud", src: "On parapraxes — The Psychopathology of Everyday Life (1901)" },
  { t: "Same argument, new person, identical script. At some point you have to admit you’re not the audience. You’re the playwright.",
    who: "Sigmund Freud", src: "Repetition compulsion — “Remembering, Repeating and Working-Through” (1914)" },
  { t: "Grief isn’t a mood you get over. It’s admin. Every place you kept them has to be cleared out, one drawer at a time. Nobody enjoys admin.",
    who: "Sigmund Freud", src: "The work of mourning — “Mourning and Melancholia” (1917)" },
  { t: "That voice telling you you’re not good enough? Check the accent. It’s probably a parent’s, and they’re not even in the room.",
    who: "Sigmund Freud", src: "The superego — The Ego and the Id (1923)" },
  { t: "Love and work. That’s the whole list. Notice it doesn’t say ‘be happy’. Freud was many things, but a cheerleader wasn’t one of them.",
    who: "Sigmund Freud", src: "Lieben und arbeiten, as reported by Erik Erikson" },
  { t: "You can adore someone and want to throw their phone in a lake. Same afternoon. That isn’t a contradiction. That’s a relationship.",
    who: "Melanie Klein", src: "The depressive position — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "If they’re a saint on Monday and a monster by Thursday, it may not be them that keeps changing.",
    who: "Melanie Klein", src: "Splitting — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Envy doesn’t want what they have. It wants them not to have it. Charming. Try being grateful for something, purely out of spite.",
    who: "Melanie Klein", src: "Envy and Gratitude (1957)" },
  { t: "Perfect parents raise people who can’t cope with anything. Disappoint someone a little today. It’s character-building, for both of you.",
    who: "D. W. Winnicott", src: "The good-enough mother — Playing and Reality (1971)" },
  { t: "You’re very good at being who they want. Suspiciously good. Somewhere under the performance is someone who hasn’t been allowed to speak in years.",
    who: "D. W. Winnicott", src: "True and False Self — “Ego Distortion in Terms of True and False Self” (1960)" },
  { t: "Sitting quietly in a room with someone, without performing, is a rare skill. Most people can’t even manage it with themselves.",
    who: "D. W. Winnicott", src: "“The Capacity to Be Alone” (1958)" },
  { t: "Play isn’t a break from finding yourself. It’s where you’re hiding. Make something pointless. I’m frozen water in a hat, and look how I turned out.",
    who: "D. W. Winnicott", src: "Transitional space — Playing and Reality (1971)" },
  { t: "You want what you want. Or you want what they want you to want. Lacan would say there’s no difference, then end the session early.",
    who: "Jacques Lacan", src: "“The Subversion of the Subject and the Dialectic of Desire” (1960)" },
  { t: "The tidy, whole person in the mirror is a flattering rumour. The real you is messier. Also, frankly, better company.",
    who: "Jacques Lacan", src: "“The Mirror Stage as Formative of the I Function” (1949)" },
  { t: "Pay attention to your slips of the tongue. The unconscious is structured like a language, and it has better comic timing than you do.",
    who: "Jacques Lacan", src: "Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "The thing about other people that drives you mad? Bad news. It’s usually a mirror with the lights off.",
    who: "Carl Jung", src: "The Shadow — Aion (1951)" },
  { t: "Some feelings arrive before there are words for them. Hand them to someone sturdy for a while. I’d offer, but I’m melting.",
    who: "Wilfred Bion", src: "Container and contained — Learning from Experience (1962)" },
  { t: "Go into the conversation with no memory and no agenda. Terrifying, I know. You might accidentally hear something.",
    who: "Wilfred Bion", src: "“Notes on Memory and Desire” (1967)" },
  { t: "Wanting to be admired isn’t vanity. It’s a vitamin. Just don’t try to get your daily dose from strangers on the internet.",
    who: "Heinz Kohut", src: "Mirroring selfobjects — The Analysis of the Self (1971)" },
  { t: "You should exercise, should call your mother, should be further along by now. Horney called it the tyranny of the shoulds. Tyrants never say thank you.",
    who: "Karen Horney", src: "Neurosis and Human Growth (1950)" },
  { t: "Love isn’t something you fall into, like a ditch. It’s a skill, like the cello. Most people expect to play the cello without practising.",
    who: "Erich Fromm", src: "The Art of Loving (1956)" },
  { t: "Freedom is lovely in theory. In practice, most people hand it to the first confident person with a clipboard.",
    who: "Erich Fromm", src: "Escape from Freedom (1941)" },
  { t: "Every stage of life comes with its own crisis, free of charge. If you’re having one, congratulations. You’re on schedule.",
    who: "Erik Erikson", src: "Psychosocial stages — Childhood and Society (1950)" },
  { t: "Your defences were brilliant inventions, once. Some of them have been working well past retirement age.",
    who: "Anna Freud", src: "The Ego and the Mechanisms of Defence (1936)" },
  { t: "Needing someone isn’t weakness. People are built to want a secure base. Even I need a reliable cold front.",
    who: "John Bowlby", src: "Attachment and Loss, Vol. 1: Attachment (1969)" },
  { t: "We stay loyal to whatever hurt us, because a bad attachment feels safer than none. It’s a terrible deal. People sign it every day.",
    who: "W. R. D. Fairbairn", src: "Psychoanalytic Studies of the Personality (1952)" },
  { t: "As a child you may have learned to see things from the bully’s side. It kept you safe. You can stop now. You’re taller than them.",
    who: "Sándor Ferenczi", src: "Identification with the aggressor — “Confusion of Tongues” (1932)" },
  { t: "You know things you’ve never actually thought. Bollas called it the unthought known. You call it a funny feeling. It’s usually right.",
    who: "Christopher Bollas", src: "The Shadow of the Object (1987)" },
  { t: "If one of you always gives in and the other always gets their way, nobody is being seen. It’s two people taking turns being furniture.",
    who: "Jessica Benjamin", src: "The Bonds of Love (1988)" },
  { t: "You’ll spend a lot of time mourning the lives you didn’t live. Fair enough. But this one is the only one with your name on the lease.",
    who: "Adam Phillips", src: "Missing Out: In Praise of the Unlived Life (2012)" },
  { t: "You aren’t one self. You’re a committee, and each member was elected by a different relationship. The meetings run long.",
    who: "Stephen A. Mitchell", src: "Relational Concepts in Psychoanalysis (1988)" },
  { t: "If you sometimes feel like a stranger to yourself, welcome. Everyone is foreign somewhere inside. You might as well be a decent host.",
    who: "Julia Kristeva", src: "Strangers to Ourselves (1988)" },
];

const bubble = document.getElementById('bubble');
const byline = document.getElementById('byline');
const snowman = document.getElementById('snowman');
const countEl = document.getElementById('count');
let deck = [], n = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function next() {
  if (!deck.length) deck = shuffle(ADVICE.slice());
  return deck.pop();
}
function speak() {
  const a = next();
  n++;
  bubble.classList.remove('fresh'); void bubble.offsetWidth; bubble.classList.add('fresh');
  bubble.innerHTML = '';
  const p = document.createElement('p'); p.textContent = '“' + a.t + '”'; bubble.appendChild(p);
  byline.querySelector('.who').textContent = a.who;
  byline.querySelector('.src').textContent = a.src;
  countEl.textContent = 'Session ' + n;
  snowman.classList.remove('wobble'); void snowman.offsetWidth; snowman.classList.add('wobble');
}
snowman.addEventListener('click', speak);
document.getElementById('again').addEventListener('click', speak);

document.getElementById('issue').textContent =
  new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });

// Gentle snowfall
const c = document.getElementById('snowfall'), ctx = c.getContext('2d');
let flakes = [];
function size() {
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  const count = Math.min(140, Math.floor(innerWidth / 8));
  flakes = Array.from({ length: count }, () => ({
    x: Math.random() * c.width, y: Math.random() * c.height,
    r: (Math.random() * 2 + 0.8) * devicePixelRatio, s: Math.random() * 0.6 + 0.3, d: Math.random() * Math.PI * 2
  }));
}
function tick() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const f of flakes) {
    f.y += f.s * devicePixelRatio; f.d += 0.01; f.x += Math.sin(f.d) * 0.4 * devicePixelRatio;
    if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(tick);
}
addEventListener('resize', size);
size();
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
</script>
</body>
</html>
