  { t: "Sullivan described selective inattention: the way we fail to notice whatever would make us anxious. What we don’t see is often chosen.",
    who: "Harry Stack Sullivan", src: "Selective inattention — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "Sullivan said the self is organised into good-me, bad-me and not-me. Not-me holds experiences too anxiety-provoking to be owned at all.",
    who: "Harry Stack Sullivan", src: "Good-me, bad-me, not-me — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "Sullivan called them security operations: the manoeuvres we use to reduce anxiety in relationships, at the cost of noticing what’s actually happening.",
    who: "Harry Stack Sullivan", src: "Security operations — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "Sullivan thought preadolescent friendship, ‘chumship’, is where we first learn to care about another person’s wellbeing as much as our own.",
    who: "Harry Stack Sullivan", src: "Chumship — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "Stern described affect attunement: a parent matching the feeling behind a baby’s action, in a different form, so the baby knows it has been understood. It’s how sharing an inner state begins.",
    who: "Daniel Stern", src: "Affect attunement — The Interpersonal World of the Infant (1985)" },
  { t: "Stern argued that change often happens in ‘present moments’ lasting only seconds, moments of meeting between two people. Not everything needs years.",
    who: "Daniel Stern", src: "The Present Moment in Psychotherapy and Everyday Life (2004)" },
  { t: "In Diary of a Baby, Stern imagined the infant’s experience in its own terms: a world of light, hunger, weather and faces. Adults still live partly in that world.",
    who: "Daniel Stern", src: "Diary of a Baby (1990)" },
  { t: "Kernberg described identity diffusion: a lack of an integrated sense of self and others, so that each relationship seems to produce a different person.",
    who: "Otto Kernberg", src: "Identity diffusion — Borderline Conditions and Pathological Narcissism (1975)" },
  { t: "Kernberg argued that mature love integrates tenderness with aggression and desire. Love that has no room for ambivalence tends not to last.",
    who: "Otto Kernberg", src: "Love Relations: Normality and Pathology (1995)" },
  { t: "Adler thought feelings of inferiority are universal and drive human striving. They become a problem only when they harden into an inferiority complex.",
    who: "Alfred Adler", src: "The inferiority feeling — Understanding Human Nature (1927)" },
  { t: "Adler made social interest, a feeling of community and concern for others, the measure of psychological health.",
    who: "Alfred Adler", src: "Social interest — What Life Should Mean to You (1931)" },
  { t: "Adler named three tasks of life: occupation, friendship and love. Each, he thought, is a test of social interest.",
    who: "Alfred Adler", src: "The three life tasks — What Life Should Mean to You (1931)" },
  { t: "Adler noticed that birth order shapes children’s roles in the family. Siblings grow up in different families, even under the same roof.",
    who: "Alfred Adler", src: "Birth order — Understanding Human Nature (1927)" },
  { t: "Adler’s style of life is the characteristic way a person approaches life’s problems, formed early in childhood. It can change, but rarely without being noticed first.",
    who: "Alfred Adler", src: "Style of life — Understanding Human Nature (1927)" },
  { t: "Reich described character armour: chronic attitudes, often held in the body, that protect against anxiety. The defences are visible in posture and voice.",
    who: "Wilhelm Reich", src: "Character armour — Character Analysis (1933)" },
  { t: "Reich argued that how a patient speaks, their manner and tone, reveals as much as what they say. The form of resistance is itself a message.",
    who: "Wilhelm Reich", src: "Character Analysis (1933)" },
  { t: "Riviere suggested that womanliness can be worn as a masquerade, to avert retaliation for having claimed power or success. She also asked whether genuine womanliness and the masquerade differ at all.",
    who: "Joan Riviere", src: "“Womanliness as a Masquerade” (1929)" },
  { t: "Riviere described the negative therapeutic reaction: patients who get worse when helped, because improvement feels like abandoning damaged inner figures they feel responsible for.",
    who: "Joan Riviere", src: "“A Contribution to the Analysis of the Negative Therapeutic Reaction” (1936)" },
  { t: "In A Life of One’s Own, Milner kept a diary to discover what actually made her happy, and found it was often not what she’d assumed.",
    who: "Marion Milner", src: "A Life of One’s Own (1934, as Joanna Field)" },
  { t: "Milner found that widening her attention, rather than narrowing it on a goal, made experience richer. Concentration has more than one shape.",
    who: "Marion Milner", src: "Wide attention — A Life of One’s Own (1934, as Joanna Field)" },
  { t: "In On Not Being Able to Paint, Milner found she could only draw freely once she stopped trying to control the result. Creativity, she thought, requires a tolerance of not knowing.",
    who: "Marion Milner", src: "On Not Being Able to Paint (1950)" },
  { t: "In The Hands of the Living God, Milner describes a long analysis carried largely through the patient’s drawings. Some things can be shown before they can be said.",
    who: "Marion Milner", src: "The Hands of the Living God (1969)" },
  { t: "Milner drew attention to the frame: the boundary that marks off a picture, a play or a session from ordinary life, and makes a different kind of experience possible.",
    who: "Marion Milner", src: "The frame — “The Role of Illusion in Symbol Formation” (1952)" },
  { t: "Segal described the symbolic equation, in which the symbol is felt to be the thing itself rather than standing for it. Being able to symbolise is what lets us think about loss.",
    who: "Hanna Segal", src: "The symbolic equation — “Notes on Symbol Formation” (1957)" },
  { t: "Segal argued that artistic creation involves recreating a lost, loved world, and that aesthetic pleasure comes from that work of mourning.",
    who: "Hanna Segal", src: "“A Psycho-Analytical Approach to Aesthetics” (1952)" },
  { t: "Betty Joseph described an addiction to near-death: a compulsive pull towards despair and self-destruction that has become a source of secret satisfaction.",
    who: "Betty Joseph", src: "“Addiction to Near-Death” (1982)" },
  { t: "Joseph showed how patients maintain their psychic equilibrium by drawing others into familiar patterns, often without anyone noticing it’s happening.",
    who: "Betty Joseph", src: "Psychic Equilibrium and Psychic Change (1989)" },
  { t: "Rosenfeld described destructive narcissism as organised like a gang inside the personality, promising protection in return for rejecting dependence and help.",
    who: "Herbert Rosenfeld", src: "Destructive narcissism — “A Clinical Approach to the Psychoanalytic Theory of the Life and Death Instincts” (1971)" },
  { t: "Steiner described psychic retreats: inner states that offer relief from anxiety, at the cost of contact with reality and growth.",
    who: "John Steiner", src: "Psychic Retreats (1993)" },
  { t: "Steiner explores how shame, the experience of being seen, can block development, and how being seen with understanding can release it.",
    who: "John Steiner", src: "Seeing and Being Seen (2011)" },
  { t: "Symington defined narcissism as the turning away from what he called the lifegiver: refusing what could sustain us because it comes from outside.",
    who: "Neville Symington", src: "The lifegiver — Narcissism: A New Theory (1993)" },
  { t: "Alice Miller described gifted children who learn early to sense and meet their parents’ needs, and in doing so lose touch with their own feelings.",
    who: "Alice Miller", src: "The Drama of the Gifted Child (1979)" },
  { t: "Miller understood much depression as grief for the self one was never allowed to be, and as the price of having adapted too well.",
    who: "Alice Miller", src: "Depression as grief — The Drama of the Gifted Child (1979)" },
  { t: "In For Your Own Good, Miller examined how cruelty to children can be justified as education. She asked readers to listen closely to what is done ‘for their own good’.",
    who: "Alice Miller", src: "For Your Own Good (1980)" },
  { t: "Hartmann wrote of the ‘average expectable environment’ a child needs. Not ideal conditions. Ordinary, adequate ones.",
    who: "Heinz Hartmann", src: "The average expectable environment — Ego Psychology and the Problem of Adaptation (1939)" },
  { t: "Mahler described the psychological birth of the infant as a gradual process of separation and individuation, quite distinct from biological birth.",
    who: "Margaret Mahler", src: "The Psychological Birth of the Human Infant (1975)" },
  { t: "In Mahler’s rapprochement phase, the toddler explores, discovers its separateness and returns anxiously for reassurance. The pattern recurs whenever we take a new step.",
    who: "Margaret Mahler", src: "Rapprochement — The Psychological Birth of the Human Infant (1975)" },
  { t: "Mahler saw separation and individuation as twin processes: becoming separate and becoming oneself. Neither works without the other.",
    who: "Margaret Mahler", src: "Separation-individuation — The Psychological Birth of the Human Infant (1975)" },
  { t: "Helene Deutsch described the ‘as-if’ personality: people who seem normal and adapt to any setting, but lack genuine emotional connection. The imitation is good. The feeling is missing.",
    who: "Helene Deutsch", src: "The ‘as-if’ personality — “Some Forms of Emotional Disturbance and Their Relationship to Schizophrenia” (1942)" },
  { t: "Chodorow argued that because women do most early caring, girls and boys develop different relational capacities, and that the pattern reproduces itself.",
    who: "Nancy Chodorow", src: "The Reproduction of Mothering (1978)" },
  { t: "Juliet Mitchell argued that psychoanalysis neglected siblings, focusing on parents. Sibling rivalry and love, she thought, shape us laterally, in ways vertical theories miss.",
    who: "Juliet Mitchell", src: "Siblings (2003)" },
  { t: "In The New Black, Darian Leader argues that we have medicalised grief as depression and lost the cultural forms that once helped people mourn.",
    who: "Darian Leader", src: "The New Black (2008)" },
  { t: "Leader examines the letters people write and never post. Writing to someone can be a way of addressing something in oneself.",
    who: "Darian Leader", src: "Why Do Women Write More Letters Than They Post? (1996)" },
  { t: "Leader distinguishes being mad from going mad: madness can be quiet and stable, and the crisis is often a breakdown of what was holding it together.",
    who: "Darian Leader", src: "What Is Madness? (2011)" },
  { t: "In Why Can’t We Sleep?, Leader suggests insomnia is often more than a biological problem: it can express what a person is unable to put into words.",
    who: "Darian Leader", src: "Why Can’t We Sleep? (2019)" },
  { t: "Stephen Grosz notes that praising children for being clever can make them more afraid of failure. Praise for effort leaves more room to try.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "Grosz writes that people often resist change because change involves loss. Staying stuck can be a way of not giving something up.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "Grosz suggests that the stories we tell about ourselves can conceal other stories. The story you tell most often may be covering for one you can’t yet tell.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "Josh Cohen argues that inertia isn’t simply laziness. Doing nothing can be a protest against relentless demands to perform.",
    who: "Josh Cohen", src: "Not Working: Why We Have to Stop (2018)" },
  { t: "Cohen describes burnout as a kind of exhausted desire: not merely being tired, but no longer being able to want.",
    who: "Josh Cohen", src: "Burnout — Not Working: Why We Have to Stop (2018)" },
  { t: "Esther Bick described the ‘second skin’: babies without enough holding develop muscular tension or constant activity to hold themselves together. Adults sometimes use busyness the same way.",
    who: "Esther Bick", src: "The second skin — “The Experience of the Skin in Early Object-Relations” (1968)" },
  { t: "Guntrip described a regressed, withdrawn part of the self that has retreated from a world experienced as too much. It isn’t absent. It’s in hiding.",
    who: "Harry Guntrip", src: "Schizoid Phenomena, Object-Relations and the Self (1968)" },
  { t: "Groddeck argued that we are ‘lived’ by the It, unknown forces that shape our lives and bodies. Freud adapted the term as the id.",
    who: "Georg Groddeck", src: "The Book of the It (1923)" },
  { t: "Theodor Reik wrote of listening with the third ear: attending to what’s unsaid, and to one’s own inner responses, as well as to the words.",
    who: "Theodor Reik", src: "Listening with the Third Ear (1948)" },
  { t: "Reik treated surprise as a sign of reaching unconscious truth. The thought that startles you is often the one worth keeping.",
    who: "Theodor Reik", src: "Surprise — Listening with the Third Ear (1948)" },
  { t: "Loewald wrote that analysis turns ghosts into ancestors: the past is laid to rest so that it can be lived with rather than haunted by.",
    who: "Hans Loewald", src: "Ghosts into ancestors — “On the Therapeutic Action of Psycho-Analysis” (1960)" },
  { t: "Loewald argued that growing up involves taking over parental authority, a kind of symbolic parricide, and that this is how we come to be responsible for ourselves.",
    who: "Hans Loewald", src: "“The Waning of the Oedipus Complex” (1979)" },
  { t: "Loewald saw the analyst as holding a picture of the patient’s potential, a version of them a little further along, which the patient can grow into.",
    who: "Hans Loewald", src: "“On the Therapeutic Action of Psycho-Analysis” (1960)" },
  { t: "In ‘Ghosts in the Nursery’, Fraiberg found that parents who could remember and feel their own childhood pain were less likely to repeat it with their children.",
    who: "Selma Fraiberg", src: "“Ghosts in the Nursery” (1975)" },
  { t: "Fonagy describes mentalization: understanding behaviour in terms of mental states, one’s own and others’. Many conflicts begin when it breaks down.",
    who: "Peter Fonagy", src: "Mentalization — Affect Regulation, Mentalization, and the Development of the Self (2002)" },
  { t: "Fonagy and Allison describe epistemic trust: the capacity to trust others as sources of knowledge about the world and oneself. Without it, nothing anyone says can help.",
    who: "Peter Fonagy", src: "Epistemic trust — “The Role of Mentalizing and Epistemic Trust in the Therapeutic Relationship” (2014, with Elizabeth Allison)" },
  { t: "Sandler proposed that we seek a ‘background of safety’, a feeling-state that underlies everyday life, and that much behaviour aims to maintain it.",
    who: "Joseph Sandler", src: "“The Background of Safety” (1960)" },
  { t: "Schafer proposed an action language: saying ‘I am anxious about it’ rather than ‘anxiety overwhelms me’, to restore a sense of agency over our own experience.",
    who: "Roy Schafer", src: "Action language — A New Language for Psychoanalysis (1976)" },
  { t: "In Retelling a Life, Schafer described analysis as the construction of a new narrative, a different way of telling the same life.",
    who: "Roy Schafer", src: "Retelling a Life (1992)" },
  { t: "Spence distinguished narrative truth from historical truth, arguing that a coherent and convincing account can heal even when we can’t know exactly what happened.",
    who: "Donald Spence", src: "Narrative Truth and Historical Truth (1982)" },
  { t: "In Radical Hope, Jonathan Lear considers hope that remains when a way of life has collapsed: hope for a good one cannot yet understand.",
    who: "Jonathan Lear", src: "Radical Hope (2006)" },
  { t: "Lear argues that our ideas of a happy life always leave a remainder, something that doesn’t fit, and that this disruption belongs to the mind rather than being a fault in it.",
    who: "Jonathan Lear", src: "Happiness, Death, and the Remainder of Life (2000)" },
  { t: "In Open Minded, Lear argues that Freud’s achievement was to show that the mind is not transparent to itself. Self-knowledge is always partial.",
    who: "Jonathan Lear", src: "Open Minded (1998)" },
  { t: "In Toxic Nourishment, Michael Eigen writes about how the same people and situations that sustain us can also poison us, and how hard that is to separate.",
    who: "Michael Eigen", src: "Toxic Nourishment (1999)" },
  { t: "Meltzer described aesthetic conflict: the infant’s overwhelming experience of the beauty of the mother, and uncertainty about what lies inside her. Beauty and doubt arrive together.",
    who: "Donald Meltzer", src: "Aesthetic conflict — The Apprehension of Beauty (1988)" },
  { t: "McDougall described an inner theatre in which old scenes are restaged with new actors. Knowing the script makes it possible to change it.",
    who: "Joyce McDougall", src: "Theaters of the Mind (1985)" },
  { t: "McDougall found that when emotions can’t be represented in words, they may be expressed through the body instead. Some symptoms are feelings without language.",
    who: "Joyce McDougall", src: "Theaters of the Body (1989)" },
  { t: "Anzieu proposed the skin-ego: the ego modelled on the skin, as a surface that contains, protects and communicates. A sense of self begins at the boundary.",
    who: "Didier Anzieu", src: "The Skin-Ego (1985)" },
  { t: "Spielrein argued that the sexual drive contains a destructive component: creation involves the dissolution of something old. Change always costs something.",
    who: "Sabina Spielrein", src: "“Destruction as the Cause of Coming into Being” (1912)" },
  { t: "Ghent distinguished surrender, a letting go of defences in order to be known, from submission, a giving in to another’s power. One expands the self. The other diminishes it.",
    who: "Emmanuel Ghent", src: "“Masochism, Submission, Surrender” (1990)" },
  { t: "Hoffman argued that therapy depends on a tension between ritual, the stable frame, and spontaneity, the genuine personal response. Too much of either loses something.",
    who: "Irwin Z. Hoffman", src: "Ritual and Spontaneity in the Psychoanalytic Process (1998)" },
  { t: "Žižek argues that fantasy doesn’t simply fulfil desire. It teaches us how to desire, and what to want.",
    who: "Slavoj Žižek", src: "Fantasy — The Plague of Fantasies (1997)" },
  { t: "Žižek describes cynical ideology: ‘they know very well what they are doing, but still, they are doing it.’ Seeing through something isn’t the same as being free of it.",
    who: "Slavoj Žižek", src: "Cynical reason — The Sublime Object of Ideology (1989)" },
  { t: "Bruce Fink explains the Lacanian practice of ending sessions on a significant word or slip, to leave the patient with it. Where you stop shapes what is heard.",
    who: "Bruce Fink", src: "A Clinical Introduction to Lacanian Psychoanalysis (1997)" },
  { t: "Jacobson described how images of the self and images of others develop together. A change in one tends to bring a change in the other.",
    who: "Edith Jacobson", src: "The Self and the Object World (1964)" },
  { t: "Karl Abraham linked mourning to taking the lost person inside: the mourner preserves them by incorporating them. Their phrases and habits may become yours.",
    who: "Karl Abraham", src: "“A Short Study of the Development of the Libido” (1924)" },
  { t: "Stolorow argues that painful feelings become traumatic when there is no relational home in which they can be held and understood.",
    who: "Robert Stolorow", src: "Trauma and Human Existence (2007)" },
  { t: "Verhaeghe argues that a society built on competition and performance shapes identities marked by anxiety and isolation. Some personal distress is social in origin.",
    who: "Paul Verhaeghe", src: "What About Me? (2012)" },
];

const bubble = document.getElementById('bubble');
const byline = document.getElementById('byline');
const snowman = document.getElementById('snowman');
const countEl = document.getElementById('count');
let deck = [], n = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function next() {
  if (!deck.length) deck = shuffle(ADVICE.slice());
  return deck.pop();
}
function speak() {
  const a = next();
  n++;
  bubble.classList.remove('fresh'); void bubble.offsetWidth; bubble.classList.add('fresh');
  bubble.innerHTML = '';
  const p = document.createElement('p'); p.textContent = '“' + a.t + '”'; bubble.appendChild(p);
  byline.querySelector('.who').textContent = a.who;
  byline.querySelector('.src').textContent = a.src;
  countEl.textContent = 'Session ' + n;
  snowman.classList.remove('wobble'); void snowman.offsetWidth; snowman.classList.add('wobble');
}
snowman.addEventListener('click', speak);
document.getElementById('again').addEventListener('click', speak);

document.getElementById('issue').textContent =
  new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });

// Gentle snowfall
const c = document.getElementById('snowfall'), ctx = c.getContext('2d');
let flakes = [];
function size() {
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  const count = Math.min(140, Math.floor(innerWidth / 8));
  flakes = Array.from({ length: count }, () => ({
    x: Math.random() * c.width, y: Math.random() * c.height,
    r: (Math.random() * 2 + 0.8) * devicePixelRatio, s: Math.random() * 0.6 + 0.3, d: Math.random() * Math.PI * 2
  }));
}
function tick() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const f of flakes) {
    f.y += f.s * devicePixelRatio; f.d += 0.01; f.x += Math.sin(f.d) * 0.4 * devicePixelRatio;
    if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(tick);
}
addEventListener('resize', size);
size();
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
</script>
