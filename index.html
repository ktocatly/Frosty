<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frosty Says</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe3;
    --paper-edge: #e6dcc6;
    --ink: #2a2622;
    --ink-soft: #6b6157;
    --rule: #2a2622;
    --night: #1d2a44;
    --night-2: #34476b;
    --snow: #fbfaf6;
    --scarf: #3f6b4e;
    --scarf-2: #2c4f39;
    --hat: #2f3a34;
    --nose: #e07a2e;
    --bubble: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    background-image: radial-gradient(ellipse at top, var(--night-2), var(--night) 70%);
    min-height: 100vh;
    font-family: "Libre Baskerville", Georgia, serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
  }
  #snowfall { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .column {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(180,160,120,.12), transparent 50%);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    padding: 28px 28px 22px;
    transform: rotate(-0.4deg);
  }

  /* Masthead */
  .meta {
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
    border-top: 3px double var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 6px 0;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900;
    font-size: clamp(44px, 12vw, 72px);
    line-height: .95;
    text-align: center;
    margin: 14px 0 4px;
    letter-spacing: -.01em;
  }
  .dek {
    text-align: center;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  /* Stage */
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; }

  .bubble {
    position: relative;
    width: 100%;
    min-height: 132px;
    background: var(--bubble);
    border: 2px solid var(--ink);
    border-radius: 22px;
    padding: 18px 20px;
    margin: 6px 0 18px;
    font-size: 16px;
    line-height: 1.6;
    box-shadow: 4px 4px 0 rgba(42,38,34,.15);
    display: flex; align-items: center;
  }
  .bubble::after, .bubble::before {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    border-style: solid;
  }
  .bubble::before { bottom: -18px; border-width: 18px 14px 0 14px; border-color: var(--ink) transparent transparent; }
  .bubble::after  { bottom: -14px; border-width: 15px 11px 0 11px; border-color: var(--bubble) transparent transparent; }
  .bubble p { margin: 0; }
  .bubble .hint { color: var(--ink-soft); font-style: italic; text-align: center; width: 100%; }
  .bubble.fresh p { animation: inkIn .5s ease both; }
  @keyframes inkIn { from { opacity: 0; filter: blur(3px); transform: translateY(4px); } to { opacity: 1; filter: none; transform: none; } }

  .snowman-btn {
    appearance: none; border: 0; background: none; padding: 0; margin: 0;
    cursor: pointer; width: min(320px, 80vw);
    -webkit-tap-highlight-color: transparent;
  }
  .snowman-btn:focus-visible { outline: 3px dashed var(--scarf); outline-offset: 6px; border-radius: 12px; }
  .snowman-btn img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(0 10px 10px rgba(42,38,34,.22));
    transform-origin: 50% 90%;
    user-select: none; -webkit-user-drag: none;
  }
  .snowman-btn.wobble img { animation: wobble .6s ease; }
  @keyframes wobble {
    0% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-4deg) scale(1.03, .97); }
    45% { transform: rotate(3deg) scale(.98, 1.03); }
    70% { transform: rotate(-1.5deg); }
    100% { transform: rotate(0) scale(1); }
  }

  /* Byline / citation */
  .byline {
    margin-top: 14px;
    border-top: 1px solid var(--rule);
    padding-top: 10px;
    min-height: 66px;
    font-size: 13px;
    line-height: 1.5;
  }
  .byline .label {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .byline .who {
    font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 18px;
  }
  .byline .src { color: var(--ink-soft); font-style: italic; }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 3px double var(--rule);
    margin-top: 12px; padding-top: 8px;
    font-size: 11px; color: var(--ink-soft);
  }
  .footer button {
    font: inherit; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    background: none; border: 1px solid var(--ink-soft); color: var(--ink);
    padding: 5px 10px; cursor: pointer; border-radius: 3px;
  }
  .footer button:hover { background: var(--ink); color: var(--paper); }

  @media (max-width: 420px) {
    .column { padding: 20px 16px 16px; transform: none; }
    .bubble { font-size: 15px; padding: 14px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .snowman-btn.wobble img, .bubble.fresh p { animation: none; }
  }
</style>
</head>
<body>
<canvas id="snowfall" aria-hidden="true"></canvas>

<main class="column">
  <div class="meta"><span>The Winter Gazette</span><span id="issue">Advice Column</span></div>
  <h1>Frosty Says</h1>
  <p class="dek">Your snowman is with you &mdash; tap him anywhere for a word from the unconscious.</p>

  <section class="stage">
    <div class="bubble" id="bubble" aria-live="polite">
      <p class="hint">&ldquo;Go on, poke me. I&rsquo;ve been listening all winter and I have notes.&rdquo;</p>
    </div>

    <button class="snowman-btn" id="snowman" aria-label="Tap the snowman for advice">
      <img src="frosty.webp" alt="Frosty, a plush snowman in a green hat and scarf" width="640" height="835">
    </button>
  </section>

  <section class="byline" id="byline" aria-live="polite">
    <div class="label">Speaking according to</div>
    <div class="who">&hellip;</div>
    <div class="src">Tap the snowman to begin your session.</div>
  </section>

  <div class="footer">
    <span id="count">Session 0</span>
    <button id="again" type="button">Another, please</button>
  </div>
</main>

<script>
const ADVICE = [
  { t: "Freud thought slips of the tongue and forgotten names are rarely accidents. They’re a wish getting past the guard. If you keep forgetting something, it may be worth asking what remembering would cost.",
    who: "Sigmund Freud", src: "On parapraxes — The Psychopathology of Everyday Life (1901)" },
  { t: "What we can’t remember, Freud said, we repeat, as an action rather than a memory, without knowing we’re repeating it. If the same scene keeps happening to you, it may be a memory looking for words.",
    who: "Sigmund Freud", src: "Repetition compulsion — “Remembering, Repeating and Working-Through” (1914)" },
  { t: "Mourning, for Freud, is work: each memory of the person has to be revisited and let go, one at a time. It’s slow because it has to be.",
    who: "Sigmund Freud", src: "The work of mourning — “Mourning and Melancholia” (1917)" },
  { t: "The superego is built from the voices of our parents and their parents before them. Before you obey your inner critic, it’s worth asking whose voice it is.",
    who: "Sigmund Freud", src: "The superego — The Ego and the Id (1923)" },
  { t: "Asked what a healthy person should be able to do, Freud is said to have answered: ‘Lieben und arbeiten’. To love and to work. Not to be happy. Love and work.",
    who: "Sigmund Freud", src: "Lieben und arbeiten, as reported by Erik Erikson" },
  { t: "Klein called it the depressive position: realising that the person you love and the person you hate are the same person. It feels worse than splitting them. It’s also how you grow up.",
    who: "Melanie Klein", src: "The depressive position — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "When someone seems all good or all bad, Klein would say you may be splitting them to keep your feelings manageable. People come in one piece. So do you.",
    who: "Melanie Klein", src: "Splitting — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Envy, for Klein, attacks the good thing precisely because it is good and isn’t ours. Gratitude is the capacity to let a good thing stay good. One spoils; the other keeps.",
    who: "Melanie Klein", src: "Envy and Gratitude (1957)" },
  { t: "Winnicott’s ‘good-enough mother’ fails her baby in small, manageable ways, and the failures are how the baby learns the world isn’t an extension of itself. Perfection would be a disservice.",
    who: "D. W. Winnicott", src: "The good-enough mother — Playing and Reality (1971)" },
  { t: "A False Self, Winnicott wrote, develops to comply with what others need and to protect a True Self that can’t yet risk being seen. Only the True Self can feel real. The False Self can only feel busy.",
    who: "D. W. Winnicott", src: "True and False Self — “Ego Distortion in Terms of True and False Self” (1960)" },
  { t: "Winnicott thought the capacity to be alone begins with being alone in someone’s presence: a child playing quietly while a parent is there and asks nothing. Many adults are still looking for that kind of company.",
    who: "D. W. Winnicott", src: "“The Capacity to Be Alone” (1958)" },
  { t: "‘It is in playing and only in playing that the individual child or adult is able to be creative.’ Winnicott meant it about adults too.",
    who: "D. W. Winnicott", src: "Transitional space — Playing and Reality (1971)" },
  { t: "‘Desire is the desire of the Other.’ Lacan meant that we learn what to want by wondering what others want, and from us in particular. It’s worth asking whose wanting you’re doing.",
    who: "Jacques Lacan", src: "“The Subversion of the Subject and the Dialectic of Desire” (1960)" },
  { t: "In the mirror stage, an infant sees its reflection and takes that unified image for itself, though it feels nothing like unified. Lacan thought the ego is built on that flattering misrecognition. It hasn’t changed much since.",
    who: "Jacques Lacan", src: "“The Mirror Stage as Formative of the I Function” (1949)" },
  { t: "‘The unconscious is structured like a language.’ For Lacan, the slips, puns and odd word choices aren’t noise. They’re where the unconscious does its talking.",
    who: "Jacques Lacan", src: "Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "Jung’s shadow is the part of yourself you’d rather not know about, and it tends to show up in other people. The more someone irritates you, the more likely you’ve found it.",
    who: "Carl Jung", src: "The Shadow — Aion (1951)" },
  { t: "Bion described a mind that can take in another person’s unbearable feelings, hold them and give them back in a form that can be thought about. Most people need someone like that. Some people need to be one.",
    who: "Wilfred Bion", src: "Container and contained — Learning from Experience (1962)" },
  { t: "Bion advised approaching each session ‘without memory and without desire’, so as to meet what’s actually there. It works in conversations too. It’s harder than it sounds.",
    who: "Wilfred Bion", src: "“Notes on Memory and Desire” (1967)" },
  { t: "Kohut spoke of the ‘gleam in the mother’s eye’: being admired is how a young self learns it’s worth something. Needing that isn’t vanity. The question is only where you go to get it.",
    who: "Heinz Kohut", src: "Mirroring selfobjects — The Analysis of the Self (1971)" },
  { t: "Horney called it the tyranny of the should: should be better, should be further along, should never need help. The shoulds belong to an idealised self, and they’ll never be satisfied with the real one.",
    who: "Karen Horney", src: "Neurosis and Human Growth (1950)" },
  { t: "‘Immature love says: I love you because I need you. Mature love says: I need you because I love you.’ Fromm thought love is an art, which means it has to be practised.",
    who: "Erich Fromm", src: "The Art of Loving (1956)" },
  { t: "Freedom is frightening, Fromm argued, so people escape it: into authority, into conformity, into crowds. It’s worth noticing which of your choices you’ve handed to someone else.",
    who: "Erich Fromm", src: "Escape from Freedom (1941)" },
  { t: "Erikson divided life into stages, each with its own crisis to work through. A crisis, in his sense, is a turning point rather than a catastrophe. Feeling unsettled may simply mean you’re between stages.",
    who: "Erik Erikson", src: "Psychosocial stages — Childhood and Society (1950)" },
  { t: "Anna Freud catalogued the ego’s defences: repression, projection, denial and the rest. They were solutions once. The question is whether they’re still solving anything.",
    who: "Anna Freud", src: "The Ego and the Mechanisms of Defence (1936)" },
  { t: "Bowlby argued that seeking closeness when frightened isn’t childishness. It’s a system we’re born with, and it stays active ‘from the cradle to the grave’.",
    who: "John Bowlby", src: "Attachment and Loss, Vol. 1: Attachment (1969)" },
  { t: "Fairbairn noticed that children stay loyal to the parents who hurt them, because a bad tie is better than no tie at all. Adults do it too, with jobs and partners. The knot loosens slowly.",
    who: "W. R. D. Fairbairn", src: "Psychoanalytic Studies of the Personality (1952)" },
  { t: "A child who is hurt by an adult may come to identify with that adult and take their side against themselves. Ferenczi described it first. It made sense then. It doesn’t have to continue.",
    who: "Sándor Ferenczi", src: "Identification with the aggressor — “Confusion of Tongues” (1932)" },
  { t: "Bollas coined ‘the unthought known’: things we know deeply but have never thought, because we learned them before we had words. Some of your strongest hunches come from there.",
    who: "Christopher Bollas", src: "The Shadow of the Object (1987)" },
  { t: "Benjamin argued that real recognition is mutual. When one person only dominates and the other only submits, neither is actually seen. Recognition has to go both ways to count.",
    who: "Jessica Benjamin", src: "The Bonds of Love (1988)" },
  { t: "Phillips writes that we live as much in the lives we didn’t lead as in the one we did. The unlived life is worth mourning a little. It isn’t worth living in.",
    who: "Adam Phillips", src: "Missing Out: In Praise of the Unlived Life (2012)" },
  { t: "Mitchell saw the self as made in relationships, and so multiple: you’re a slightly different person with each person you know. That isn’t inconsistency. It’s how selves are built.",
    who: "Stephen A. Mitchell", src: "Relational Concepts in Psychoanalysis (1988)" },
  { t: "Kristeva wrote that the foreigner is within us: we are, as she put it, strangers to ourselves. Recognising that tends to make other strangers less alarming.",
    who: "Julia Kristeva", src: "Strangers to Ourselves (1988)" },
  { t: "Freud’s central claim about dreams: a dream is the disguised fulfilment of a wish. The disguise is the point. The wish usually isn’t one you’d admit to.",
    who: "Sigmund Freud", src: "Wish fulfilment — The Interpretation of Dreams (1900)" },
  { t: "Freud called dream interpretation ‘the royal road to a knowledge of the unconscious activities of the mind’. Most of us don’t take the road. We just tell people the dream was weird.",
    who: "Sigmund Freud", src: "The royal road — The Interpretation of Dreams (1900)" },
  { t: "In dreams, Freud found, several people or ideas can be condensed into one image. If someone in a dream seems oddly familiar, they may be a composite of people you’d rather not compare.",
    who: "Sigmund Freud", src: "Condensation — The Interpretation of Dreams (1900)" },
  { t: "Freud noticed that dreams borrow trivial details from the previous day, the ‘day residue’, to carry thoughts that aren’t trivial at all.",
    who: "Sigmund Freud", src: "Day residue — The Interpretation of Dreams (1900)" },
  { t: "Freud thought jokes let us express what we’d otherwise suppress: hostility, desire, contempt, slipped past the censor with a laugh. What you find funny says something about what you’re holding back.",
    who: "Sigmund Freud", src: "Jokes and Their Relation to the Unconscious (1905)" },
  { t: "In the Three Essays, Freud argued that adult sexuality has a long childhood history and many detours. Nobody’s tastes arrive fully formed.",
    who: "Sigmund Freud", src: "Three Essays on the Theory of Sexuality (1905)" },
  { t: "‘A happy person never phantasies, only an unsatisfied one,’ Freud wrote. Daydreams are wishes correcting an unsatisfying reality. They tell you what’s missing.",
    who: "Sigmund Freud", src: "“Creative Writers and Day-Dreaming” (1908)" },
  { t: "The reality principle doesn’t abolish pleasure, Freud said. It postpones it, in exchange for getting it more reliably. Waiting is a skill, not a defeat.",
    who: "Sigmund Freud", src: "The reality principle — “Formulations on the Two Principles of Mental Functioning” (1911)" },
  { t: "‘In the last resort we must begin to love in order not to fall ill.’ Freud thought love turned entirely inwards makes people sick.",
    who: "Sigmund Freud", src: "“On Narcissism: An Introduction” (1914)" },
  { t: "Freud said falling in love with your analyst is a repetition of earlier loves, and also, inconveniently, genuine. Most new loves are both new and very old.",
    who: "Sigmund Freud", src: "“Observations on Transference-Love” (1915)" },
  { t: "Freud defined the uncanny as that class of the frightening which leads back to what is known of old and long familiar. What’s eerie is often something we once knew and pushed away.",
    who: "Sigmund Freud", src: "“The Uncanny” (1919)" },
  { t: "Freud watched his grandson throw a toy away and pull it back, saying ‘gone’ and ‘there’, turning being left into a game he controlled. We all rehearse our losses somehow.",
    who: "Sigmund Freud", src: "Fort–da — Beyond the Pleasure Principle (1920)" },
  { t: "In Beyond the Pleasure Principle, Freud proposed a death drive: a pull towards stillness and the end of tension. Not everything in us wants more life.",
    who: "Sigmund Freud", src: "The death drive — Beyond the Pleasure Principle (1920)" },
  { t: "In groups, Freud argued, members put the leader in place of their own conscience, which is why crowds can do what individuals wouldn’t. Worth knowing before you join one.",
    who: "Sigmund Freud", src: "Group Psychology and the Analysis of the Ego (1921)" },
  { t: "Freud compared the ego to a rider on a horse who often has to guide it where it wants to go, and then claims the route as his own choice.",
    who: "Sigmund Freud", src: "The ego as rider — The Ego and the Id (1923)" },
  { t: "Freud noticed that repressed thoughts can surface on condition that they’re denied. ‘It’s not my mother,’ said of a dream figure, is usually a fairly good clue.",
    who: "Sigmund Freud", src: "“Negation” (1925)" },
  { t: "Freud came to see anxiety as a signal: the ego’s warning that a dangerous situation might be coming. It’s worth listening to. It isn’t always right.",
    who: "Sigmund Freud", src: "Signal anxiety — Inhibitions, Symptoms and Anxiety (1926)" },
  { t: "Freud called religious belief an illusion, by which he meant a belief driven by a wish. ‘The voice of the intellect is a soft one,’ he added, ‘but it does not rest till it has gained a hearing.’",
    who: "Sigmund Freud", src: "The Future of an Illusion (1927)" },
  { t: "Humour, Freud wrote, is not resigned but rebellious. It’s the superego, unusually, comforting the ego: look, this is the world that seemed so dangerous. Nothing but a game for children.",
    who: "Sigmund Freud", src: "“Humour” (1927)" },
  { t: "Freud observed that the fiercest hostility is often between neighbours who are nearly alike. He called it the narcissism of minor differences.",
    who: "Sigmund Freud", src: "The narcissism of minor differences — Civilization and Its Discontents (1930)" },
  { t: "‘The intention that man should be happy is not included in the plan of Creation.’ Freud wasn’t being gloomy. He was lowering the bar to where it could be cleared.",
    who: "Sigmund Freud", src: "Civilization and Its Discontents (1930)" },
  { t: "Freud argued that the price of civilisation is a loss of happiness through a heightened sense of guilt. If you feel vaguely guilty for no reason, you may just be civilised.",
    who: "Sigmund Freud", src: "Guilt as the price of civilisation — Civilization and Its Discontents (1930)" },
  { t: "Freud called educating, governing and analysing the impossible professions: you can be sure in advance the results will be unsatisfying. Parenting has a claim to all three.",
    who: "Sigmund Freud", src: "The impossible professions — “Analysis Terminable and Interminable” (1937)" },
  { t: "Freud noticed that some people fall ill precisely when a long-cherished wish comes true. Success can feel forbidden. It helps to know who did the forbidding.",
    who: "Sigmund Freud", src: "“Those Wrecked by Success” (1916)" },
  { t: "Freud recommended ‘evenly suspended attention’: listening without deciding in advance what’s important. It’s good advice for anyone who has to listen to anyone.",
    who: "Sigmund Freud", src: "Evenly suspended attention — “Recommendations to Physicians Practising Psycho-Analysis” (1912)" },
  { t: "Freud wrote that each of us has a stereotype plate, an early pattern of loving that’s reprinted in each new relationship. New people, familiar plot.",
    who: "Sigmund Freud", src: "“The Dynamics of Transference” (1912)" },
  { t: "Freud found that vivid childhood memories of trivial things can be screens for something more significant nearby. What you remember clearly isn’t always what mattered.",
    who: "Sigmund Freud", src: "“Screen Memories” (1899)" },
  { t: "Freud described the family romance: the child’s fantasy of having been born to better, grander parents. It’s a way of coping with discovering your parents are ordinary.",
    who: "Sigmund Freud", src: "“Family Romances” (1909)" },
  { t: "In melancholia, Freud noticed, the self-reproaches often fit someone else, someone loved and lost. ‘The shadow of the object fell upon the ego.’",
    who: "Sigmund Freud", src: "Melancholic self-reproach — “Mourning and Melancholia” (1917)" },
  { t: "Freud wrote that transience doesn’t reduce something’s value. If anything, it raises it: ‘transience value is scarcity value in time’.",
    who: "Sigmund Freud", src: "“On Transience” (1916)" },
  { t: "Freud said the essence of repression is simply turning something away and keeping it at a distance from consciousness. It doesn’t stay there. It returns, often in disguise.",
    who: "Sigmund Freud", src: "The return of the repressed — “Repression” (1915)" },
  { t: "‘At bottom no one believes in his own death,’ Freud wrote. In the unconscious, each of us is convinced of our own immortality. It explains a lot of plans.",
    who: "Sigmund Freud", src: "“Thoughts for the Times on War and Death” (1915)" },
  { t: "Freud compared private rituals to religious ones. He called obsessional neurosis an individual religiosity, and religion a universal obsessional neurosis. Neither side was pleased.",
    who: "Sigmund Freud", src: "“Obsessive Actions and Religious Practices” (1907)" },
  { t: "Freud’s early patient Anna O. called her treatment ‘the talking cure’ and ‘chimney sweeping’. Speaking about something, in detail and out loud, changes it.",
    who: "Sigmund Freud", src: "The talking cure — Studies on Hysteria (1895, with Josef Breuer)" },
  { t: "Freud told a patient that much would be gained if they succeeded in ‘transforming your hysterical misery into common unhappiness’. It’s still a reasonable goal.",
    who: "Sigmund Freud", src: "Common unhappiness — Studies on Hysteria (1895, with Josef Breuer)" },
  { t: "Freud described how the ego can split, holding two incompatible attitudes to reality at once: knowing a thing and refusing to know it. Most people manage this daily.",
    who: "Sigmund Freud", src: "“Splitting of the Ego in the Process of Defence” (1940)" },
  { t: "In Totem and Taboo, Freud argued that taboos grow out of ambivalence: we forbid most strictly what we’re most tempted to do.",
    who: "Sigmund Freud", src: "Totem and Taboo (1913)" },
  { t: "In ‘A Child Is Being Beaten’, Freud showed how a single fantasy can disguise several wishes, and quietly change who it’s about. Fantasies are rarely about what they seem to be about.",
    who: "Sigmund Freud", src: "“A Child Is Being Beaten” (1919)" },
  { t: "Freud wrote that unconscious processes are timeless: they aren’t ordered in time or altered by its passage. An old hurt can feel as fresh as the day it happened.",
    who: "Sigmund Freud", src: "Timelessness — “The Unconscious” (1915)" },
  { t: "Winnicott listed reasons a mother hates her baby, from the start, while loving it. He thought acknowledging hate made love more honest. The same is true for any close relationship.",
    who: "D. W. Winnicott", src: "“Hate in the Counter-Transference” (1949)" },
  { t: "Winnicott warned that sentimentality is no use to children, because it denies the hate that is also there. A love that can admit its own anger is more trustworthy.",
    who: "D. W. Winnicott", src: "Sentimentality — “Hate in the Counter-Transference” (1949)" },
  { t: "Winnicott’s transitional object, the blanket or bear, is the child’s first ‘not-me’ possession. It belongs neither wholly inside nor outside, and he thought culture grows from that same in-between place.",
    who: "D. W. Winnicott", src: "“Transitional Objects and Transitional Phenomena” (1953)" },
  { t: "Of the transitional object, Winnicott said we must never ask the child: did you create this, or did you find it? The question isn’t to be formulated. Some things should be allowed to be both.",
    who: "D. W. Winnicott", src: "The paradox of the transitional object — Playing and Reality (1971)" },
  { t: "Winnicott argued that people become real to us only after we’ve attacked them in phantasy and they’ve survived without retaliating. Survival is what makes the relationship usable.",
    who: "D. W. Winnicott", src: "“The Use of an Object” (1969)" },
  { t: "Winnicott imagined the subject saying to the object: ‘Hullo object! I destroyed you. I love you.’ The object’s survival is what makes the love possible.",
    who: "D. W. Winnicott", src: "“The Use of an Object” (1969)" },
  { t: "In ‘Fear of Breakdown’, Winnicott suggested the breakdown a person fears has already happened, early, before there was a self able to experience it. The dread points backwards.",
    who: "D. W. Winnicott", src: "“Fear of Breakdown” (1974)" },
  { t: "Winnicott asked what a baby sees when it looks at its mother’s face. Ordinarily, he said, it sees itself. If the face only reflects her own mood, the baby learns to watch rather than be seen.",
    who: "D. W. Winnicott", src: "“Mirror-role of Mother and Family in Child Development” (1967)" },
  { t: "Winnicott called it the capacity for concern: guilt that can do something, through repair, rather than simply suffer. It’s a developmental achievement, not a default.",
    who: "D. W. Winnicott", src: "“The Development of the Capacity for Concern” (1963)" },
  { t: "‘It is a joy to be hidden, and disaster not to be found.’ Winnicott thought everyone has a core that should never be communicated, and also needs, at times, to be found.",
    who: "D. W. Winnicott", src: "“Communicating and Not Communicating” (1963)" },
  { t: "Winnicott saw the antisocial tendency, stealing or destructiveness, as a sign of hope: the child is trying to reclaim something good that was lost. It’s a demand, not just a crime.",
    who: "D. W. Winnicott", src: "“The Antisocial Tendency” (1956)" },
  { t: "Winnicott described primary maternal preoccupation: a heightened, almost illness-like state in which a new mother becomes attuned to her baby. Ordinary devotion, he thought, is extraordinary.",
    who: "D. W. Winnicott", src: "“Primary Maternal Preoccupation” (1956)" },
  { t: "For Winnicott, holding means more than arms. It’s an environment reliable enough that someone can fall apart and come back together without disaster.",
    who: "D. W. Winnicott", src: "Holding — “The Theory of the Parent–Infant Relationship” (1960)" },
  { t: "‘There is no such thing as a baby,’ Winnicott said. There is only a baby and someone caring for it. None of us is quite as separate as we think.",
    who: "D. W. Winnicott", src: "“There is no such thing as a baby” — “Anxiety Associated with Insecurity” (1952)" },
  { t: "Winnicott thought aggression is close to being alive: early on it’s simply motility, the way a baby discovers that the world is out there and pushes back.",
    who: "D. W. Winnicott", src: "“Aggression in Relation to Emotional Development” (1950)" },
  { t: "Winnicott located cultural experience, art, religion, play, in the same intermediate area as the child’s blanket: neither purely inner nor outer. Taking it seriously is not childish.",
    who: "D. W. Winnicott", src: "“The Location of Cultural Experience” (1967)" },
  { t: "For Winnicott, living creatively meant approaching ordinary life as your own rather than merely complying with it. It doesn’t require talent. It requires feeling that life is real.",
    who: "D. W. Winnicott", src: "“Living Creatively” (1970)" },
  { t: "Winnicott observed that health is more difficult to deal with than illness. Illness comes with explanations. Health leaves you with your own life to live.",
    who: "D. W. Winnicott", src: "“The Concept of a Healthy Individual” (1967)" },
  { t: "In the squiggle game, Winnicott drew a line and the child turned it into something, then they swapped. Understanding someone is often a matter of finishing each other’s lines.",
    who: "D. W. Winnicott", src: "The squiggle game — Therapeutic Consultations in Child Psychiatry (1971)" },
  { t: "Winnicott distinguished unintegration from disintegration. Being unintegrated, relaxed and in pieces, is restful when someone reliable is around. It’s only frightening when no one is.",
    who: "D. W. Winnicott", src: "Unintegration — “Ego Integration in Child Development” (1962)" },
  { t: "Winnicott’s facilitating environment doesn’t make someone grow. It allows the growth that’s already trying to happen.",
    who: "D. W. Winnicott", src: "The holding environment — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "Winnicott described impingement: the world intruding before a baby is ready, so that it has to react instead of simply being. Some adults have been reacting ever since.",
    who: "D. W. Winnicott", src: "Impingement — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "Winnicott called the infant’s basic continuity of existence ‘going-on-being’. When it’s interrupted too often, a person learns to survive rather than to live.",
    who: "D. W. Winnicott", src: "Going-on-being — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "In ‘Love, Guilt and Reparation’, Klein argued that the urge to repair what we feel we’ve damaged is one of the deepest sources of love. Apology is the start of it, not all of it.",
    who: "Melanie Klein", src: "Love, Guilt and Reparation (1937)" },
  { t: "Klein’s paranoid-schizoid position is a state in which the world feels split into good and persecuting parts. Everyone returns to it under stress. It isn’t a place to stay.",
    who: "Melanie Klein", src: "The paranoid-schizoid position — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "In projective identification, Klein described how we put unwanted parts of ourselves into someone else, and then relate to them as if those parts were theirs. It can be strangely convincing for both people.",
    who: "Melanie Klein", src: "Projective identification — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Klein described the manic defence against loss: triumph, contempt and control, anything but grief. It looks like coping. It postpones it.",
    who: "Melanie Klein", src: "The manic defence — “A Contribution to the Psychogenesis of Manic-Depressive States” (1935)" },
  { t: "Klein distinguished greed, which wants everything regardless of what the source can give, from gratitude, which is satisfied by what is given. One empties; the other fills.",
    who: "Melanie Klein", src: "Greed — Envy and Gratitude (1957)" },
  { t: "In her last paper, Klein wrote that a certain loneliness persists however loved we are: a longing for a perfect understanding that words can’t supply. It’s part of having an inner world.",
    who: "Melanie Klein", src: "“On the Sense of Loneliness” (1963)" },
  { t: "Klein thought adult relationships, institutions and quarrels bear the marks of infancy’s earliest anxieties. The nursery isn’t left behind. It’s furnished over.",
    who: "Melanie Klein", src: "“Our Adult World and Its Roots in Infancy” (1959)" },
  { t: "Klein treated children’s play as the equivalent of free association: what children do with toys tells you what they can’t yet say. Adults play too. They just call it something else.",
    who: "Melanie Klein", src: "“The Psycho-Analytic Play Technique” (1955)" },
  { t: "Klein described how we can identify with someone so thoroughly, through projection, that we lose track of where we end and they begin. Closeness and confusion can look the same.",
    who: "Melanie Klein", src: "“On Identification” (1955)" },
  { t: "In the depressive position, Klein said, guilt arises from realising we’ve attacked, in phantasy, someone we love. That guilt is painful, but it’s the beginning of concern.",
    who: "Melanie Klein", src: "Depressive guilt — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "Klein thought we carry internal versions of the people who mattered to us, and they go on shaping how we feel long after the real people are gone.",
    who: "Melanie Klein", src: "Internal objects — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "Idealisation, for Klein, is a defence: the idealised figure is kept wholly good to protect it from our own hostility. The fall, when it comes, is proportionate.",
    who: "Melanie Klein", src: "Idealisation — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Klein suggested that the impulse to create grows from the wish to restore what we fear we’ve destroyed. Making something can be a form of repair.",
    who: "Melanie Klein", src: "Reparation and creativity — “Infantile Anxiety Situations Reflected in a Work of Art” (1929)" },
  { t: "Klein wrote that every new grief reactivates the earliest losses. A small loss can bring an unexpectedly large sorrow, because it isn’t only about itself.",
    who: "Melanie Klein", src: "Revived losses — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "Klein linked children’s urge to know with their anxieties about what goes on inside the mother’s body, and inside their own. Curiosity has always had a frightened side.",
    who: "Melanie Klein", src: "The epistemophilic impulse — “Early Stages of the Oedipus Conflict” (1928)" },
  { t: "For Klein, unconscious phantasy underlies all experience: an inner story running beneath perception and thought. You don’t stop having one. You just stop noticing it.",
    who: "Melanie Klein", src: "Unconscious phantasy — “The Psycho-Analytic Play Technique” (1955)" },
  { t: "‘The only thing one can be guilty of is having given ground relative to one’s desire.’ Lacan didn’t mean do whatever you like. He meant don’t betray what you actually want.",
    who: "Jacques Lacan", src: "Not giving ground on desire — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "‘There is no sexual relationship,’ Lacan said: no perfect complementarity between two people. Love is what makes up for its absence.",
    who: "Jacques Lacan", src: "“There is no sexual relationship” — Seminar XX: Encore (1972–73)" },
  { t: "Lacan said anxiety is ‘not without an object’, and that it’s the one affect that does not deceive. When everything else is lying to you, anxiety probably isn’t.",
    who: "Jacques Lacan", src: "Seminar X: Anxiety (1962–63)" },
  { t: "Lacan argued that anxiety arises not from lack but from the lack of lack: when there’s no space left, when the other is too close and wants too much.",
    who: "Jacques Lacan", src: "Seminar X: Anxiety (1962–63)" },
  { t: "‘Love is giving what you don’t have.’ For Lacan, to love is to offer your own lack, not your possessions. Gifts are easier.",
    who: "Jacques Lacan", src: "Love as giving what you don’t have — Seminar VIII: Transference (1960–61)" },
  { t: "Lacan closed his seminar on Poe’s story with the claim that a letter always arrives at its destination. What’s been sent will be received, even if it takes the long way round.",
    who: "Jacques Lacan", src: "“Seminar on ‘The Purloined Letter’” (1956)" },
  { t: "Lacan called the object-cause of desire objet petit a: the elusive something that makes an object desirable and is never quite in it. That’s why getting what you wanted can feel strangely empty.",
    who: "Jacques Lacan", src: "Objet petit a — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "Lacan described the unconscious as ‘the discourse of the Other’: what speaks through us comes from outside us, in words we inherited.",
    who: "Jacques Lacan", src: "“The Function and Field of Speech and Language in Psychoanalysis” (1953)" },
  { t: "‘I think where I am not, therefore I am where I do not think.’ For Lacan, the self you’re conscious of isn’t where the truth of you is spoken.",
    who: "Jacques Lacan", src: "“The Instance of the Letter in the Unconscious” (1957)" },
  { t: "Lacan located rivalry in the imaginary: we compete with others as images of ourselves. The rival is often a mirror you’d rather not stand in front of.",
    who: "Jacques Lacan", src: "Imaginary rivalry — Seminar II: The Ego in Freud’s Theory (1954–55)" },
  { t: "‘There is no Other of the Other,’ Lacan wrote. No final guarantee stands behind the rules. Everyone is improvising more than they let on.",
    who: "Jacques Lacan", src: "The Other has no Other — “The Subversion of the Subject and the Dialectic of Desire” (1960)" },
  { t: "For Lacan, a symptom is a message addressed to someone, in a language the sender doesn’t understand. It persists until it’s read.",
    who: "Jacques Lacan", src: "The symptom as message — “The Function and Field of Speech and Language in Psychoanalysis” (1953)" },
  { t: "Lacan’s jouissance is enjoyment that goes beyond pleasure into something painful, and keeps us coming back. Not everything we repeat is because we like it.",
    who: "Jacques Lacan", src: "Jouissance — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "For Lacan, the gaze isn’t our looking but the sense of being looked at from a point we can’t see. It’s why a room can feel watchful when it’s empty.",
    who: "Jacques Lacan", src: "The gaze — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "Lacan’s Name-of-the-Father is the function that brings law and limit into a child’s world. Without some limit, he thought, nothing holds its meaning.",
    who: "Jacques Lacan", src: "The Name-of-the-Father — Seminar III: The Psychoses (1955–56)" },
  { t: "Lacan described repetition as a missed encounter with the real: we keep returning to the place where something happened that we couldn’t take in.",
    who: "Jacques Lacan", src: "Repetition and the missed encounter — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "Lacan called the analyst ‘the subject supposed to know’. The analysis works because we suppose someone knows, not because they do.",
    who: "Jacques Lacan", src: "The subject supposed to know — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "Lacan’s das Ding is the lost Thing at the centre of desire, never actually possessed, always circled. Desire keeps its distance from what it wants.",
    who: "Jacques Lacan", src: "Das Ding — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "Late in his work Lacan wrote of the sinthome: the particular knot that holds a person together. He read James Joyce’s writing as one. The cure isn’t removing it but knowing how to use it.",
    who: "Jacques Lacan", src: "The sinthome — Seminar XXIII: The Sinthome (1975–76)" },
  { t: "Jung described the persona as a compromise between the individual and society about what someone should appear to be. It’s useful. It isn’t who you are.",
    who: "Carl Jung", src: "The persona — “The Relations between the Ego and the Unconscious” (1928)" },
  { t: "Jung distinguished introverts, oriented to inner experience, from extraverts, oriented to the outer world. Neither is a flaw. Each tends to undervalue the other.",
    who: "Carl Jung", src: "Psychological Types (1921)" },
  { t: "‘We cannot live the afternoon of life according to the programme of life’s morning,’ Jung wrote. What was true in the morning may be a lie by evening.",
    who: "Carl Jung", src: "“The Stages of Life” (1930)" },
  { t: "In middle age, during a crisis, Jung built small stone villages by the lake like a child, and found it put him back in touch with himself. Play isn’t only for children.",
    who: "Carl Jung", src: "Memories, Dreams, Reflections (1962)" },
  { t: "Jung proposed synchronicity, meaningful coincidence without a causal link. He took such moments seriously as psychological events, whatever they mean about the world.",
    who: "Carl Jung", src: "“Synchronicity: An Acausal Connecting Principle” (1952)" },
  { t: "Jung’s transcendent function is what emerges when conscious and unconscious attitudes are held in tension until a third position appears. Neither side wins. Something new arrives.",
    who: "Carl Jung", src: "“The Transcendent Function” (1916)" },
  { t: "Jung believed we inherit archetypes, typical patterns like the hero, the mother, the trickster, which shape how we experience our own lives. You’re living an old story, in your own way.",
    who: "Carl Jung", src: "Archetypes — The Archetypes and the Collective Unconscious (1959)" },
  { t: "Jung saw the child archetype as a symbol of future possibility, of what’s not yet formed in us. It’s also, he noted, vulnerable and easily abandoned.",
    who: "Carl Jung", src: "“The Psychology of the Child Archetype” (1940)" },
  { t: "Jung’s anima and animus are the contrasexual images within us, often encountered first in someone we fall for. Projection is how we first meet what we haven’t yet integrated.",
    who: "Carl Jung", src: "Anima and animus — Aion (1951)" },
  { t: "For Jung, individuation is becoming who one is: not perfect, but whole, which means including what one would rather leave out.",
    who: "Carl Jung", src: "Individuation — Two Essays on Analytical Psychology (1928)" },
  { t: "Jung wrote that among his patients past midlife, the problem was often, at root, one of finding a meaningful attitude to life. Not every suffering is a symptom. Some is a question.",
    who: "Carl Jung", src: "Modern Man in Search of a Soul (1933)" },
  { t: "In The Undiscovered Self, Jung warned that the individual dissolves in mass movements, and that self-knowledge is the only real resistance.",
    who: "Carl Jung", src: "The Undiscovered Self (1957)" },
  { t: "‘One does not become enlightened by imagining figures of light, but by making the darkness conscious.’ Jung added that the latter is disagreeable, and therefore not popular.",
    who: "Carl Jung", src: "Making the darkness conscious — “The Philosophical Tree” (1945)" },
  { t: "‘Everyone knows nowadays that people have complexes,’ Jung wrote. ‘What is not so well known is that complexes can have us.’",
    who: "Carl Jung", src: "“A Review of the Complex Theory” (1934)" },
  { t: "Jung described the dream as a spontaneous self-portrait, in symbolic form, of the actual situation in the unconscious. It shows things as they are, not as you’d like them.",
    who: "Carl Jung", src: "“On the Nature of Dreams” (1945)" },
  { t: "Jung held that only the wounded physician heals: the healer’s own wounds are part of what makes understanding possible.",
    who: "Carl Jung", src: "The wounded healer — “Fundamental Questions of Psychotherapy” (1951)" },
  { t: "Bion described ‘attacks on linking’: the mind destroying its own connections between thoughts so as not to know something painful. Not being able to think about something is itself information.",
    who: "Wilfred Bion", src: "“Attacks on Linking” (1959)" },
  { t: "Bion found that groups fall into basic assumptions, behaving as if they’ve met to depend on a leader, to fight or flee an enemy, or to pair off in hope of a saviour. Meetings rarely are what they seem.",
    who: "Wilfred Bion", src: "Basic assumptions — Experiences in Groups (1961)" },
  { t: "In the dependency group, Bion observed, members behave as if a leader will meet all their needs, then turn on the leader for failing to. It’s a recognisable cycle.",
    who: "Wilfred Bion", src: "Dependency groups — Experiences in Groups (1961)" },
  { t: "Bion proposed that thoughts come first and thinking develops to cope with them. There are ‘thoughts without a thinker’, waiting for a mind that can hold them.",
    who: "Wilfred Bion", src: "“A Theory of Thinking” (1962)" },
  { t: "Bion valued what Keats called negative capability: being in uncertainties and doubts ‘without any irritable reaching after fact and reason’. Not knowing is part of finding out.",
    who: "Wilfred Bion", src: "Negative capability — Attention and Interpretation (1970)" },
  { t: "Bion wrote of K, the urge to know, and minus K, the active wish not to know. Both are at work in most of us, especially about ourselves.",
    who: "Wilfred Bion", src: "K and minus K — Learning from Experience (1962)" },
  { t: "Bion called ultimate reality O, which can’t be known, only become. The aim, he said, is less to know about something than to be at one with it.",
    who: "Wilfred Bion", src: "O — Transformations (1965)" },
  { t: "Bion’s beta elements are raw sense impressions and emotions that can’t be thought, only evacuated. Feelings with nowhere to go get pushed into whoever is nearby.",
    who: "Wilfred Bion", src: "Beta elements — Learning from Experience (1962)" },
  { t: "Bion’s alpha function transforms raw experience into something that can be dreamt, remembered and thought. It’s the mind’s digestion. It needs rest to work.",
    who: "Wilfred Bion", src: "Alpha function — Learning from Experience (1962)" },
  { t: "Bion’s grid classified thoughts by their development, from raw elements to abstract systems. It’s a reminder that thoughts come in different stages of readiness.",
    who: "Wilfred Bion", src: "The Grid — Elements of Psycho-Analysis (1963)" },
  { t: "Kohut argued that much psychological suffering comes from a self that never got what it needed to feel cohesive. A small slight can then feel like a threat to the whole structure.",
    who: "Heinz Kohut", src: "The Restoration of the Self (1977)" },
  { t: "Kohut described narcissistic rage: the fury of a self whose sense of control or worth has been wounded. Its intensity is out of proportion to the cause because the cause isn’t the whole story.",
    who: "Heinz Kohut", src: "“Thoughts on Narcissism and Narcissistic Rage” (1972)" },
  { t: "Kohut thought children need to idealise a calm, strong figure, and to merge with their strength. Adults still look for people to admire. It’s a need, not a weakness.",
    who: "Heinz Kohut", src: "The idealising transference — The Analysis of the Self (1971)" },
  { t: "Kohut added twinship to the self’s needs: the sense of being essentially alike with others. Belonging begins with recognising your own kind.",
    who: "Heinz Kohut", src: "Twinship — How Does Analysis Cure? (1984)" },
  { t: "Kohut defined empathy as ‘vicarious introspection’: thinking and feeling oneself into another person’s inner life. It’s a way of observing, not a way of agreeing.",
    who: "Heinz Kohut", src: "“Introspection, Empathy, and Psychoanalysis” (1959)" },
  { t: "Kohut called it optimal frustration: small, tolerable failures by others that let us build those functions inside ourselves. Too little frustration and we never learn. Too much and we break.",
    who: "Heinz Kohut", src: "Optimal frustration — The Analysis of the Self (1971)" },
  { t: "Kohut saw childhood grandiosity as healthy if it gradually matures into ambition and self-esteem. It becomes a problem when it’s never met, and so never outgrown.",
    who: "Heinz Kohut", src: "The grandiose self — The Analysis of the Self (1971)" },
  { t: "Kohut contrasted Freud’s Guilty Man, torn by forbidden wishes, with Tragic Man, struggling to fulfil the self’s aims. Much modern unhappiness, he thought, is the second kind.",
    who: "Heinz Kohut", src: "Tragic Man — The Restoration of the Self (1977)" },
  { t: "Horney described three strategies against anxiety: moving towards people, moving against them, and moving away. Each has its place. Trouble starts when only one is available.",
    who: "Karen Horney", src: "Moving toward, against and away — Our Inner Conflicts (1945)" },
  { t: "Horney wrote that we construct an idealised image of ourselves and then hate the real self for falling short of it. The real self is the one that has to live.",
    who: "Karen Horney", src: "The idealised self — Neurosis and Human Growth (1950)" },
  { t: "Horney called it the search for glory: the drive to actualise the idealised self. It never arrives, because the ideal is defined as just out of reach.",
    who: "Karen Horney", src: "The search for glory — Neurosis and Human Growth (1950)" },
  { t: "Horney’s neurotic claims are unspoken demands on the world: that it should treat us as special, spare us difficulty, give without asking. The world doesn’t know about the claims.",
    who: "Karen Horney", src: "Neurotic claims — Neurosis and Human Growth (1950)" },
  { t: "Horney defined basic anxiety as feeling isolated and helpless in a potentially hostile world. It begins in childhood, and it colours how the adult world looks.",
    who: "Karen Horney", src: "Basic anxiety — The Neurotic Personality of Our Time (1937)" },
  { t: "Horney believed self-analysis was possible, if difficult, and wrote a book about it. She was clear it requires honesty, persistence and the willingness to be surprised.",
    who: "Karen Horney", src: "Self-Analysis (1942)" },
  { t: "Horney questioned Freud’s idea of penis envy and suggested men might envy women’s capacity to bear children. Envy, she thought, runs in more than one direction.",
    who: "Karen Horney", src: "Womb envy — “The Flight from Womanhood” (1926)" },
  { t: "For Horney, the real self is the central inner force, the source of growth, which emerges when anxiety stops getting in the way. It doesn’t need to be invented. It needs room.",
    who: "Karen Horney", src: "The real self — Neurosis and Human Growth (1950)" },
  { t: "Horney called it externalisation: experiencing inner conflicts as if they were happening outside us. It makes other people look like the problem.",
    who: "Karen Horney", src: "Externalisation — Our Inner Conflicts (1945)" },
  { t: "Horney described the neurotic need for affection, an insatiable demand to be loved that no amount of love can satisfy, because it’s driven by anxiety rather than desire.",
    who: "Karen Horney", src: "The neurotic need for affection — The Neurotic Personality of Our Time (1937)" },
  { t: "Fromm contrasted two modes of existence: having, which relates to the world by possessing, and being, which relates to it by experiencing. Most people live mainly in the first.",
    who: "Erich Fromm", src: "To Have or to Be? (1976)" },
  { t: "‘If I am what I have and if what I have is lost, who then am I?’ Fromm thought the having mode leaves people permanently anxious.",
    who: "Erich Fromm", src: "To Have or to Be? (1976)" },
  { t: "Fromm’s marketing orientation is experiencing oneself as a commodity, valued by what one can sell. If your worth goes up and down with demand, that’s the market speaking.",
    who: "Erich Fromm", src: "The marketing orientation — Man for Himself (1947)" },
  { t: "Fromm argued that a society can be sick even when everyone in it seems normal. Shared adjustment to an unhealthy way of life, he said, is not the same as health.",
    who: "Erich Fromm", src: "The Sane Society (1955)" },
  { t: "For Fromm, giving is the highest expression of potency: in giving, we experience our own strength and aliveness. It isn’t a loss.",
    who: "Erich Fromm", src: "Giving — The Art of Loving (1956)" },
  { t: "Fromm argued that selfish people don’t love themselves too much but too little. Real self-love and love of others go together.",
    who: "Erich Fromm", src: "Self-love — The Art of Loving (1956)" },
  { t: "Fromm wrote that love is an activity, ‘a standing in, not a falling for’. Falling is easy. Standing takes practice.",
    who: "Erich Fromm", src: "Falling in love versus standing in love — The Art of Loving (1956)" },
  { t: "Fromm said the practice of love requires discipline, concentration, patience and supreme concern, the same as any art.",
    who: "Erich Fromm", src: "Discipline, concentration, patience — The Art of Loving (1956)" },
  { t: "Fromm linked some destructiveness to chronic boredom: an inner deadness that seeks stimulation through harm. The cure isn’t excitement. It’s aliveness.",
    who: "Erich Fromm", src: "Boredom and destructiveness — The Anatomy of Human Destructiveness (1973)" },
  { t: "Fromm called the love of life biophilia: an orientation towards growth and the living. He set it against an attraction to the mechanical and the controlled.",
    who: "Erich Fromm", src: "Biophilia — The Heart of Man (1964)" },
  { t: "Fromm described automaton conformity: thinking, feeling and wanting what one is expected to, while experiencing it all as one’s own. The disguise is very good.",
    who: "Erich Fromm", src: "Automaton conformity — Escape from Freedom (1941)" },
  { t: "Fromm’s authoritarian character admires authority and wants to submit to it, while also wanting to be an authority and have others submit. It’s an anxious arrangement.",
    who: "Erich Fromm", src: "The authoritarian character — Escape from Freedom (1941)" },
  { t: "Erikson’s first stage is basic trust versus mistrust: whether the world can be relied on. It’s laid down in infancy and tested for the rest of life.",
    who: "Erik Erikson", src: "Trust vs. mistrust — Childhood and Society (1950)" },
  { t: "Erikson’s second stage sets autonomy against shame and doubt. Being made to feel ashamed for trying to do things yourself can leave doubt behind for a long time.",
    who: "Erik Erikson", src: "Autonomy vs. shame — Childhood and Society (1950)" },
  { t: "Erikson’s stage of initiative versus guilt is about daring to begin things. Guilt, if it wins, makes starting feel like trespassing.",
    who: "Erik Erikson", src: "Initiative vs. guilt — Childhood and Society (1950)" },
  { t: "In Erikson’s stage of industry versus inferiority, a child learns whether their efforts can produce something worth recognition. Many adults are still waiting for that verdict.",
    who: "Erik Erikson", src: "Industry vs. inferiority — Childhood and Society (1950)" },
  { t: "Erikson coined the term ‘identity crisis’ for the adolescent task of forming a coherent sense of self. He meant it as normal, even necessary.",
    who: "Erik Erikson", src: "The identity crisis — Identity: Youth and Crisis (1968)" },
  { t: "Erikson described a psychosocial moratorium: a period in which young people are allowed to experiment before committing to roles. Being undecided can be a legitimate stage.",
    who: "Erik Erikson", src: "The psychosocial moratorium — Identity: Youth and Crisis (1968)" },
  { t: "Erikson placed intimacy after identity: real closeness requires a self secure enough not to fear being lost in someone else.",
    who: "Erik Erikson", src: "Intimacy vs. isolation — Childhood and Society (1950)" },
  { t: "Erikson’s generativity is concern for establishing and guiding the next generation, through children, work or care. Its opposite is stagnation and self-absorption.",
    who: "Erik Erikson", src: "Generativity vs. stagnation — The Life Cycle Completed (1982)" },
  { t: "Erikson’s last stage, integrity versus despair, involves accepting one’s one and only life cycle as something that had to be. Its virtue, he said, is wisdom.",
    who: "Erik Erikson", src: "Integrity vs. despair — The Life Cycle Completed (1982)" },
  { t: "In Gandhi’s Truth, Erikson interrupts his study to write Gandhi a personal letter questioning his treatment of those close to him. Admiration and honesty can coexist.",
    who: "Erik Erikson", src: "Gandhi’s Truth (1969)" },
  { t: "Erikson linked each stage of life to a basic virtue: hope, will, purpose, competence, fidelity, love, care and wisdom. Each is earned, not given.",
    who: "Erik Erikson", src: "The basic virtues — Insight and Responsibility (1964)" },
  { t: "Anna Freud described altruistic surrender: giving up your own wishes and fulfilling them vicariously through others. It looks generous. It’s also a way of not having to want.",
    who: "Anna Freud", src: "Altruistic surrender — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Anna Freud noted that adolescents often intellectualise, turning feelings into abstract debate to keep them at a safe distance. It’s a defence that sounds a lot like thinking.",
    who: "Anna Freud", src: "Intellectualisation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Anna Freud observed adolescent asceticism: a sudden, severe renunciation of pleasures, as a defence against instinctual urges that feel overwhelming.",
    who: "Anna Freud", src: "Adolescent asceticism — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Reaction formation turns an unacceptable feeling into its opposite: hostility becomes excessive kindness. Anna Freud noted the exaggeration often gives it away.",
    who: "Anna Freud", src: "Reaction formation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Displacement redirects a feeling from its real target to a safer one. Anna Freud described it among the ego’s common defences. The safer target rarely deserves it.",
    who: "Anna Freud", src: "Displacement — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Anna Freud described turning against the self: aggression that can’t safely be aimed outwards is redirected inwards. Self-criticism is sometimes anger with nowhere else to go.",
    who: "Anna Freud", src: "Turning against the self — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Anna Freud proposed developmental lines, such as from dependence to self-reliance, along which children progress unevenly. Being ahead in one area and behind in another is normal.",
    who: "Anna Freud", src: "Developmental lines — Normality and Pathology in Childhood (1965)" },
  { t: "Sublimation, for Anna Freud and her father, redirects instinctual energy into socially valued activities. It’s the most successful defence because it doesn’t feel like one.",
    who: "Anna Freud", src: "Sublimation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Anna Freud described denial in fantasy: children reversing painful facts in imagination, becoming the strong one in their games. Adults have more sophisticated versions.",
    who: "Anna Freud", src: "Denial in fantasy — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Bowlby and James Robertson described children’s response to separation in three phases: protest, despair and detachment. The detachment is not recovery.",
    who: "John Bowlby", src: "Protest, despair, detachment — Attachment and Loss, Vol. 2: Separation (1973)" },
  { t: "Bowlby found that grief involves an urge to search for the lost person. It isn’t irrational. It’s the attachment system doing what it was built to do.",
    who: "John Bowlby", src: "Searching — Attachment and Loss, Vol. 3: Loss (1980)" },
  { t: "Bowlby proposed internal working models: expectations of how others will respond, formed in early relationships and carried into later ones. They can be revised. It takes experience, not argument.",
    who: "John Bowlby", src: "Internal working models — Attachment and Loss, Vol. 2: Separation (1973)" },
  { t: "Bowlby described the attachment figure as a secure base from which to explore and a haven to return to. Security, in his sense, is what makes independence possible.",
    who: "John Bowlby", src: "A Secure Base (1988)" },
  { t: "In ‘Forty-Four Juvenile Thieves’, Bowlby found that many of the young thieves he studied had suffered early, prolonged separations from their mothers. Some stealing is a search.",
    who: "John Bowlby", src: "“Forty-Four Juvenile Thieves” (1944)" },
  { t: "Bowlby wrote that mother-love in infancy is as important for mental health as vitamins and proteins are for physical health. It sounds obvious now. It wasn’t then.",
    who: "John Bowlby", src: "Maternal Care and Mental Health (1951)" },
  { t: "Bowlby described compulsive self-reliance: insisting on doing everything alone, because needing others once proved too painful. It’s self-sufficiency as armour.",
    who: "John Bowlby", src: "Compulsive self-reliance — Attachment and Loss, Vol. 3: Loss (1980)" },
  { t: "In Ainsworth’s Strange Situation, securely attached toddlers were distressed when their mother left and comforted when she returned. Distress isn’t the problem. Being unable to be comforted is.",
    who: "Mary Ainsworth", src: "Secure attachment — Patterns of Attachment (1978)" },
  { t: "Ainsworth’s avoidant toddlers seemed unbothered by separation and ignored their mother’s return. Later studies found their bodies were stressed all the same. Looking fine and being fine are different.",
    who: "Mary Ainsworth", src: "Avoidant attachment — Patterns of Attachment (1978)" },
  { t: "Ainsworth’s ambivalent toddlers were intensely upset at separation and hard to soothe, seeking contact and resisting it at once. Inconsistent care teaches inconsistent hope.",
    who: "Mary Ainsworth", src: "Ambivalent attachment — Patterns of Attachment (1978)" },
  { t: "Fairbairn’s moral defence: a child makes itself bad so its parents can stay good. ‘It is better to be a sinner in a world ruled by God than to live in a world ruled by the Devil.’",
    who: "W. R. D. Fairbairn", src: "The moral defence — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Fairbairn argued that libido is object-seeking, not pleasure-seeking. What we’re after, at bottom, is relationship.",
    who: "W. R. D. Fairbairn", src: "Libido is object-seeking — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Fairbairn described the exciting object: the tantalising, unavailable side of someone we need. The longing it produces can feel like love.",
    who: "W. R. D. Fairbairn", src: "The exciting object — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Fairbairn’s internal saboteur is the part of the self that attacks one’s own needs and longings, siding with the rejecting object. It is often mistaken for good sense.",
    who: "W. R. D. Fairbairn", src: "The internal saboteur — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Fairbairn wrote that the schizoid person fears that their love itself is destructive, and so keeps it hidden. Their coldness protects others from it.",
    who: "W. R. D. Fairbairn", src: "“Schizoid Factors in the Personality” (1940)" },
  { t: "Fairbairn saw development as moving from infantile dependence to mature dependence, not to independence. Needing others is permanent. How we need them changes.",
    who: "W. R. D. Fairbairn", src: "Mature dependence — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Ferenczi described analytic tact as the capacity to feel with the patient. Knowing when to say something, he thought, matters as much as knowing what to say.",
    who: "Sándor Ferenczi", src: "Tact — “The Elasticity of Psycho-Analytic Technique” (1928)" },
  { t: "In his Clinical Diary, Ferenczi questioned whether the analyst’s professional reserve could repeat the coldness that had harmed the patient in the first place. Detachment isn’t always neutral.",
    who: "Sándor Ferenczi", src: "The Clinical Diary (1932)" },
  { t: "Ferenczi suggested that children who sense they were unwelcome may lose some of their will to live. A feeling of being in the way can have very early roots.",
    who: "Sándor Ferenczi", src: "“The Unwelcome Child and His Death-Instinct” (1929)" },
  { t: "In Thalassa, Ferenczi speculated that we carry a longing to return to the womb, and further back, to the sea. A strange book, but most people recognise the longing.",
    who: "Sándor Ferenczi", src: "Thalassa: A Theory of Genitality (1924)" },
  { t: "Ferenczi described a confusion of tongues: children speak the language of tenderness, and harm follows when adults answer in the language of passion.",
    who: "Sándor Ferenczi", src: "Tenderness and passion — “Confusion of Tongues between Adults and the Child” (1933)" },
  { t: "Ferenczi experimented with mutual analysis, letting a patient analyse him in turn. The experiment failed, but the question it raised, who listens to the listener, has stayed.",
    who: "Sándor Ferenczi", src: "Mutual analysis — The Clinical Diary (1932)" },
  { t: "Ferenczi described the wise baby: a traumatised child who develops a precocious, caretaking maturity, looking after the adults who should have looked after them.",
    who: "Sándor Ferenczi", src: "The wise baby — “Confusion of Tongues between Adults and the Child” (1933)" },
  { t: "Balint called some early damage a basic fault: not a conflict to be resolved but a lack, something missing that needs to be met rather than interpreted.",
    who: "Michael Balint", src: "The Basic Fault (1968)" },
  { t: "Balint described ocnophils, people who cling to objects for safety, and feel anxious in the open spaces between them.",
    who: "Michael Balint", src: "Ocnophils — Thrills and Regressions (1959)" },
  { t: "Balint’s philobats enjoy the open spaces between objects and the thrill of leaving safety, confident in their own skills to return.",
    who: "Michael Balint", src: "Philobats — Thrills and Regressions (1959)" },
  { t: "Balint found that the most frequently used drug in general practice is the doctor. How the doctor is ‘prescribed’, he argued, matters as much as any medicine.",
    who: "Michael Balint", src: "The doctor as drug — The Doctor, His Patient and the Illness (1957)" },
  { t: "Bollas describes the mother as the infant’s first transformational object, experienced as something that alters the self. Later we search for that experience in people, places and things.",
    who: "Christopher Bollas", src: "The transformational object — The Shadow of the Object (1987)" },
  { t: "Bollas described the normotic personality: someone abnormally normal, oriented to objects and facts and uninterested in inner life. It doesn’t look like illness. That’s the difficulty.",
    who: "Christopher Bollas", src: "Normotic illness — The Shadow of the Object (1987)" },
  { t: "Bollas distinguishes fate, the sense of being determined by circumstances, from destiny, the sense of using one’s life to articulate one’s own idiom.",
    who: "Christopher Bollas", src: "Fate and destiny — Forces of Destiny (1989)" },
  { t: "In Being a Character, Bollas suggests that we use the objects of the world, people, places, music, to express and elaborate ourselves. Choices of taste are acts of self-expression.",
    who: "Christopher Bollas", src: "Being a Character (1992)" },
  { t: "Bollas writes of evocative objects: things that bring forth parts of ourselves we didn’t know were there. A song or a street can do work no argument can.",
    who: "Christopher Bollas", src: "Evocative objects — Being a Character (1992)" },
  { t: "In Cracking Up, Bollas describes how unconscious thinking breaks up our ordinary experience into new connections. Free association is a kind of creative cracking up.",
    who: "Christopher Bollas", src: "Cracking Up (1995)" },
  { t: "Bollas argues that free association is the mind’s natural way of thinking, and that its logic only becomes visible over time. Not every thought needs to arrive in order.",
    who: "Christopher Bollas", src: "The Mystery of Things (1999)" },
  { t: "In Meaning and Melancholia, Bollas worries that contemporary culture discourages reflection and inner life. Some unhappiness may be the cost of never having time to think.",
    who: "Christopher Bollas", src: "Meaning and Melancholia (2018)" },
  { t: "Bollas describes extractive introjection: one person taking over another’s feelings or experiences as if they were their own. It leaves the other feeling strangely emptied.",
    who: "Christopher Bollas", src: "Extractive introjection — The Shadow of the Object (1987)" },
  { t: "Benjamin argues that we need to be recognised by someone we in turn recognise as an independent person. Being loved as an object isn’t the same as being known as a subject.",
    who: "Jessica Benjamin", src: "Like Subjects, Love Objects (1995)" },
  { t: "Benjamin describes the third: a shared space where two people can both be right, or both be heard, instead of locked into doer and done-to.",
    who: "Jessica Benjamin", src: "The third — Beyond Doer and Done To (2018)" },
  { t: "Benjamin sees rupture and repair as the ordinary rhythm of relationships. What matters is not avoiding breakdown but being able to come back from it.",
    who: "Jessica Benjamin", src: "Rupture and repair — Beyond Doer and Done To (2018)" },
  { t: "Benjamin emphasises acknowledgment: saying clearly that harm was done and seeing its effects. Without it, she argues, repair can’t really begin.",
    who: "Jessica Benjamin", src: "Acknowledgment — Beyond Doer and Done To (2018)" },
  { t: "Phillips describes boredom as ‘that state of suspended anticipation in which things are started and nothing begins’. It’s a waiting for a desire one doesn’t yet have.",
    who: "Adam Phillips", src: "Boredom — On Kissing, Tickling, and Being Bored (1993)" },
  { t: "Phillips notes that we can’t tickle ourselves. Some pleasures depend on another person, and on not quite being in control.",
    who: "Adam Phillips", src: "Tickling — On Kissing, Tickling, and Being Bored (1993)" },
  { t: "Phillips’s Monogamy is a book of aphorisms, and its point is that nobody quite knows what they’re doing with fidelity, desire or love. Everyone is improvising.",
    who: "Adam Phillips", src: "Monogamy (1996)" },
  { t: "In Going Sane, Phillips observes that we have detailed descriptions of madness but very few of sanity. We may not know what we’re aiming for.",
    who: "Adam Phillips", src: "Going Sane (2005)" },
  { t: "Phillips and Barbara Taylor argue that kindness has become a forbidden pleasure, viewed with suspicion as weakness or sentimentality. They think it’s one of the great pleasures.",
    who: "Adam Phillips", src: "On Kindness (2009, with Barbara Taylor)" },
  { t: "Phillips suggests that frustration is where we discover what we want. Rush to relieve it and you lose the information.",
    who: "Adam Phillips", src: "Frustration — Missing Out: In Praise of the Unlived Life (2012)" },
  { t: "In On Balance, Phillips questions our faith in balance and moderation. Some of what matters most, love among it, involves excess.",
    who: "Adam Phillips", src: "On Balance (2010)" },
  { t: "In Terrors and Experts, Phillips argues that psychoanalysis is better as an art of curiosity than a body of expertise. Be wary of anyone who knows exactly what you mean.",
    who: "Adam Phillips", src: "Terrors and Experts (1995)" },
  { t: "In Darwin’s Worms, Phillips reads Darwin and Freud as two writers who, in different ways, learned to accept a world of transience and death. Accepting it, he suggests, is what lets life matter.",
    who: "Adam Phillips", src: "Darwin’s Worms (1999)" },
  { t: "In Promises, Promises, Phillips explores how we use stories and theories to manage what we can’t control. A promise is partly a hope dressed as a certainty.",
    who: "Adam Phillips", src: "Promises, Promises (2000)" },
  { t: "In Unforbidden Pleasures, Phillips argues that we’re so fascinated by forbidden pleasures that we neglect the ones nobody stops us having. They may be more interesting.",
    who: "Adam Phillips", src: "Unforbidden Pleasures (2015)" },
  { t: "Phillips suggests that attention seeking is simply seeking: everyone wants to be attended to, and what we attend to shapes who we become.",
    who: "Adam Phillips", src: "Attention Seeking (2019)" },
  { t: "In On Wanting to Change, Phillips is wary of dramatic conversion. Wanting to become someone else can be a way of not acknowledging who one already is.",
    who: "Adam Phillips", src: "On Wanting to Change (2021)" },
  { t: "In On Getting Better, Phillips asks what we actually mean by recovery, and whether getting better means becoming a different person or a fuller version of the same one.",
    who: "Adam Phillips", src: "On Getting Better (2021)" },
  { t: "In On Giving Up, Phillips considers that giving things up can be a form of freedom, not only of defeat. Knowing what to stop can be as important as knowing what to pursue.",
    who: "Adam Phillips", src: "On Giving Up (2024)" },
  { t: "Mitchell wrote that people bring both hope and dread into therapy: hope of something new, dread of repeating something old. Most new relationships carry both.",
    who: "Stephen A. Mitchell", src: "Hope and Dread in Psychoanalysis (1993)" },
  { t: "In Can Love Last?, Mitchell argued that romance fades less from familiarity than from the illusion that we know our partner completely. Recognising the unknown in them keeps desire alive.",
    who: "Stephen A. Mitchell", src: "Can Love Last? (2002)" },
  { t: "Mitchell held that we are always influenced by others, and that autonomy isn’t freedom from influence but a way of owning it.",
    who: "Stephen A. Mitchell", src: "Influence and Autonomy in Psychoanalysis (1997)" },
  { t: "Mitchell saw love as a tension between the wish for safety and the wish for adventure. Neither can be eliminated. The work is in holding both.",
    who: "Stephen A. Mitchell", src: "Safety and adventure — Can Love Last? (2002)" },
  { t: "Kristeva’s abject is what we expel to define ourselves, what disgusts us at the borders of the body and the self. Disgust marks where we draw the line between ‘me’ and ‘not me’.",
    who: "Julia Kristeva", src: "Abjection — Powers of Horror (1980)" },
  { t: "In Black Sun, Kristeva describes depression as a black sun: an inner light that gives no warmth, tied to a loss that can’t be named. Naming, she thought, is part of the cure.",
    who: "Julia Kristeva", src: "Black Sun: Depression and Melancholia (1987)" },
  { t: "In Tales of Love, Kristeva examines how love both dissolves and remakes the boundaries of the self. Love is where identity becomes unstable, for better and worse.",
    who: "Julia Kristeva", src: "Tales of Love (1983)" },
  { t: "Kristeva writes of intimate revolt: the ongoing questioning of oneself, not only of social order. Inner life, she argues, depends on it.",
    who: "Julia Kristeva", src: "Intimate revolt — The Sense and Non-Sense of Revolt (1996)" },
  { t: "André Green’s ‘dead mother’ is alive but emotionally absent, often through grief. The child tries to revive her, and later may feel inwardly hollow without knowing why.",
    who: "André Green", src: "“The Dead Mother” (1980)" },
  { t: "Green explored the work of the negative: how absence, loss and what’s missing shape the psyche as much as what’s present.",
    who: "André Green", src: "The Work of the Negative (1993)" },
  { t: "Green distinguished life narcissism, which supports the self, from death narcissism, which seeks to reduce all tension and desire to zero. Withdrawal can be either.",
    who: "André Green", src: "Life Narcissism, Death Narcissism (1983)" },
  { t: "Laplanche argued that adults inevitably send children enigmatic messages, charged with meanings the adults themselves don’t understand. The child spends a lifetime translating them.",
    who: "Jean Laplanche", src: "The enigmatic signifier — New Foundations for Psychoanalysis (1987)" },
  { t: "Laplanche developed Freud’s idea of afterwardsness: an event may become traumatic only later, when it’s reinterpreted. The meaning of the past isn’t fixed.",
    who: "Jean Laplanche", src: "“Notes on Afterwardsness” — Essays on Otherness (1999)" },
  { t: "Ogden describes the analytic third: a jointly created experience that belongs to neither person alone. Every close relationship has one.",
    who: "Thomas Ogden", src: "The analytic third — Subjects of Analysis (1994)" },
  { t: "Ogden treats the analyst’s reveries, stray thoughts, images, daydreams, as clues to what’s happening between the two people in the room.",
    who: "Thomas Ogden", src: "“Reverie and Interpretation” (1997)" },
  { t: "Ogden describes psychoanalysis as helping patients dream their undreamt and interrupted dreams: to process what they couldn’t process alone.",
    who: "Thomas Ogden", src: "Dreaming undreamt dreams — This Art of Psychoanalysis (2005)" },
  { t: "Ogden added the autistic-contiguous position to Klein’s two: a mode of experience grounded in sensation, rhythm and surface. Sometimes comfort comes through the body before it comes through words.",
    who: "Thomas Ogden", src: "The autistic-contiguous position — The Primitive Edge of Experience (1989)" },
  { t: "Rank proposed that birth is the first trauma and the prototype of later anxieties about separation. Every leaving, in some way, recalls the first.",
    who: "Otto Rank", src: "The Trauma of Birth (1924)" },
  { t: "Rank described two fears: life fear, the fear of separating and standing alone, and death fear, the fear of losing oneself in union. We spend our lives moving between them.",
    who: "Otto Rank", src: "Life fear and death fear — Will Therapy (1936)" },
  { t: "In Art and Artist, Rank saw the artist as someone who turns the struggle between these fears into creative form. Creativity is a way of using conflict, not escaping it.",
    who: "Otto Rank", src: "Art and Artist (1932)" },
  { t: "Rank placed the will at the centre of personality: a creative, organising force, not just stubbornness. Therapy, for him, meant freeing it rather than breaking it.",
    who: "Otto Rank", src: "The creative will — Will Therapy (1936)" },
  { t: "Sullivan’s one-genus postulate: ‘We are all much more simply human than otherwise.’",
    who: "Harry Stack Sullivan", src: "The one-genus postulate — The Interpersonal Theory of Psychiatry (1953)" },
