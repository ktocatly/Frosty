<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frosty Says</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe3;
    --paper-edge: #e6dcc6;
    --ink: #2a2622;
    --ink-soft: #6b6157;
    --rule: #2a2622;
    --night: #1d2a44;
    --night-2: #34476b;
    --snow: #fbfaf6;
    --scarf: #3f6b4e;
    --scarf-2: #2c4f39;
    --hat: #2f3a34;
    --nose: #e07a2e;
    --bubble: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    background-image: radial-gradient(ellipse at top, var(--night-2), var(--night) 70%);
    min-height: 100vh;
    font-family: "Libre Baskerville", Georgia, serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
    overflow-x: hidden;
  }
  #snowfall { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .column {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(180,160,120,.12), transparent 50%);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    padding: 28px 28px 22px;
    transform: rotate(-0.4deg);
  }

  /* Masthead */
  .meta {
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
    border-top: 3px double var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 6px 0;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900;
    font-size: clamp(44px, 12vw, 72px);
    line-height: .95;
    text-align: center;
    margin: 14px 0 4px;
    letter-spacing: -.01em;
  }
  .dek {
    text-align: center;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  /* Stage */
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; }

  .bubble {
    position: relative;
    width: 100%;
    min-height: 132px;
    background: var(--bubble);
    border: 2px solid var(--ink);
    border-radius: 22px;
    padding: 18px 20px;
    margin: 6px 0 18px;
    font-size: 16px;
    line-height: 1.6;
    box-shadow: 4px 4px 0 rgba(42,38,34,.15);
    display: flex; align-items: center;
  }
  .bubble::after, .bubble::before {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    border-style: solid;
  }
  .bubble::before { bottom: -18px; border-width: 18px 14px 0 14px; border-color: var(--ink) transparent transparent; }
  .bubble::after  { bottom: -14px; border-width: 15px 11px 0 11px; border-color: var(--bubble) transparent transparent; }
  .bubble p { margin: 0; }
  .bubble .hint { color: var(--ink-soft); font-style: italic; text-align: center; width: 100%; }
  .bubble.fresh p { animation: inkIn .5s ease both; }
  @keyframes inkIn { from { opacity: 0; filter: blur(3px); transform: translateY(4px); } to { opacity: 1; filter: none; transform: none; } }

  .snowman-btn {
    appearance: none; border: 0; background: none; padding: 0; margin: 0;
    cursor: pointer; width: min(320px, 80vw);
    -webkit-tap-highlight-color: transparent;
  }
  .snowman-btn:focus-visible { outline: 3px dashed var(--scarf); outline-offset: 6px; border-radius: 12px; }
  .snowman-btn img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(0 10px 10px rgba(42,38,34,.22));
    transform-origin: 50% 90%;
    user-select: none; -webkit-user-drag: none;
  }
  .snowman-btn.wobble img { animation: wobble .6s ease; }
  @keyframes wobble {
    0% { transform: rotate(0) scale(1); }
    20% { transform: rotate(-4deg) scale(1.03, .97); }
    45% { transform: rotate(3deg) scale(.98, 1.03); }
    70% { transform: rotate(-1.5deg); }
    100% { transform: rotate(0) scale(1); }
  }

  /* Byline / citation */
  .byline {
    margin-top: 14px;
    border-top: 1px solid var(--rule);
    padding-top: 10px;
    min-height: 66px;
    font-size: 13px;
    line-height: 1.5;
  }
  .byline .label {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .byline .who {
    font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 18px;
  }
  .byline .src { color: var(--ink-soft); font-style: italic; }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 3px double var(--rule);
    margin-top: 12px; padding-top: 8px;
    font-size: 11px; color: var(--ink-soft);
  }
  .footer button {
    font: inherit; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    background: none; border: 1px solid var(--ink-soft); color: var(--ink);
    padding: 5px 10px; cursor: pointer; border-radius: 3px;
  }
  .footer button:hover { background: var(--ink); color: var(--paper); }

  @media (max-width: 420px) {
    .column { padding: 20px 16px 16px; transform: none; }
    .bubble { font-size: 15px; padding: 14px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .snowman-btn.wobble img, .bubble.fresh p { animation: none; }
  }
</style>
</head>
<body>
<canvas id="snowfall" aria-hidden="true"></canvas>

<main class="column">
  <div class="meta"><span>The Winter Gazette</span><span id="issue">Advice Column</span></div>
  <h1>Frosty Says</h1>
  <p class="dek">Your snowman is with you &mdash; tap him anywhere for a word from the unconscious.</p>

  <section class="stage">
    <div class="bubble" id="bubble" aria-live="polite">
      <p class="hint">&ldquo;Go on, poke me. I&rsquo;ve been listening all winter and I have notes.&rdquo;</p>
    </div>

    <button class="snowman-btn" id="snowman" aria-label="Tap the snowman for advice">
      <img src="frosty.webp" alt="Frosty, a plush snowman in a green hat and scarf" width="640" height="835">
    </button>
  </section>

  <section class="byline" id="byline" aria-live="polite">
    <div class="label">Speaking according to</div>
    <div class="who">&hellip;</div>
    <div class="src">Tap the snowman to begin your session.</div>
  </section>

  <div class="footer">
    <span id="count">Session 0</span>
    <button id="again" type="button">Another, please</button>
  </div>
</main>

<script>
const ADVICE = [
  { t: "You ‘forgot’ to reply. Again. I’m not saying you didn’t want to. I’m saying your thumbs seem to have an opinion.",
    who: "Sigmund Freud", src: "On parapraxes — The Psychopathology of Everyday Life (1901)" },
  { t: "Same argument, new person, identical script. At some point you have to admit you’re not the audience. You’re the playwright.",
    who: "Sigmund Freud", src: "Repetition compulsion — “Remembering, Repeating and Working-Through” (1914)" },
  { t: "Grief isn’t a mood you get over. It’s admin. Every place you kept them has to be cleared out, one drawer at a time. Nobody enjoys admin.",
    who: "Sigmund Freud", src: "The work of mourning — “Mourning and Melancholia” (1917)" },
  { t: "That voice telling you you’re not good enough? Check the accent. It’s probably a parent’s, and they’re not even in the room.",
    who: "Sigmund Freud", src: "The superego — The Ego and the Id (1923)" },
  { t: "Love and work. That’s the whole list. Notice it doesn’t say ‘be happy’. Freud was many things, but a cheerleader wasn’t one of them.",
    who: "Sigmund Freud", src: "Lieben und arbeiten, as reported by Erik Erikson" },
  { t: "You can adore someone and want to throw their phone in a lake. Same afternoon. That isn’t a contradiction. That’s a relationship.",
    who: "Melanie Klein", src: "The depressive position — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "If they’re a saint on Monday and a monster by Thursday, it may not be them that keeps changing.",
    who: "Melanie Klein", src: "Splitting — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Envy doesn’t want what they have. It wants them not to have it. Charming. Try being grateful for something, purely out of spite.",
    who: "Melanie Klein", src: "Envy and Gratitude (1957)" },
  { t: "Perfect parents raise people who can’t cope with anything. Disappoint someone a little today. It’s character-building, for both of you.",
    who: "D. W. Winnicott", src: "The good-enough mother — Playing and Reality (1971)" },
  { t: "You’re very good at being who they want. Suspiciously good. Somewhere under the performance is someone who hasn’t been allowed to speak in years.",
    who: "D. W. Winnicott", src: "True and False Self — “Ego Distortion in Terms of True and False Self” (1960)" },
  { t: "Sitting quietly in a room with someone, without performing, is a rare skill. Most people can’t even manage it with themselves.",
    who: "D. W. Winnicott", src: "“The Capacity to Be Alone” (1958)" },
  { t: "Play isn’t a break from finding yourself. It’s where you’re hiding. Make something pointless. I’m frozen water in a hat, and look how I turned out.",
    who: "D. W. Winnicott", src: "Transitional space — Playing and Reality (1971)" },
  { t: "You want what you want. Or you want what they want you to want. Lacan would say there’s no difference, then end the session early.",
    who: "Jacques Lacan", src: "“The Subversion of the Subject and the Dialectic of Desire” (1960)" },
  { t: "The tidy, whole person in the mirror is a flattering rumour. The real you is messier. Also, frankly, better company.",
    who: "Jacques Lacan", src: "“The Mirror Stage as Formative of the I Function” (1949)" },
  { t: "Pay attention to your slips of the tongue. The unconscious is structured like a language, and it has better comic timing than you do.",
    who: "Jacques Lacan", src: "Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "The thing about other people that drives you mad? Bad news. It’s usually a mirror with the lights off.",
    who: "Carl Jung", src: "The Shadow — Aion (1951)" },
  { t: "Some feelings arrive before there are words for them. Hand them to someone sturdy for a while. I’d offer, but I’m melting.",
    who: "Wilfred Bion", src: "Container and contained — Learning from Experience (1962)" },
  { t: "Go into the conversation with no memory and no agenda. Terrifying, I know. You might accidentally hear something.",
    who: "Wilfred Bion", src: "“Notes on Memory and Desire” (1967)" },
  { t: "Wanting to be admired isn’t vanity. It’s a vitamin. Just don’t try to get your daily dose from strangers on the internet.",
    who: "Heinz Kohut", src: "Mirroring selfobjects — The Analysis of the Self (1971)" },
  { t: "You should exercise, should call your mother, should be further along by now. Horney called it the tyranny of the shoulds. Tyrants never say thank you.",
    who: "Karen Horney", src: "Neurosis and Human Growth (1950)" },
  { t: "Love isn’t something you fall into, like a ditch. It’s a skill, like the cello. Most people expect to play the cello without practising.",
    who: "Erich Fromm", src: "The Art of Loving (1956)" },
  { t: "Freedom is lovely in theory. In practice, most people hand it to the first confident person with a clipboard.",
    who: "Erich Fromm", src: "Escape from Freedom (1941)" },
  { t: "Every stage of life comes with its own crisis, free of charge. If you’re having one, congratulations. You’re on schedule.",
    who: "Erik Erikson", src: "Psychosocial stages — Childhood and Society (1950)" },
  { t: "Your defences were brilliant inventions, once. Some of them have been working well past retirement age.",
    who: "Anna Freud", src: "The Ego and the Mechanisms of Defence (1936)" },
  { t: "Needing someone isn’t weakness. People are built to want a secure base. Even I need a reliable cold front.",
    who: "John Bowlby", src: "Attachment and Loss, Vol. 1: Attachment (1969)" },
  { t: "We stay loyal to whatever hurt us, because a bad attachment feels safer than none. It’s a terrible deal. People sign it every day.",
    who: "W. R. D. Fairbairn", src: "Psychoanalytic Studies of the Personality (1952)" },
  { t: "As a child you may have learned to see things from the bully’s side. It kept you safe. You can stop now. You’re taller than them.",
    who: "Sándor Ferenczi", src: "Identification with the aggressor — “Confusion of Tongues” (1932)" },
  { t: "You know things you’ve never actually thought. Bollas called it the unthought known. You call it a funny feeling. It’s usually right.",
    who: "Christopher Bollas", src: "The Shadow of the Object (1987)" },
  { t: "If one of you always gives in and the other always gets their way, nobody is being seen. It’s two people taking turns being furniture.",
    who: "Jessica Benjamin", src: "The Bonds of Love (1988)" },
  { t: "You’ll spend a lot of time mourning the lives you didn’t live. Fair enough. But this one is the only one with your name on the lease.",
    who: "Adam Phillips", src: "Missing Out: In Praise of the Unlived Life (2012)" },
  { t: "You aren’t one self. You’re a committee, and each member was elected by a different relationship. The meetings run long.",
    who: "Stephen A. Mitchell", src: "Relational Concepts in Psychoanalysis (1988)" },
  { t: "If you sometimes feel like a stranger to yourself, welcome. Everyone is foreign somewhere inside. You might as well be a decent host.",
    who: "Julia Kristeva", src: "Strangers to Ourselves (1988)" },
  { t: "Last night you dreamt about your ex, a goat and a lift. Every dream is a wish fulfilled. I’m not going to ask which part you wanted.",
    who: "Sigmund Freud", src: "Wish fulfilment — The Interpretation of Dreams (1900)" },
  { t: "Dreams are the royal road to the unconscious. Most people treat them like spam and delete them before breakfast.",
    who: "Sigmund Freud", src: "The royal road — The Interpretation of Dreams (1900)" },
  { t: "In dreams, three people you know get squashed into one person you don’t. Efficient, really. The unconscious hates paying for extras.",
    who: "Sigmund Freud", src: "Condensation — The Interpretation of Dreams (1900)" },
  { t: "Tonight’s dream will borrow something tiny from today, like a bus timetable, and use it to say something enormous. Stay alert at bus stops.",
    who: "Sigmund Freud", src: "Day residue — The Interpretation of Dreams (1900)" },
  { t: "Notice what you find funny. A joke is a small smuggling operation, and the customs officer is you.",
    who: "Sigmund Freud", src: "Jokes and Their Relation to the Unconscious (1905)" },
  { t: "Your tastes weren’t delivered fully formed. Freud thought they had a long and slightly embarrassing childhood. Be gentle with them.",
    who: "Sigmund Freud", src: "Three Essays on the Theory of Sexuality (1905)" },
  { t: "Freud said a happy person never daydreams. So the forty minutes you just spent winning an imaginary award is, technically, information.",
    who: "Sigmund Freud", src: "“Creative Writers and Day-Dreaming” (1908)" },
  { t: "The reality principle is just the pleasure principle with a calendar. You can still have the cake. Later. Possibly smaller.",
    who: "Sigmund Freud", src: "The reality principle — “Formulations on the Two Principles of Mental Functioning” (1911)" },
  { t: "Everybody starts out in love with themselves. The trick is to lend some of it out and actually expect it back.",
    who: "Sigmund Freud", src: "“On Narcissism: An Introduction” (1914)" },
  { t: "Falling for your therapist, your boss or your yoga teacher is rarely about them. It’s an old letter, readdressed.",
    who: "Sigmund Freud", src: "“Observations on Transference-Love” (1915)" },
  { t: "That creepy feeling when something familiar seems strange? Freud called it the uncanny. It’s usually something you knew once and filed under ‘never again’.",
    who: "Sigmund Freud", src: "“The Uncanny” (1919)" },
  { t: "A toddler throws a toy away and pulls it back, over and over, to master being left. Adults do the same thing, only with text messages.",
    who: "Sigmund Freud", src: "Fort–da — Beyond the Pleasure Principle (1920)" },
  { t: "Part of you wants peace so badly it would settle for stillness. Freud called it the death drive. I call it February.",
    who: "Sigmund Freud", src: "The death drive — Beyond the Pleasure Principle (1920)" },
  { t: "In a crowd, people swap their conscience for a leader and feel wonderfully light. Watch who you hand yours to. Some people don’t give it back.",
    who: "Sigmund Freud", src: "Group Psychology and the Analysis of the Ego (1921)" },
  { t: "The ego is a rider on a horse with its own ideas. Often the rider just pretends he meant to go that way.",
    who: "Sigmund Freud", src: "The ego as rider — The Ego and the Id (1923)" },
  { t: "If you start a sentence with ‘it’s not that I’m jealous’, I have bad news about the rest of the sentence.",
    who: "Sigmund Freud", src: "“Negation” (1925)" },
  { t: "Anxiety is a signal, not a verdict. It’s a smoke alarm. Sometimes there’s a fire. Sometimes it’s just toast.",
    who: "Sigmund Freud", src: "Signal anxiety — Inhibitions, Symptoms and Anxiety (1926)" },
  { t: "Freud thought we invent comforting fathers in the sky because the real ones were disappointing. Check who you’ve cast in that role lately.",
    who: "Sigmund Freud", src: "The Future of an Illusion (1927)" },
  { t: "Humour, for Freud, is the superego being kind for once. Rare as a warm snowman. Enjoy it when it happens.",
    who: "Sigmund Freud", src: "“Humour” (1927)" },
  { t: "The people who annoy you most are rarely your opposites. They’re the ones almost exactly like you, with slightly different opinions about cheese.",
    who: "Sigmund Freud", src: "The narcissism of minor differences — Civilization and Its Discontents (1930)" },
  { t: "Freud wrote that happiness isn’t included in the plan of Creation. So if you’re mildly unhappy, you’re not failing. You’ve read the brochure correctly.",
    who: "Sigmund Freud", src: "Civilization and Its Discontents (1930)" },
  { t: "The more civilised you get, the guiltier you feel. Freud thought that was the deal. Nobody read the terms and conditions.",
    who: "Sigmund Freud", src: "Guilt as the price of civilisation — Civilization and Its Discontents (1930)" },
  { t: "Freud listed three impossible professions: educating, governing and analysing. Parenting covers the first two. Lower your expectations accordingly.",
    who: "Sigmund Freud", src: "The impossible professions — “Analysis Terminable and Interminable” (1937)" },
  { t: "Some people fall apart the moment they get what they wanted. If the promotion feels like a punishment, ask who told you you weren’t allowed it.",
    who: "Sigmund Freud", src: "“Those Wrecked by Success” (1916)" },
  { t: "Try listening without deciding in advance what’s important. Freud recommended it to doctors. It also works on partners, who are much harder.",
    who: "Sigmund Freud", src: "Evenly suspended attention — “Recommendations to Physicians Practising Psycho-Analysis” (1912)" },
  { t: "You don’t meet new people. You meet new people wearing old costumes you lent them.",
    who: "Sigmund Freud", src: "“The Dynamics of Transference” (1912)" },
  { t: "Your sharpest childhood memory might be a decoy. Something innocent, standing guard in front of something that wasn’t.",
    who: "Sigmund Freud", src: "“Screen Memories” (1899)" },
  { t: "Every child secretly suspects they were swapped at birth and their real parents are far grander. Most adults still suspect it, just about their colleagues.",
    who: "Sigmund Freud", src: "“Family Romances” (1909)" },
  { t: "When you tear yourself apart, listen to the insults closely. They often fit someone else much better.",
    who: "Sigmund Freud", src: "Melancholic self-reproach — “Mourning and Melancholia” (1917)" },
  { t: "Something isn’t worth less because it doesn’t last. Take it from a snowman. Freud agreed, and he wasn’t even melting.",
    who: "Sigmund Freud", src: "“On Transience” (1916)" },
  { t: "What you push down doesn’t stay down. It comes back sideways, usually at a wedding.",
    who: "Sigmund Freud", src: "The return of the repressed — “Repression” (1915)" },
  { t: "Deep down, nobody believes in their own death. That’s why you keep buying books you’ll read ‘one day’.",
    who: "Sigmund Freud", src: "“Thoughts for the Times on War and Death” (1915)" },
  { t: "That little ritual you do before leaving the house? Freud would call it a private religion. Fewer hymns. Same anxiety.",
    who: "Sigmund Freud", src: "“Obsessive Actions and Religious Practices” (1907)" },
  { t: "Breuer’s patient called it the talking cure. She also called it chimney sweeping. Both are messy. Both work.",
    who: "Sigmund Freud", src: "The talking cure — Studies on Hysteria (1895, with Josef Breuer)" },
  { t: "Freud’s big promise was to turn hysterical misery into common unhappiness. Set your goals around there and you won’t be disappointed.",
    who: "Sigmund Freud", src: "Common unhappiness — Studies on Hysteria (1895, with Josef Breuer)" },
  { t: "You can know something and not know it at the same time. You’ve been doing it with your bank balance for years.",
    who: "Sigmund Freud", src: "“Splitting of the Ego in the Process of Defence” (1940)" },
  { t: "Every family has rules nobody remembers making. Freud thought they began as guilt. Try asking where yours came from. Quietly.",
    who: "Sigmund Freud", src: "Totem and Taboo (1913)" },
  { t: "Fantasies you’re ashamed of are usually doing a job. Find out what the job is before you fire them.",
    who: "Sigmund Freud", src: "“A Child Is Being Beaten” (1919)" },
  { t: "The unconscious has no sense of time. That’s why a remark from 1997 can still ruin your Tuesday.",
    who: "Sigmund Freud", src: "Timelessness — “The Unconscious” (1915)" },
  { t: "Winnicott listed eighteen reasons a mother hates her baby. Eighteen. You’re allowed one or two about your flatmate.",
    who: "D. W. Winnicott", src: "“Hate in the Counter-Transference” (1949)" },
  { t: "Sentimentality is no use to children, Winnicott said, because it pretends hate isn’t there. Adults aren’t keen on it either.",
    who: "D. W. Winnicott", src: "Sentimentality — “Hate in the Counter-Transference” (1949)" },
  { t: "Your childhood blanket wasn’t silly. It was your first piece of philosophy: something that’s both you and not you. I’m the same, frankly.",
    who: "D. W. Winnicott", src: "“Transitional Objects and Transitional Phenomena” (1953)" },
  { t: "Nobody should ask a baby whether it found its blanket or invented it. Extend the same courtesy to adults and their opinions.",
    who: "D. W. Winnicott", src: "The paradox of the transitional object — Playing and Reality (1971)" },
  { t: "People only become real to you once you’ve been furious with them and they’ve survived it. So if they’re still here, that’s a good sign.",
    who: "D. W. Winnicott", src: "“The Use of an Object” (1969)" },
  { t: "Winnicott’s ideal greeting: ‘Hello. I destroyed you. I love you.’ Not recommended for first dates.",
    who: "D. W. Winnicott", src: "“The Use of an Object” (1969)" },
  { t: "The disaster you’re dreading may already have happened, long ago, before you could take it in. That’s why it feels so familiar.",
    who: "D. W. Winnicott", src: "“Fear of Breakdown” (1974)" },
  { t: "A baby looks at its mother’s face and sees itself. If the face was busy, the baby learned to perform. Some of those babies now run departments.",
    who: "D. W. Winnicott", src: "“Mirror-role of Mother and Family in Child Development” (1967)" },
  { t: "Guilt you can do something about is called concern. Guilt you just marinate in is called a hobby.",
    who: "D. W. Winnicott", src: "“The Development of the Capacity for Concern” (1963)" },
  { t: "Winnicott said everyone has a core that should never be communicated. You don’t owe the group chat everything.",
    who: "D. W. Winnicott", src: "“Communicating and Not Communicating” (1963)" },
  { t: "When a child steals, Winnicott saw a sign of hope: they’re looking for something they lost. Worth remembering about adults who take too much.",
    who: "D. W. Winnicott", src: "“The Antisocial Tendency” (1956)" },
  { t: "New parents go slightly mad in a very specific, useful way. Winnicott thought it was healthy. Their friends thought it was boring.",
    who: "D. W. Winnicott", src: "“Primary Maternal Preoccupation” (1956)" },
  { t: "Sometimes help isn’t advice. It’s holding things steady while someone falls apart in an orderly fashion.",
    who: "D. W. Winnicott", src: "Holding — “The Theory of the Parent–Infant Relationship” (1960)" },
  { t: "Winnicott said there’s no such thing as a baby, only a baby and someone. There’s no such thing as you either. Sorry.",
    who: "D. W. Winnicott", src: "“There is no such thing as a baby” — “Anxiety Associated with Insecurity” (1952)" },
  { t: "Aggression isn’t only destruction. It’s how you find out where the world stops and you start. Push gently.",
    who: "D. W. Winnicott", src: "“Aggression in Relation to Emotional Development” (1950)" },
  { t: "Art, music and hobbies live in the same room as your old teddy bear. That isn’t an insult. It’s the best room in the house.",
    who: "D. W. Winnicott", src: "“The Location of Cultural Experience” (1967)" },
  { t: "Living creatively doesn’t mean painting. It means doing the washing-up as if it were your idea.",
    who: "D. W. Winnicott", src: "“Living Creatively” (1970)" },
  { t: "Winnicott said health is much harder to deal with than illness. Once you’re well, you run out of excuses.",
    who: "D. W. Winnicott", src: "“The Concept of a Healthy Individual” (1967)" },
  { t: "Winnicott drew half a squiggle and let the child finish it. Try that with your next difficult conversation. Leave them half the line.",
    who: "D. W. Winnicott", src: "The squiggle game — Therapeutic Consultations in Child Psychiatry (1971)" },
  { t: "Falling to bits now and then isn’t always a crisis. Sometimes it’s just being unintegrated on a Sunday.",
    who: "D. W. Winnicott", src: "Unintegration — “Ego Integration in Child Development” (1962)" },
  { t: "People don’t grow because you push them. They grow because the conditions are right. Less pruning, more weather.",
    who: "D. W. Winnicott", src: "The holding environment — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "If the world kept barging in when you were small, you learned to react instead of simply be. You’re allowed to stop reacting now. Mute something.",
    who: "D. W. Winnicott", src: "Impingement — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "Winnicott called it going-on-being: the plain sense of continuing to exist. Underrated. Ask anyone who’s been through a thaw.",
    who: "D. W. Winnicott", src: "Going-on-being — The Maturational Processes and the Facilitating Environment (1965)" },
  { t: "When you’ve damaged something, the grown-up move isn’t endless apology. It’s repair. Bring soup.",
    who: "Melanie Klein", src: "Love, Guilt and Reparation (1937)" },
  { t: "When everything feels like an attack, you may be in what Klein called the paranoid-schizoid position. Everyone visits. Don’t sign a lease.",
    who: "Melanie Klein", src: "The paranoid-schizoid position — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Ever left a conversation feeling something that wasn’t yours? Someone may have posted it to you. Return to sender.",
    who: "Melanie Klein", src: "Projective identification — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Being relentlessly fine after a loss is what Klein called a manic defence. The party ends. The loss is still there, slightly hungover.",
    who: "Melanie Klein", src: "The manic defence — “A Contribution to the Psychogenesis of Manic-Depressive States” (1935)" },
  { t: "Greed wants everything inside, now, all of it. Gratitude can wait for seconds. Be more like gratitude. Leave some trifle.",
    who: "Melanie Klein", src: "Greed — Envy and Gratitude (1957)" },
  { t: "Klein thought some loneliness never leaves, however loved you are. It isn’t a fault. It’s the price of having an inside.",
    who: "Melanie Klein", src: "“On the Sense of Loneliness” (1963)" },
  { t: "Your adult world was designed by a baby with strong opinions. Many of its rules are still in force.",
    who: "Melanie Klein", src: "“Our Adult World and Its Roots in Infancy” (1959)" },
  { t: "Klein watched children play and read it like speech. Your hobbies are talking too. Mostly about your mother.",
    who: "Melanie Klein", src: "“The Psycho-Analytic Play Technique” (1955)" },
  { t: "You can lose yourself in someone so completely you forget whose feelings are whose. Very romantic. Very tiring.",
    who: "Melanie Klein", src: "“On Identification” (1955)" },
  { t: "Klein thought guilt was a sign of progress: you’ve realised the person you attacked in your head is the one you love. Congratulations. It’s awful.",
    who: "Melanie Klein", src: "Depressive guilt — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "You carry people around inside you, and they keep talking long after the real ones have gone quiet. Choose your tenants carefully.",
    who: "Melanie Klein", src: "Internal objects — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "Idealising someone is just splitting with better lighting.",
    who: "Melanie Klein", src: "Idealisation — “Notes on Some Schizoid Mechanisms” (1946)" },
  { t: "Klein thought art grows out of the wish to repair what we fear we’ve damaged. That’s why so many songs are apologies.",
    who: "Melanie Klein", src: "Reparation and creativity — “Infantile Anxiety Situations Reflected in a Work of Art” (1929)" },
  { t: "Every new loss reopens the old ones. That’s why a broken mug can make you cry about your grandmother.",
    who: "Melanie Klein", src: "Revived losses — “Mourning and its Relation to Manic-Depressive States” (1940)" },
  { t: "Klein said children’s urge to know is tangled up with anxiety. Curiosity and dread have always shared a room.",
    who: "Melanie Klein", src: "The epistemophilic impulse — “Early Stages of the Oedipus Conflict” (1928)" },
  { t: "Your phantasies aren’t daydreams. They’re the background music to everything. You’ve just stopped hearing them.",
    who: "Melanie Klein", src: "Unconscious phantasy — “The Psycho-Analytic Play Technique” (1955)" },
  { t: "Lacan said the only thing to feel guilty about is giving ground on your desire. That isn’t permission to quit your job. It isn’t not permission, either.",
    who: "Jacques Lacan", src: "Not giving ground on desire — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "There is no sexual relationship, Lacan said. He meant nobody ever fits perfectly. Stop trying to make the jigsaw pieces cooperate.",
    who: "Jacques Lacan", src: "“There is no sexual relationship” — Seminar XX: Encore (1972–73)" },
  { t: "Anxiety, Lacan said, is the one feeling that doesn’t deceive. Which is extremely inconvenient.",
    who: "Jacques Lacan", src: "Seminar X: Anxiety (1962–63)" },
  { t: "Anxiety shows up not when something’s missing, but when nothing is. Too much closeness, too much attention, too much of a good thing.",
    who: "Jacques Lacan", src: "Seminar X: Anxiety (1962–63)" },
  { t: "Love is giving what you don’t have. That’s Lacan’s definition. Useful at Christmas.",
    who: "Jacques Lacan", src: "Love as giving what you don’t have — Seminar VIII: Transference (1960–61)" },
  { t: "A letter always arrives at its destination. Lacan meant that what you’re avoiding will find you. Possibly via a cousin.",
    who: "Jacques Lacan", src: "“Seminar on ‘The Purloined Letter’” (1956)" },
  { t: "The thing you desire is never quite the thing. It’s a little extra something you can’t name. That’s why the shoes never look as good at home.",
    who: "Jacques Lacan", src: "Objet petit a — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "You don’t speak language so much as language speaks you. That’s why your mother’s phrases come out at the worst possible moments.",
    who: "Jacques Lacan", src: "“The Function and Field of Speech and Language in Psychoanalysis” (1953)" },
  { t: "‘I think where I am not, therefore I am where I do not think.’ Lacan wrote that. Don’t try it in a job interview.",
    who: "Jacques Lacan", src: "“The Instance of the Letter in the Unconscious” (1957)" },
  { t: "Rivalry is mostly about images. You’re not competing with that person. You’re competing with your reflection wearing their coat.",
    who: "Jacques Lacan", src: "Imaginary rivalry — Seminar II: The Ego in Freud’s Theory (1954–55)" },
  { t: "Lacan insisted there’s no final authority keeping score. Liberating. Also, nobody’s coming to tell you that you did well.",
    who: "Jacques Lacan", src: "The Other has no Other — “The Subversion of the Subject and the Dialectic of Desire” (1960)" },
  { t: "A symptom is a message you haven’t opened. You keep paying the postage on it.",
    who: "Jacques Lacan", src: "The symptom as message — “The Function and Field of Speech and Language in Psychoanalysis” (1953)" },
  { t: "Some pleasure hurts and you keep going back for it. Lacan called it jouissance. You call it looking at your ex’s holiday photos.",
    who: "Jacques Lacan", src: "Jouissance — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "The gaze isn’t you looking. It’s the feeling of being looked at by something that can’t see you. Like a dark window. Or a snowman.",
    who: "Jacques Lacan", src: "The gaze — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "Every family has its rules and a name to sign them with. Lacan thought you need one to stay sane. You don’t have to like it.",
    who: "Jacques Lacan", src: "The Name-of-the-Father — Seminar III: The Psychoses (1955–56)" },
  { t: "Repetition isn’t bad luck. It’s an appointment with something real that you keep missing.",
    who: "Jacques Lacan", src: "Repetition and the missed encounter — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "You trust the expert because you suppose they know. Lacan’s term was the subject supposed to know. Sometimes they’re just a person in a nice jumper.",
    who: "Jacques Lacan", src: "The subject supposed to know — Seminar XI: The Four Fundamental Concepts of Psychoanalysis (1964)" },
  { t: "There’s a lost Thing everyone circles and never reaches. Lacan put it at the heart of desire. My guess is it’s the perfect sandwich.",
    who: "Jacques Lacan", src: "Das Ding — Seminar VII: The Ethics of Psychoanalysis (1959–60)" },
  { t: "Lacan thought you can learn to make your symptom hold you together. James Joyce did it with a novel nobody can read. You can probably manage it with a hobby.",
    who: "Jacques Lacan", src: "The sinthome — Seminar XXIII: The Sinthome (1975–76)" },
  { t: "Your persona is a useful mask. The trouble starts when you forget to take it off and go to bed in it.",
    who: "Carl Jung", src: "The persona — “The Relations between the Ego and the Unconscious” (1928)" },
  { t: "Introverts aren’t shy. They just get their energy from the inside, like a fridge. Extraverts are more of a toaster.",
    who: "Carl Jung", src: "Psychological Types (1921)" },
  { t: "Jung said you can’t live the afternoon of life by the programme of the morning. Whatever your age, check which half of the day you’re in.",
    who: "Carl Jung", src: "“The Stages of Life” (1930)" },
  { t: "In middle age Jung built little stone villages by the lake, like a boy, and said it got him through. Your Lego is defensible.",
    who: "Carl Jung", src: "Memories, Dreams, Reflections (1962)" },
  { t: "Meaningful coincidences happen. Jung was sure of it. Just don’t move to Lisbon because you saw two trams.",
    who: "Carl Jung", src: "“Synchronicity: An Acausal Connecting Principle” (1952)" },
  { t: "When two parts of you disagree, don’t pick a winner. Let them argue until a third option turns up, slightly late, carrying cake.",
    who: "Carl Jung", src: "“The Transcendent Function” (1916)" },
  { t: "Everyone carries the same old cast around: the hero, the trickster, the wise old fool. Notice which one is driving today.",
    who: "Carl Jung", src: "Archetypes — The Archetypes and the Collective Unconscious (1959)" },
  { t: "There’s an eternal child in you that wants to start everything and finish nothing. Jung was fond of it. Your accountant won’t be.",
    who: "Carl Jung", src: "“The Psychology of the Child Archetype” (1940)" },
  { t: "The person you keep falling for may be a part of you that you’ve outsourced. Jung thought you should bring that work back in-house.",
    who: "Carl Jung", src: "Anima and animus — Aion (1951)" },
  { t: "Individuation isn’t becoming perfect. It’s becoming whole, which includes the embarrassing bits. Mostly the embarrassing bits.",
    who: "Carl Jung", src: "Individuation — Two Essays on Analytical Psychology (1928)" },
  { t: "Jung thought many of his patients suffered from a lack of meaning more than a diagnosis. Ask what you’re for, not just what’s wrong with you.",
    who: "Carl Jung", src: "Modern Man in Search of a Soul (1933)" },
  { t: "Jung worried that people hide in mass movements to avoid knowing themselves. The crowd is warm. It’s also stupid.",
    who: "Carl Jung", src: "The Undiscovered Self (1957)" },
  { t: "Jung said you don’t become enlightened by imagining figures of light, but by making the darkness conscious. Less fun. Fewer candles.",
    who: "Carl Jung", src: "Making the darkness conscious — “The Philosophical Tree” (1945)" },
  { t: "You don’t have complexes. Jung said complexes have you. They just let you think you’re in charge.",
    who: "Carl Jung", src: "“A Review of the Complex Theory” (1934)" },
  { t: "A dream is a self-portrait of where you actually are. Don’t argue with it. It isn’t trying to flatter you.",
    who: "Carl Jung", src: "“On the Nature of Dreams” (1945)" },
  { t: "Jung said only the wounded physician heals. Your most annoying scar may be your most useful qualification.",
    who: "Carl Jung", src: "The wounded healer — “Fundamental Questions of Psychotherapy” (1951)" },
  { t: "Sometimes the mind attacks its own connections so it doesn’t have to know what it knows. If you can’t think straight about one particular person, that’s a clue.",
    who: "Wilfred Bion", src: "“Attacks on Linking” (1959)" },
  { t: "Every meeting is secretly one of three things: waiting for a saviour, hunting for an enemy, or pairing off to produce a future. Watch the next one closely.",
    who: "Wilfred Bion", src: "Basic assumptions — Experiences in Groups (1961)" },
  { t: "Groups want a leader to depend on, then resent them for not being perfect. If you’re the leader, bring biscuits and lower expectations.",
    who: "Wilfred Bion", src: "Dependency groups — Experiences in Groups (1961)" },
  { t: "Thoughts exist before anyone thinks them, Bion said. The mind develops to cope with them. Some of yours are still waiting in reception.",
    who: "Wilfred Bion", src: "“A Theory of Thinking” (1962)" },
  { t: "Bion borrowed Keats’s negative capability: staying in uncertainty without reaching irritably for facts. Put the phone down. The answer can wait.",
    who: "Wilfred Bion", src: "Negative capability — Attention and Interpretation (1970)" },
  { t: "You can want to know something, or want very much not to. Bion had symbols for both. Most people use the second one more.",
    who: "Wilfred Bion", src: "K and minus K — Learning from Experience (1962)" },
  { t: "Bion called ultimate reality O. You can’t know it, only become it. Like snow. Nobody can explain snow. You just have to be out in it.",
    who: "Wilfred Bion", src: "O — Transformations (1965)" },
  { t: "Raw, undigested experience is what Bion called beta elements. They don’t get thought. They get thrown, usually at whoever’s nearest.",
    who: "Wilfred Bion", src: "Beta elements — Learning from Experience (1962)" },
  { t: "Dreaming is how the mind digests the day. Bad sleep, bad digestion. Have the cheese earlier.",
    who: "Wilfred Bion", src: "Alpha function — Learning from Experience (1962)" },
  { t: "Bion invented a grid to classify thoughts. It never caught on at parties, but it’s a reminder that not every idea in your head is the same kind of idea.",
    who: "Wilfred Bion", src: "The Grid — Elements of Psycho-Analysis (1963)" },
  { t: "Kohut thought people are driven less by sex and aggression than by the need to hold a self together. That’s why a small insult can feel like structural damage.",
    who: "Heinz Kohut", src: "The Restoration of the Self (1977)" },
  { t: "That out-of-proportion fury at a minor slight? Kohut called it narcissistic rage. The slight was small. The bruise it landed on wasn’t.",
    who: "Heinz Kohut", src: "“Thoughts on Narcissism and Narcissistic Rage” (1972)" },
  { t: "Everyone needs someone to look up to. The trick is picking someone who doesn’t mind being looked at.",
    who: "Heinz Kohut", src: "The idealising transference — The Analysis of the Self (1971)" },
  { t: "Kohut said people need to feel essentially alike with someone. That’s why meeting a stranger who hates the same song feels like love.",
    who: "Heinz Kohut", src: "Twinship — How Does Analysis Cure? (1984)" },
  { t: "Empathy, for Kohut, was a way of gathering information, not of being nice. You can understand someone perfectly and still not lend them money.",
    who: "Heinz Kohut", src: "“Introspection, Empathy, and Psychoanalysis” (1959)" },
  { t: "Small, bearable disappointments are how a self builds its own structure. Large ones just knock the scaffolding down.",
    who: "Heinz Kohut", src: "Optimal frustration — The Analysis of the Self (1971)" },
  { t: "You once believed you were the centre of the universe. Kohut thought that was healthy, as long as it grew up into ambition rather than a podcast.",
    who: "Heinz Kohut", src: "The grandiose self — The Analysis of the Self (1971)" },
  { t: "Freud’s man was guilty. Kohut’s man was tragic: less bad than unfinished. Which one sounds more like your week?",
    who: "Heinz Kohut", src: "Tragic Man — The Restoration of the Self (1977)" },
  { t: "When anxious, people move towards others, against them or away from them. If you manage all three before lunch, that’s a busy morning.",
    who: "Karen Horney", src: "Moving toward, against and away — Our Inner Conflicts (1945)" },
  { t: "You’ve built an idealised version of yourself and now you’re furious with the real one for not matching. The real one is doing its best.",
    who: "Karen Horney", src: "The idealised self — Neurosis and Human Growth (1950)" },
  { t: "Horney called it the search for glory. It’s a lovely search. It never finds anything.",
    who: "Karen Horney", src: "The search for glory — Neurosis and Human Growth (1950)" },
  { t: "Expecting the world to be fair to you specifically is what Horney called a neurotic claim. The world didn’t sign anything.",
    who: "Karen Horney", src: "Neurotic claims — Neurosis and Human Growth (1950)" },
  { t: "Basic anxiety is feeling small and alone in a world that seems hostile. It’s an old feeling. The world is mostly just busy.",
    who: "Karen Horney", src: "Basic anxiety — The Neurotic Personality of Our Time (1937)" },
  { t: "Horney believed you could analyse yourself with enough effort and honesty. It’s possible. It’s also like cutting your own fringe.",
    who: "Karen Horney", src: "Self-Analysis (1942)" },
  { t: "Horney suggested men might envy women’s ability to create life, and make up for it by building everything else. Look at a motorway with fresh eyes.",
    who: "Karen Horney", src: "Womb envy — “The Flight from Womanhood” (1926)" },
  { t: "Under the shoulds and the ideals there’s a real self that just wants to grow. It doesn’t need a plan. It needs light and less shouting.",
    who: "Karen Horney", src: "The real self — Neurosis and Human Growth (1950)" },
  { t: "Horney said we experience inner conflicts as if they were happening out there. Before you blame the traffic, check the driver.",
    who: "Karen Horney", src: "Externalisation — Our Inner Conflicts (1945)" },
  { t: "Needing everyone to like you is exhausting and, worse, it doesn’t work. Somebody always prefers dogs.",
    who: "Karen Horney", src: "The neurotic need for affection — The Neurotic Personality of Our Time (1937)" },
  { t: "Having mode: you own a library. Being mode: you read a book. Guess which one needs more shelving.",
    who: "Erich Fromm", src: "To Have or to Be? (1976)" },
  { t: "If you are what you have and you lose what you have, who are you? Fromm asked that. Your storage unit can’t answer.",
    who: "Erich Fromm", src: "To Have or to Be? (1976)" },
  { t: "When you treat yourself as a product, every bad day becomes a price drop. You are not on sale.",
    who: "Erich Fromm", src: "The marketing orientation — Man for Himself (1947)" },
  { t: "Fromm asked whether a whole society can be sick. If everyone around you is exhausted and calls it normal, consider the possibility.",
    who: "Erich Fromm", src: "The Sane Society (1955)" },
  { t: "For Fromm, giving isn’t losing. It’s an expression of strength. So stop calling it a sacrifice when you make someone tea.",
    who: "Erich Fromm", src: "Giving — The Art of Loving (1956)" },
  { t: "Selfish people don’t love themselves too much, Fromm said. They love themselves too little. They’re just very loud about it.",
    who: "Erich Fromm", src: "Self-love — The Art of Loving (1956)" },
  { t: "Falling in love is easy. Standing in it is the hard part. Most people don’t bring the right shoes.",
    who: "Erich Fromm", src: "Falling in love versus standing in love — The Art of Loving (1956)" },
  { t: "Fromm said love needs discipline, concentration and patience. Those are the three things your phone was designed to destroy.",
    who: "Erich Fromm", src: "Discipline, concentration, patience — The Art of Loving (1956)" },
  { t: "Fromm thought a lot of cruelty comes from boredom. If you’re being mean, try a hobby first.",
    who: "Erich Fromm", src: "Boredom and destructiveness — The Anatomy of Human Destructiveness (1973)" },
  { t: "Fromm called love of life biophilia. Some people are drawn to things that grow, others to things that stay tidy. Your houseplants know which you are.",
    who: "Erich Fromm", src: "Biophilia — The Heart of Man (1964)" },
  { t: "Fromm warned about thinking what you’re supposed to think and feeling it’s your own idea. Check the last opinion you were absolutely sure of.",
    who: "Erich Fromm", src: "Automaton conformity — Escape from Freedom (1941)" },
  { t: "Some people need someone to bow to and someone to kick. Fromm called it the authoritarian character. You’ve met him in middle management.",
    who: "Erich Fromm", src: "The authoritarian character — Escape from Freedom (1941)" },
  { t: "Erikson’s first stage is trust versus mistrust. It’s settled in infancy and reopened every time someone says ‘we need to talk’.",
    who: "Erik Erikson", src: "Trust vs. mistrust — Childhood and Society (1950)" },
  { t: "Toddlers fight for autonomy and get shame if it goes badly. That’s why being corrected in public still makes you want to bite someone.",
    who: "Erik Erikson", src: "Autonomy vs. shame — Childhood and Society (1950)" },
  { t: "Some people never start anything because starting got them into trouble at five. You’re bigger now. Start something.",
    who: "Erik Erikson", src: "Initiative vs. guilt — Childhood and Society (1950)" },
  { t: "School taught you to feel either competent or inferior. Most adults are still waiting for their marks.",
    who: "Erik Erikson", src: "Industry vs. inferiority — Childhood and Society (1950)" },
  { t: "Erikson coined ‘identity crisis’. He meant a normal stage, not a disaster. The motorbike is optional.",
    who: "Erik Erikson", src: "The identity crisis — Identity: Youth and Crisis (1968)" },
  { t: "Erikson thought young people need a moratorium: time to try things on without committing. Adults need one too. It’s called a weekend.",
    who: "Erik Erikson", src: "The psychosocial moratorium — Identity: Youth and Crisis (1968)" },
  { t: "You can’t be properly close to someone until you know roughly who you are. Otherwise you’re just merging, like two snowmen in a thaw.",
    who: "Erik Erikson", src: "Intimacy vs. isolation — Childhood and Society (1950)" },
  { t: "In middle age the question is whether you’re making something that outlasts you. Children count. So does a well-kept sourdough starter.",
    who: "Erik Erikson", src: "Generativity vs. stagnation — The Life Cycle Completed (1982)" },
  { t: "Erikson’s last stage is accepting the one life you had as the one you had to have. It’s the hardest exam. There’s no resit.",
    who: "Erik Erikson", src: "Integrity vs. despair — The Life Cycle Completed (1982)" },
  { t: "Erikson admired Gandhi enormously and still wrote him a letter pointing out his flaws. You can admire someone and keep your eyes open.",
    who: "Erik Erikson", src: "Gandhi’s Truth (1969)" },
  { t: "Each stage of life is meant to leave you with a virtue: hope, will, purpose, competence, fidelity, love, care, wisdom. Check the inventory. Something may be on back order.",
    who: "Erik Erikson", src: "The basic virtues — Insight and Responsibility (1964)" },
  { t: "Living through other people’s wishes because you can’t stand your own is what Anna Freud called altruistic surrender. Generous-looking. Actually a hiding place.",
    who: "Anna Freud", src: "Altruistic surrender — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Teenagers argue about philosophy at 2 a.m. to keep their feelings at a safe distance. Adults do it in meetings.",
    who: "Anna Freud", src: "Intellectualisation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Sudden extreme self-denial is often a way of managing urges that feel too big. The juice cleanse is not just about juice.",
    who: "Anna Freud", src: "Adolescent asceticism — The Ego and the Mechanisms of Defence (1936)" },
  { t: "If someone is suspiciously nice to you, it may be reaction formation. Enjoy the biscuits. Watch the eyes.",
    who: "Anna Freud", src: "Reaction formation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Shouting at the printer is displacement. The printer understands. Your partner may not.",
    who: "Anna Freud", src: "Displacement — The Ego and the Mechanisms of Defence (1936)" },
  { t: "When anger has nowhere safe to go, it turns inward. If you’re being hard on yourself, ask who you’re actually cross with.",
    who: "Anna Freud", src: "Turning against the self — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Anna Freud thought development runs along lines, and nobody’s are perfectly straight. Wobbly is normal. Straight is suspicious.",
    who: "Anna Freud", src: "Developmental lines — Normality and Pathology in Childhood (1965)" },
  { t: "Turning an urge into something useful is called sublimation. It’s how rage becomes a cleaning spree.",
    who: "Anna Freud", src: "Sublimation — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Children deny reality in fantasy to cope. Adults do it with spreadsheets.",
    who: "Anna Freud", src: "Denial in fantasy — The Ego and the Mechanisms of Defence (1936)" },
  { t: "Protest, despair, detachment. That’s how small children respond to being left. Adults do it too, but call the last stage ‘being fine about it’.",
    who: "John Bowlby", src: "Protest, despair, detachment — Attachment and Loss, Vol. 2: Separation (1973)" },
  { t: "Grief includes searching for the person you’ve lost. Seeing them in crowds isn’t madness. It’s love doing its job too late.",
    who: "John Bowlby", src: "Searching — Attachment and Loss, Vol. 3: Loss (1980)" },
  { t: "You carry a map of how close people behave, drawn when you were tiny. It may be out of date. Maps usually are.",
    who: "John Bowlby", src: "Internal working models — Attachment and Loss, Vol. 2: Separation (1973)" },
  { t: "A secure base isn’t somewhere you stay. It’s somewhere you leave from and come back to. Like a good café.",
    who: "John Bowlby", src: "A Secure Base (1988)" },
  { t: "Bowlby found that many young thieves had been separated from their mothers early. Sometimes taking things is a way of taking back.",
    who: "John Bowlby", src: "“Forty-Four Juvenile Thieves” (1944)" },
  { t: "Bowlby told the world that children need warmth as much as food. The world was surprised. It shouldn’t have been.",
    who: "John Bowlby", src: "Maternal Care and Mental Health (1951)" },
  { t: "Bowlby described compulsive self-reliance: never needing anyone, very impressively. It’s a lot of work to look that unbothered.",
    who: "John Bowlby", src: "Compulsive self-reliance — Attachment and Loss, Vol. 3: Loss (1980)" },
  { t: "In Ainsworth’s Strange Situation, secure toddlers were upset when their mother left and comforted when she came back. That’s the whole goal. Upset, then comforted.",
    who: "Mary Ainsworth", src: "Secure attachment — Patterns of Attachment (1978)" },
  { t: "Avoidant toddlers looked calm when their mother left, but their bodies told a different story. Looking fine and being fine are different measurements.",
    who: "Mary Ainsworth", src: "Avoidant attachment — Patterns of Attachment (1978)" },
  { t: "Some toddlers clung and pushed away at the same time. If your texts read like that, you’re in good, if sticky, company.",
    who: "Mary Ainsworth", src: "Ambivalent attachment — Patterns of Attachment (1978)" },
  { t: "A child would rather believe they’re bad than that their parents are. Fairbairn: better a sinner in a world ruled by God than live in one ruled by the Devil. Some people are still paying that tax.",
    who: "W. R. D. Fairbairn", src: "The moral defence — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Fairbairn thought we aren’t after pleasure so much as people. Which explains why you’ll sit through a dull evening for the right company.",
    who: "W. R. D. Fairbairn", src: "Libido is object-seeking — Psychoanalytic Studies of the Personality (1952)" },
  { t: "The person who’s thrilling and unavailable? Fairbairn called them the exciting object. The thrill is the unavailability. Sorry.",
    who: "W. R. D. Fairbairn", src: "The exciting object — Psychoanalytic Studies of the Personality (1952)" },
  { t: "There’s a part of you that attacks your own neediness. Fairbairn called it the internal saboteur. It works long hours and never gets thanked.",
    who: "W. R. D. Fairbairn", src: "The internal saboteur — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Some people keep their love locked inside because they fear it destroys. They seem cold. They’re actually storing it very carefully.",
    who: "W. R. D. Fairbairn", src: "“Schizoid Factors in the Personality” (1940)" },
  { t: "Fairbairn didn’t think the goal was independence. It was mature dependence: needing people without vanishing into them.",
    who: "W. R. D. Fairbairn", src: "Mature dependence — Psychoanalytic Studies of the Personality (1952)" },
  { t: "Ferenczi said tact is the capacity to feel with someone. That isn’t the same as being polite. Polite people can be very tactless.",
    who: "Sándor Ferenczi", src: "Tact — “The Elasticity of Psycho-Analytic Technique” (1928)" },
  { t: "Ferenczi wondered whether analysts hid their own feelings behind professional calm. You might be doing the same behind ‘I’m just busy’.",
    who: "Sándor Ferenczi", src: "The Clinical Diary (1932)" },
  { t: "Ferenczi noticed that children who feel unwanted can lose their hold on life in quiet ways. If you’ve always felt like an extra, that feeling has a history.",
    who: "Sándor Ferenczi", src: "“The Unwelcome Child and His Death-Instinct” (1929)" },
  { t: "Ferenczi thought we long to return to the sea we came from. It explains the bath. It doesn’t explain bath bombs.",
    who: "Sándor Ferenczi", src: "Thalassa: A Theory of Genitality (1924)" },
  { t: "Children speak the language of tenderness. When adults answer in the language of passion, damage follows. Mind your translation.",
    who: "Sándor Ferenczi", src: "Tenderness and passion — “Confusion of Tongues between Adults and the Child” (1933)" },
  { t: "Ferenczi experimented with letting patients analyse him back. It went badly. Still, fair question: who listens to the listener?",
    who: "Sándor Ferenczi", src: "Mutual analysis — The Clinical Diary (1932)" },
  { t: "Ferenczi described the wise baby: a child forced to grow up too soon to look after the adults. Some become therapists. Some become party planners.",
    who: "Sándor Ferenczi", src: "The wise baby — “Confusion of Tongues between Adults and the Child” (1933)" },
  { t: "Some problems aren’t conflicts. Balint called it a basic fault: something missing rather than something wrong. You can’t fix it by arguing.",
    who: "Michael Balint", src: "The Basic Fault (1968)" },
  { t: "Balint said some people cling to things and some love the empty spaces between them. Your holiday choices will tell you which you are.",
    who: "Michael Balint", src: "Ocnophils — Thrills and Regressions (1959)" },
  { t: "If you love rollercoasters, Balint thought you enjoy leaving safety knowing you’ll get back to it. Very healthy. Very loud.",
    who: "Michael Balint", src: "Philobats — Thrills and Regressions (1959)" },
  { t: "Balint said the most frequently prescribed drug is the doctor. Same with friends. Pick ones with tolerable side effects.",
    who: "Michael Balint", src: "The doctor as drug — The Doctor, His Patient and the Illness (1957)" },
  { t: "We keep hunting for things that will transform us, the way the first person who held us transformed everything. Holidays, lovers, new kitchens. Same search.",
    who: "Christopher Bollas", src: "The transformational object — The Shadow of the Object (1987)" },
  { t: "Bollas described normotic people: aggressively normal, allergic to inner life. Sometimes the most worrying person in the room is the one who’s never worried.",
    who: "Christopher Bollas", src: "Normotic illness — The Shadow of the Object (1987)" },
  { t: "Bollas separates fate, which happens to you, from destiny, which you make of it. Everyone gets fate. Destiny takes a bit of effort.",
    who: "Christopher Bollas", src: "Fate and destiny — Forces of Destiny (1989)" },
  { t: "Bollas says we use objects, places and people to express parts of ourselves. Your choice of mug is a tiny autobiography.",
    who: "Christopher Bollas", src: "Being a Character (1992)" },
  { t: "Some things just evoke you: a song, a street, the smell of toast. Bollas treats them as letters from your own unconscious.",
    who: "Christopher Bollas", src: "Evocative objects — Being a Character (1992)" },
  { t: "Cracking up at a joke and cracking up under pressure use the same machinery, Bollas suggests. Laugh when you can. It’s cheaper maintenance.",
    who: "Christopher Bollas", src: "Cracking Up (1995)" },
  { t: "Free association is the mind’s natural way of thinking, Bollas says. Logic is the tidy version it shows to guests.",
    who: "Christopher Bollas", src: "The Mystery of Things (1999)" },
  { t: "Bollas worries that modern life discourages reflection. If you can’t remember your last uninterrupted thought, he may have a point.",
    who: "Christopher Bollas", src: "Meaning and Melancholia (2018)" },
  { t: "Bollas describes people who steal pieces of your inner life: your feelings, your memories, your best story. You know who’s been telling your anecdotes.",
    who: "Christopher Bollas", src: "Extractive introjection — The Shadow of the Object (1987)" },
  { t: "Being loved as an object is flattering. Being recognised as a subject is better. One wants you. The other wants to know you.",
    who: "Jessica Benjamin", src: "Like Subjects, Love Objects (1995)" },
  { t: "When an argument turns into ‘who’s doing what to whom’, you need what Benjamin calls the third: a shared space where nobody has to win.",
    who: "Jessica Benjamin", src: "The third — Beyond Doer and Done To (2018)" },
  { t: "Relationships don’t avoid rupture. They survive it through repair. The glue is what makes the bowl interesting.",
    who: "Jessica Benjamin", src: "Rupture and repair — Beyond Doer and Done To (2018)" },
  { t: "‘I hurt you and I can see it’ is worth more than any number of ‘I’m sorry you feel that way’.",
    who: "Jessica Benjamin", src: "Acknowledgment — Beyond Doer and Done To (2018)" },
  { t: "Phillips calls boredom a state of suspended anticipation: waiting for a desire you don’t have yet. Don’t fill it straight away. Something might turn up.",
    who: "Adam Phillips", src: "Boredom — On Kissing, Tickling, and Being Bored (1993)" },
  { t: "You can’t tickle yourself. Phillips finds that telling. Some pleasures need somebody else, however much you’d rather they didn’t.",
    who: "Adam Phillips", src: "Tickling — On Kissing, Tickling, and Being Bored (1993)" },
  { t: "Phillips wrote a whole book of aphorisms on monogamy. The gist: everyone’s working on it, and nobody’s quite sure what ‘it’ is.",
    who: "Adam Phillips", src: "Monogamy (1996)" },
  { t: "There are shelves of books about madness and almost none about sanity. Phillips found that odd. Maybe sanity is less dull than advertised.",
    who: "Adam Phillips", src: "Going Sane (2005)" },
  { t: "Kindness, Phillips and Taylor argue, has become a forbidden pleasure. People are suspicious of it. Be kind anyway. Confuse them.",
    who: "Adam Phillips", src: "On Kindness (2009, with Barbara Taylor)" },
  { t: "Phillips thinks frustration is where you find out what you want. Don’t rush through it. It’s the only map you’ve got.",
    who: "Adam Phillips", src: "Frustration — Missing Out: In Praise of the Unlived Life (2012)" },
  { t: "Phillips wonders whether balance is overrated. Some of the best things involve losing it. Mostly falling in love. Also ice.",
    who: "Adam Phillips", src: "On Balance (2010)" },
  { t: "Phillips thinks analysis should run on curiosity, not expertise. Distrust anyone who knows exactly what your dream means. Including me.",
    who: "Adam Phillips", src: "Terrors and Experts (1995)" },
  { t: "Darwin and Freud both showed how much happens without a designer. Your life doesn’t need a plot. Worms manage without one.",
    who: "Adam Phillips", src: "Darwin’s Worms (1999)" },
  { t: "People want to be cured of their desires about as much as they want them satisfied. Be clear which one you’re asking for.",
    who: "Adam Phillips", src: "Promises, Promises (2000)" },
  { t: "We obsess over forbidden pleasures and ignore the unforbidden ones. A walk. A nap. A sandwich. They’re allowed, which is exactly why nobody notices them.",
    who: "Adam Phillips", src: "Unforbidden Pleasures (2015)" },
  { t: "Attention seeking, Phillips points out, is just seeking. Everyone’s doing it. Some people are simply more honest about the volume.",
    who: "Adam Phillips", src: "Attention Seeking (2019)" },
  { t: "Phillips is suspicious of conversion stories. Wanting to become a whole new person can be a way of not knowing what you want. I change every March and I’m still me.",
    who: "Adam Phillips", src: "On Wanting to Change (2021)" },
  { t: "Getting better might just mean getting better at being who you already are. A relief, if a slightly disappointing one.",
    who: "Adam Phillips", src: "On Getting Better (2021)" },
  { t: "Phillips wrote a whole book about giving up. Some things deserve to be abandoned. Not all of them are hobbies.",
    who: "Adam Phillips", src: "On Giving Up (2024)" },
  { t: "Mitchell said people arrive in therapy with hope and dread in equal measure. Same as people arriving at parties.",
    who: "Stephen A. Mitchell", src: "Hope and Dread in Psychoanalysis (1993)" },
  { t: "Romance doesn’t die of familiarity, Mitchell argued. It dies of people pretending they know each other completely. Nobody does. Stay curious.",
    who: "Stephen A. Mitchell", src: "Can Love Last? (2002)" },
  { t: "You can be influenced and still be yourself. The opposite of autonomy isn’t influence. It’s pretending you were never influenced.",
    who: "Stephen A. Mitchell", src: "Influence and Autonomy in Psychoanalysis (1997)" },
  { t: "We want safety and adventure from the same person. Mitchell thought it was possible. Difficult, but possible. Like keeping a snowman in June.",
    who: "Stephen A. Mitchell", src: "Safety and adventure — Can Love Last? (2002)" },
  { t: "The shudder you feel at the skin on warm milk? Kristeva called it abjection: the border between you and not-you, defended violently.",
    who: "Julia Kristeva", src: "Abjection — Powers of Horror (1980)" },
  { t: "Kristeva called depression a black sun: a light inside that gives no warmth. If it’s shining in you, don’t wait for it to set by itself. Tell someone.",
    who: "Julia Kristeva", src: "Black Sun: Depression and Melancholia (1987)" },
  { t: "Kristeva thought love is where we lose our boundaries and build new ones. Messy architecture. Worth the planning permission.",
    who: "Julia Kristeva", src: "Tales of Love (1983)" },
  { t: "Kristeva believed in intimate revolt: questioning yourself, not only the world. The world is busy anyway.",
    who: "Julia Kristeva", src: "Intimate revolt — The Sense and Non-Sense of Revolt (1996)" },
  { t: "Green’s dead mother isn’t dead. She’s there but emotionally absent. If you’ve spent years trying to wake someone up, that may be the shape of it.",
    who: "André Green", src: "“The Dead Mother” (1980)" },
  { t: "Green was interested in absences that shape you as much as presences do. The empty chair has a personality.",
    who: "André Green", src: "The Work of the Negative (1993)" },
  { t: "Some narcissism keeps you alive. Some just wants to be left alone for ever. Know which one is talking when you cancel plans.",
    who: "André Green", src: "Life Narcissism, Death Narcissism (1983)" },
  { t: "Parents send messages they don’t understand themselves. You’ve spent years decoding something nobody encoded on purpose.",
    who: "Jean Laplanche", src: "The enigmatic signifier — New Foundations for Psychoanalysis (1987)" },
  { t: "Some events only become wounds later, when you finally understand them. That’s why a memory can change its meaning at forty.",
    who: "Jean Laplanche", src: "“Notes on Afterwardsness” — Essays on Otherness (1999)" },
  { t: "In any close relationship there’s a third thing, made of both of you, that neither of you owns. That’s usually what you’re arguing with.",
    who: "Thomas Ogden", src: "The analytic third — Subjects of Analysis (1994)" },
  { t: "Ogden treated his own drifting thoughts in sessions as information about the patient. Next time your mind wanders mid-conversation, notice where it goes.",
    who: "Thomas Ogden", src: "“Reverie and Interpretation” (1997)" },
  { t: "Ogden describes analysis as helping people dream the dreams they couldn’t dream alone. Good friends do this too, usually over chips.",
    who: "Thomas Ogden", src: "Dreaming undreamt dreams — This Art of Psychoanalysis (2005)" },
  { t: "Ogden added a layer beneath Klein’s two positions: a floor of pure sensation. Sometimes you don’t need insight. You need a blanket.",
    who: "Thomas Ogden", src: "The autistic-contiguous position — The Primitive Edge of Experience (1989)" },
  { t: "Rank thought every later separation echoes birth. Leaving a job, a house, a party early. All very dramatic. All slightly damp.",
    who: "Otto Rank", src: "The Trauma of Birth (1924)" },
  { t: "Rank said we fear life, which means standing out, and death, which means dissolving. Most people compromise by standing slightly to one side.",
    who: "Otto Rank", src: "Life fear and death fear — Will Therapy (1936)" },
  { t: "Rank thought the artist turns private struggle into form. If you’re struggling anyway, you might as well make something with it.",
    who: "Otto Rank", src: "Art and Artist (1932)" },
  { t: "Rank saw the will as creative, not merely stubborn. Of course, everyone thinks their own stubbornness is creative.",
    who: "Otto Rank", src: "The creative will — Will Therapy (1936)" },
  { t: "Sullivan said we are all much more simply human than otherwise. Remember that next time someone seems like an alien. Even me.",
    who: "Harry Stack Sullivan", src: "The one-genus postulate — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "Sullivan called it selective inattention: not noticing precisely the things you’d rather not. Your inbox is a museum of it.",
    who: "Harry Stack Sullivan", src: "Selective inattention — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "Sullivan said we sort ourselves into good-me, bad-me and not-me. Not-me is the one that makes you go cold at parties.",
    who: "Harry Stack Sullivan", src: "Good-me, bad-me, not-me — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "When a conversation gets anxious, people run what Sullivan called security operations: jokes, topic changes, sudden interest in the weather. I’ve been running one since November.",
    who: "Harry Stack Sullivan", src: "Security operations — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "Sullivan thought a best friend at nine or ten teaches you to care about someone as much as yourself. If you missed it, it isn’t too late. Just more awkward.",
    who: "Harry Stack Sullivan", src: "Chumship — The Interpersonal Theory of Psychiatry (1953)" },
  { t: "A baby bangs a spoon and the parent says ‘yeah!’ in the same rhythm. Stern called it affect attunement. Adults call it ‘getting’ someone.",
    who: "Daniel Stern", src: "Affect attunement — The Interpersonal World of the Infant (1985)" },
  { t: "Stern thought change happens in present moments lasting a few seconds. Not everything takes years. Some things just take a pause.",
    who: "Daniel Stern", src: "The Present Moment in Psychotherapy and Everyday Life (2004)" },
  { t: "Stern imagined a baby’s diary: a world of weather, hunger and faces. You feel exactly the same before coffee.",
    who: "Daniel Stern", src: "Diary of a Baby (1990)" },
  { t: "If you feel like a different person in every room, Kernberg would ask whether the rooms ever talk to each other. Usually they don’t.",
    who: "Otto Kernberg", src: "Identity diffusion — Borderline Conditions and Pathological Narcissism (1975)" },
  { t: "Kernberg thought mature love includes a bit of aggression. Teasing is allowed. So is wanting them out of the room for an hour.",
    who: "Otto Kernberg", src: "Love Relations: Normality and Pathology (1995)" },
  { t: "Everyone feels inferior. Adler thought that feeling drives all striving. Your insecurity isn’t a fault. It’s fuel. Mind the fumes.",
    who: "Alfred Adler", src: "The inferiority feeling — Understanding Human Nature (1927)" },
  { t: "Adler measured mental health by social interest: how much you care about other people. Self-care alone won’t raise the score.",
    who: "Alfred Adler", src: "Social interest — What Life Should Mean to You (1931)" },
  { t: "Adler thought life sets three big tasks: work, friendship and love. Two out of three is a good year.",
    who: "Alfred Adler", src: "The three life tasks — What Life Should Mean to You (1931)" },
  { t: "Adler noticed eldest, middle and youngest children tend to take different roles. Your sibling isn’t wrong. They just had a different seat at the table.",
    who: "Alfred Adler", src: "Birth order — Understanding Human Nature (1927)" },
  { t: "By about five, Adler thought, you’ve chosen a style of life. You can change it later. Most people just redecorate.",
    who: "Alfred Adler", src: "Style of life — Understanding Human Nature (1927)" },
  { t: "Reich thought people wear their defences in their bodies: tight jaws, raised shoulders. Drop your shoulders now. See?",
    who: "Wilhelm Reich", src: "Character armour — Character Analysis (1933)" },
  { t: "Reich said how someone says things matters more than what they say. Listen to the tune, not just the words.",
    who: "Wilhelm Reich", src: "Character Analysis (1933)" },
  { t: "Riviere wrote that femininity can be worn as a mask to soften the backlash against success. Any role can be a costume. Check the label.",
    who: "Joan Riviere", src: "“Womanliness as a Masquerade” (1929)" },
  { t: "Some people get worse when helped, Riviere noticed, because getting better feels like abandoning someone they love. Recovery can feel like betrayal.",
    who: "Joan Riviere", src: "“A Contribution to the Analysis of the Negative Therapeutic Reaction” (1936)" },
  { t: "Milner kept a diary to find out what actually made her happy. The answers surprised her. Yours might surprise you. Keep notes.",
    who: "Marion Milner", src: "A Life of One’s Own (1934, as Joanna Field)" },
  { t: "Milner found that widening her attention, instead of narrowing it, made ordinary things vivid. Try taking in the whole room. Not just your phone.",
    who: "Marion Milner", src: "Wide attention — A Life of One’s Own (1934, as Joanna Field)" },
  { t: "Milner couldn’t paint until she stopped trying to make it look right. Same goes for most things you’re bad at.",
    who: "Marion Milner", src: "On Not Being Able to Paint (1950)" },
  { t: "Milner worked with one patient for about twenty years, largely through drawings. Some things take that long. Patience isn’t a delay. It’s the treatment.",
    who: "Marion Milner", src: "The Hands of the Living God (1969)" },
  { t: "Milner thought frames matter: the edge of a picture, the end of an hour. Give your day an edge. It helps to know where it stops.",
    who: "Marion Milner", src: "The frame — “The Role of Illusion in Symbol Formation” (1952)" },
  { t: "When a symbol is treated as the real thing, trouble follows. A present is not the love. A text is not the person.",
    who: "Hanna Segal", src: "The symbolic equation — “Notes on Symbol Formation” (1957)" },
  { t: "Segal thought beauty comes from mourning: making something whole out of what was lost. Ruins are popular for a reason.",
    who: "Hanna Segal", src: "“A Psycho-Analytical Approach to Aesthetics” (1952)" },
  { t: "Joseph described people quietly addicted to despair. If your misery has become oddly comfortable, it may be time to redecorate.",
    who: "Betty Joseph", src: "“Addiction to Near-Death” (1982)" },
  { t: "Joseph saw how people pull others into old patterns without noticing. If every boss turns into your father, check what you’re auditioning them for.",
    who: "Betty Joseph", src: "Psychic Equilibrium and Psychic Change (1989)" },
  { t: "Rosenfeld described part of the self that runs like a gang, promising protection as long as you never depend on anyone. Gangs always say that.",
    who: "Herbert Rosenfeld", src: "Destructive narcissism — “A Clinical Approach to the Psychoanalytic Theory of the Life and Death Instincts” (1971)" },
  { t: "Steiner described psychic retreats: inner hideouts that protect you from pain and progress in equal measure. Lovely view. No exit sign.",
    who: "John Steiner", src: "Psychic Retreats (1993)" },
  { t: "Steiner writes that shame is about being seen at the wrong moment. The cure is usually being seen properly, at the right one.",
    who: "John Steiner", src: "Seeing and Being Seen (2011)" },
  { t: "Symington thought narcissism means turning away from whatever could give you life, because you didn’t make it yourself. Take the help. You can still pretend it was your idea.",
    who: "Neville Symington", src: "The lifegiver — Narcissism: A New Theory (1993)" },
  { t: "Gifted children, Alice Miller wrote, learn early to sense what their parents need. They become brilliant at it, and forget what they need themselves.",
    who: "Alice Miller", src: "The Drama of the Gifted Child (1979)" },
  { t: "Miller saw depression as grief for a self you were never allowed to be. Grieve it. Then go and meet them.",
    who: "Alice Miller", src: "Depression as grief — The Drama of the Gifted Child (1979)" },
  { t: "Miller wrote about cruelty disguised as good upbringing. ‘For your own good’ is a phrase worth listening to very carefully.",
    who: "Alice Miller", src: "For Your Own Good (1980)" },
  { t: "Hartmann said a child needs an average expectable environment. Not a perfect one. Average. Like a Tuesday.",
    who: "Heinz Hartmann", src: "The average expectable environment — Ego Psychology and the Problem of Adaptation (1939)" },
  { t: "Mahler said psychological birth happens long after the physical one. Some people are still in labour at forty.",
    who: "Margaret Mahler", src: "The Psychological Birth of the Human Infant (1975)" },
  { t: "Toddlers run off, panic and run back. Mahler called it rapprochement. You do it with every new job.",
    who: "Margaret Mahler", src: "Rapprochement — The Psychological Birth of the Human Infant (1975)" },
  { t: "Becoming your own person means separating without losing the connection. It’s a dance, and everybody treads on toes.",
    who: "Margaret Mahler", src: "Separation-individuation — The Psychological Birth of the Human Infant (1975)" },
  { t: "Deutsch described ‘as-if’ people who seem perfectly normal but feel nothing quite real. Do something today you actually feel, even if it’s only a strong opinion about soup.",
    who: "Helene Deutsch", src: "The ‘as-if’ personality — “Some Forms of Emotional Disturbance and Their Relationship to Schizophrenia” (1942)" },
  { t: "Chodorow argued that who does the early caring shapes how children learn to relate. Change who holds the baby and you change rather a lot.",
    who: "Nancy Chodorow", src: "The Reproduction of Mothering (1978)" },
  { t: "Juliet Mitchell said psychoanalysis forgot about siblings. Your first rival didn’t arrive at work. They arrived in a carrycot.",
    who: "Juliet Mitchell", src: "Siblings (2003)" },
  { t: "Leader argues we’ve medicalised grief and forgotten mourning. You aren’t malfunctioning. You’re mourning. It keeps its own timetable.",
    who: "Darian Leader", src: "The New Black (2008)" },
  { t: "Leader writes about the letters we write and never send. They’re still communication. Just with yourself.",
    who: "Darian Leader", src: "Why Do Women Write More Letters Than They Post? (1996)" },
  { t: "Leader distinguishes being mad from going mad. Plenty of people are quietly mad and functioning beautifully. Don’t panic.",
    who: "Darian Leader", src: "What Is Madness? (2011)" },
  { t: "Leader thinks insomnia often stands in for something that can’t be said. If you’re awake at 3 a.m., something wants a hearing.",
    who: "Darian Leader", src: "Why Can’t We Sleep? (2019)" },
  { t: "Grosz notes that praising children for being clever can make them afraid to fail. Praise the effort. Then go and try something difficult yourself.",
    who: "Stephen Grosz", src: "The Examined Life (2013)" },
  { t: "Grosz tells of people who’d rather stay stuck than change. It isn’t stupidity. Change involves loss, and loss is expensive.",
